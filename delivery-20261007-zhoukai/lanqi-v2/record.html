/* ===== AI客户分析 私有样式（共享部分在 lanqi-ui.css） ===== */

/* ⓪ 返回行 + 客户切换器 */
.top-row { display: flex; align-items: center; gap: 10px; }
.back-link {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 800;
  color: var(--o3); background: var(--soft); border: 1px solid var(--line2);
  border-radius: 999px; padding: 7px 14px; transition: transform .15s; flex-shrink: 0;
}
.back-link:active { transform: scale(.95); }
.top-hint { font-size: 11px; color: var(--t3); font-weight: 600; }
.cust-switch { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
.cust-switch::-webkit-scrollbar { display: none; }
.cs-chip {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 999px;
  padding: 6px 12px 6px 7px; font-size: 12.5px; font-weight: 800; color: var(--t2);
  box-shadow: var(--shadow-s); transition: all .15s;
}
.cs-chip:active { transform: scale(.96); }
.cs-chip.on { border-color: var(--o1); background: var(--soft); color: var(--t1); box-shadow: 0 4px 14px rgba(255,106,0,.18); }
.cs-ava { width: 26px; height: 26px; border-radius: 50%; background: var(--og); color: #fff; display: grid; place-items: center; font-size: 11.5px; font-weight: 900; }
.cs-g { font-size: 9.5px; font-weight: 900; border-radius: 99px; padding: 1px 7px; }
.gd-A { background: var(--og); color: #fff; }
.gd-B { background: #E8F0FE; color: var(--blue); }
.gd-C { background: #FDF3E0; color: var(--amber); }
.gd-D { background: #FCE9EB; color: var(--red); }

/* ① 单客户头部卡 */
.c-head { display: flex; align-items: center; gap: 14px; }
.c-ava {
  width: 62px; height: 62px; border-radius: 50%; flex-shrink: 0;
  background: var(--og); color: #fff; display: grid; place-items: center;
  font-size: 24px; font-weight: 900; box-shadow: 0 6px 18px rgba(255,106,0,.35);
}
.c-mid { flex: 1; min-width: 0; }
.c-nm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 18.5px; font-weight: 900; letter-spacing: .3px; }
.c-g { font-size: 10.5px; font-weight: 900; border-radius: 99px; padding: 2.5px 11px; }
.c-sub { font-size: 12px; color: var(--t2); font-weight: 600; margin-top: 4px; line-height: 1.6; }
.c-sub b { color: var(--o3); }
.c-sub2 { font-size: 10.5px; color: var(--t3); margin-top: 2px; }

/* ② 6 项个人指标 */
.m-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.metric {
  background: var(--soft); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 11px 12px 10px; cursor: pointer; transition: transform .15s; text-align: left;
}
.metric:active { transform: scale(.96); }
.metric .v { display: block; font-size: 17.5px; font-weight: 900; color: var(--o3); letter-spacing: -.3px; }
.metric .k { display: block; font-size: 11px; font-weight: 800; color: var(--t2); margin-top: 1px; }
.metric .note { display: block; font-size: 9.5px; color: var(--t3); margin-top: 1px; line-height: 1.4; }
.metric.warn { border-color: rgba(226,62,78,.4); background: rgba(226,62,78,.04); }
.metric.warn .v { color: var(--red); }
.hint-bar {
  font-size: 10.5px; color: var(--t3); line-height: 1.7; background: var(--soft);
  border-radius: 10px; padding: 8px 12px; margin-top: 11px;
}
.hint-bar b { color: var(--o3); }

/* ③ 自动分级 / 预警 */
.gd-card { border: 1.5px solid var(--line2); background: linear-gradient(135deg, #FFF3EA, #FFEBDD); border-radius: 14px; padding: 12px 14px; }
.gd-t { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 13.5px; font-weight: 900; margin-bottom: 5px; }
.aict { font-size: 9.5px; font-weight: 900; color: #fff; background: var(--og); border-radius: 99px; padding: 1px 8px; }
.gd-card p { font-size: 11.5px; color: var(--t2); line-height: 1.75; }
.gd-card p b { color: var(--o3); }
.auto-rule { background: var(--soft); border: 1px dashed var(--line2); border-radius: 12px; padding: 10px 13px; margin-top: 10px; }
.auto-rule .ar-t { font-size: 11px; font-weight: 900; color: var(--o3); margin-bottom: 3px; }
.auto-rule .ar-b { font-size: 11px; color: var(--t2); line-height: 1.7; }
.warn-box { background: #FCE9EB; border: 1px solid #F8CDD1; border-radius: 12px; padding: 11px 13px; margin-bottom: 9px; }
.warn-box .wt { font-size: 12.5px; font-weight: 900; color: var(--red); margin-bottom: 3px; }
.warn-box .wb { font-size: 11.5px; color: var(--t2); line-height: 1.7; }
.ok-box { background: #E7F8F0; border: 1px solid #C4EDD9; border-radius: 12px; padding: 11px 13px; font-size: 11.5px; color: var(--t2); line-height: 1.7; }
.ok-box b { color: var(--green); }

/* ④ 服务建议（可展开） */
.adv-row {
  width: 100%; display: flex; align-items: flex-start; gap: 10px; text-align: left;
  border-bottom: 1px dashed var(--line); padding: 10px 2px; cursor: pointer;
}
.adv-row:last-of-type { border-bottom: none; }
.adv-k {
  flex-shrink: 0; width: 62px; font-size: 11px; font-weight: 900; color: var(--o3);
  background: var(--soft); border-radius: 8px; padding: 4px 0; text-align: center; margin-top: 1px;
}
.adv-mid { flex: 1; min-width: 0; }
.adv-v { font-size: 12px; color: var(--t2); line-height: 1.7; }
.adv-v b { color: var(--o3); }
.adv-tip { display: none; font-size: 11px; color: var(--t3); line-height: 1.7; background: var(--soft); border-radius: 10px; padding: 7px 11px; margin-top: 7px; }
.adv-tip b { color: var(--o3); }
.adv-row.open .adv-tip { display: block; }
.adv-arr { flex-shrink: 0; color: var(--t3); font-size: 11px; font-weight: 900; margin-top: 5px; transition: transform .2s; }
.adv-row.open .adv-arr { transform: rotate(180deg); color: var(--o1); }

/* ⑤ 服务计划（可勾选） */
.plan-step {
  display: flex; align-items: flex-start; gap: 9px; background: var(--soft);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
}
.plan-step input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--o1); flex-shrink: 0; }
.plan-step.on { background: #E7F8F0; border-color: #C4EDD9; }
.plan-step.on .ps-txt { text-decoration: line-through; color: var(--t3); }
.ps-kind { flex-shrink: 0; font-size: 9.5px; font-weight: 900; border-radius: 99px; padding: 2px 8px; margin-top: 2px; }
.ps-wake { background: #FCE9EB; color: var(--red); }
.ps-renew { background: var(--soft); color: var(--o3); }
.ps-ful { background: #E8F0FE; color: var(--blue); }
.ps-care { background: #FDF3E0; color: var(--amber); }
.ps-refer { background: #E7F8F0; color: var(--green); }
.ps-txt { font-size: 12px; color: var(--t2); line-height: 1.65; }
.plan-foot { display: flex; align-items: center; gap: 10px; margin-top: 11px; }
.plan-foot .tx { font-size: 11px; color: var(--t3); font-weight: 700; white-space: nowrap; }
.plan-foot .pbar { flex: 1; }
.plan-foot .pfill { background: var(--green); }

/* ⑥ 附属模块分隔 */
.mod-div { text-align: center; margin: 10px 0 2px; }
.mod-div .ln { font-size: 10.5px; color: var(--t3); letter-spacing: 2px; }

/* ⑦ AI 深色结论卡 */
.rc-body { font-size: 14.5px; line-height: 1.9; }
.rc-body .n { color: #FFAE6E; font-weight: 800; text-shadow: 0 0 14px rgba(255,138,61,.4); }
.rc-stats { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.rc-stats > div { flex: 1; min-width: 92px; background: rgba(255,150,80,.12); border: 1px solid rgba(255,150,80,.3); border-radius: 13px; padding: 10px 12px; text-align: center; }
.rc-stats b { display: block; font-size: 20px; font-weight: 900; color: #FFC79B; letter-spacing: -.3px; text-shadow: 0 0 14px rgba(255,138,61,.4); }
.rc-stats span { font-size: 10px; color: rgba(255,220,190,.66); }

/* ⑧ 录音分析流程（4 步横向） */
.flow-row { display: flex; align-items: stretch; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.flow-row::-webkit-scrollbar { display: none; }
.flow-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad); padding: 14px 14px 12px; box-shadow: var(--shadow-s); }
.f-step {
  flex: 1; min-width: 118px; background: var(--soft); border: 1.5px solid var(--line);
  border-radius: 13px; padding: 11px 10px 10px; text-align: center; position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0;
}
.f-step .fic { font-size: 21px; line-height: 1.2; }
.f-step .fnm { font-size: 11.5px; font-weight: 800; color: var(--t2); white-space: nowrap; }
.f-step .fds { font-size: 9.5px; color: var(--t3); line-height: 1.45; }
.f-step .fst { font-size: 9px; font-weight: 800; border-radius: 99px; padding: 1.5px 8px; margin-top: 3px; background: #F3EDE6; color: var(--t3); }
.f-step.done .fst { background: #E7F8F0; color: var(--green); }
.f-step.run { border-color: var(--o1); background: linear-gradient(180deg, #FFF1E4, #FFE3CE); box-shadow: 0 5px 14px rgba(255,106,0,.2); }
.f-step.run .fst { background: var(--og); color: #fff; animation: lqPulse 1.8s infinite; }
.f-step.run::after {
  content: "进行中"; position: absolute; top: -8px; right: 8px;
  font-size: 8.5px; font-weight: 900; color: #fff; background: var(--og);
  border-radius: 99px; padding: 1.5px 7px; box-shadow: 0 3px 8px rgba(255,106,0,.35);
}
.f-arr { align-self: center; color: var(--t3); font-size: 14px; font-weight: 900; flex-shrink: 0; }
.flow-note { font-size: 11px; color: var(--t3); margin-top: 9px; line-height: 1.65; }
.flow-note b { color: var(--o3); }

/* ⑨ 最近分析列表 */
.rec-item {
  display: flex; gap: 11px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--rad-s); padding: 13px 13px 12px; box-shadow: var(--shadow-s); margin-bottom: 10px;
}
.rec-ic { width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0; background: linear-gradient(145deg, #FFF1E4, #FFE3CE); display: grid; place-items: center; font-size: 19px; }
.rec-mid { flex: 1; min-width: 0; }
.rec-t { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.rec-t > b { font-size: 13.5px; font-weight: 800; }
.rec-sc { font-size: 10.5px; color: var(--t3); font-weight: 600; }
.rec-st { margin-left: auto; font-size: 10px; font-weight: 800; border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
.rec-st.done { background: #E7F8F0; color: var(--green); }
.rec-st.run { background: #FDF3E0; color: var(--amber); animation: lqPulse 1.8s infinite; }
.rec-meta { font-size: 10.5px; color: var(--t3); margin-top: 3px; }
.rec-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.rec-tag { font-size: 9.5px; font-weight: 700; border-radius: 999px; padding: 2px 9px; background: var(--soft); color: var(--o3); border: 1px solid var(--line2); cursor: pointer; }
.rec-tag.r { background: #FCE9EB; color: var(--red); border-color: #F8CDD1; }
.rec-tag.a { background: #FDF3E0; color: var(--amber); border-color: #F5E2BE; }
.rec-tag.b { background: #E8F0FE; color: var(--blue); border-color: #CDDCF9; }
.rec-tag.g { background: #E7F8F0; color: var(--green); border-color: #C4EDD9; }
.rec-ai { font-size: 11.5px; color: var(--t2); line-height: 1.7; background: linear-gradient(135deg, #FFF3EA, #FFEBDD); border: 1px solid var(--line2); border-radius: 10px; padding: 7px 11px; margin-top: 8px; }
.rec-ai .aict { font-size: 9.5px; font-weight: 900; color: #fff; background: var(--og); border-radius: 99px; padding: 1px 8px; margin-right: 5px; }
.rec-ai b { color: var(--o3); }
.rec-run { height: 4px; background: #FFEBDD; border-radius: 99px; overflow: hidden; margin-top: 8px; opacity: 0; transition: opacity .3s; }
.rec-run.on { opacity: 1; }
.rec-run i { display: block; height: 100%; width: 0; background: var(--og); border-radius: 99px; transition: width 2s linear; }
.rec-run.on i { width: 92%; }

/* ⑩ 录音画像 5 维条形 */
.pf-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad); padding: 15px 15px 13px; box-shadow: var(--shadow-s); }
.pf-head { display: flex; align-items: center; gap: 9px; padding-bottom: 11px; border-bottom: 1px dashed var(--line); margin-bottom: 11px; }
.pf-ava { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; background: var(--og); color: #fff; display: grid; place-items: center; font-size: 16px; font-weight: 900; box-shadow: 0 4px 12px rgba(255,106,0,.3); }
.pf-nm { font-size: 14px; font-weight: 800; }
.pf-sub { font-size: 10.5px; color: var(--t3); margin-top: 1px; line-height: 1.5; }
.pf-dim { display: grid; grid-template-columns: 62px 1fr 38px; align-items: center; gap: 9px; padding: 7px 0; }
.pf-dim .dn { font-size: 11.5px; font-weight: 700; color: var(--t2); white-space: nowrap; }
.pf-dim .bar { height: 8px; background: #FFEBDD; border-radius: 99px; overflow: hidden; }
.pf-dim .bar i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .9s cubic-bezier(.25,.8,.3,1); }
.pf-dim .bar i.good { background: var(--green); }
.pf-dim .bar i.mid { background: linear-gradient(90deg, #F2B23C, #E8930C); }
.pf-dim .bar i.high { background: linear-gradient(90deg, #F06E7C, #E23E4E); }
.pf-dim .vl { font-size: 12.5px; font-weight: 900; text-align: right; }
.pf-warn { font-size: 10px; color: var(--t3); margin-top: 2px; }
.pf-warn b { color: var(--red); }
.pf-tip { margin-top: 10px; background: linear-gradient(135deg, #FFF3EA, #FFEBDD); border: 1px solid var(--line2); border-radius: 12px; padding: 10px 13px; font-size: 12px; color: var(--t2); line-height: 1.75; }
.pf-tip .aict { font-size: 9.5px; font-weight: 900; color: #fff; background: var(--og); border-radius: 99px; padding: 1px 8px; margin-right: 5px; }
.pf-tip b { color: var(--o3); }

/* ⑪ 大 CTA 上传 */
.up-cta {
  width: 100%; min-height: 62px; display: flex; align-items: center; gap: 13px;
  background: var(--og); border-radius: 17px; padding: 13px 17px;
  color: #fff; text-align: left; box-shadow: 0 8px 22px rgba(255,106,0,.4); transition: transform .15s;
}
.up-cta:active { transform: scale(.97); }
.up-cta .ic { font-size: 27px; flex-shrink: 0; }
.up-cta .tx b { display: block; font-size: 15.5px; font-weight: 900; letter-spacing: .5px; }
.up-cta .tx i { display: block; font-style: normal; font-size: 10.5px; opacity: .85; margin-top: 2px; }
.up-lock { font-size: 10.5px; color: var(--t3); line-height: 1.7; margin-top: 9px; text-align: center; }
.up-quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 11px; }
.up-quick a { flex: 1; min-width: 104px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line2); font-size: 12px; font-weight: 700; color: var(--t2); transition: all .15s; }
.up-quick a:active { transform: scale(.96); background: var(--soft); }

/* 桌面增强 */
@media (min-width: 960px) {
  .m-grid { grid-template-columns: repeat(3, 1fr); }
  .rc-body { font-size: 15px; }
  .f-step { min-width: 0; padding: 14px 12px 12px; }
  .f-step .fnm { font-size: 12.5px; }
  .up-cta { max-width: 560px; margin: 0 auto; }
  .up-lock { max-width: 560px; margin-left: auto; margin-right: auto; }
}
</style>
</head>

var PLAN_KIND = { "唤醒": "wake", "续卡": "renew", "履约": "ful", "关怀": "care", "转介绍": "refer" };
function buildPlan(c) {
  var steps = [];
  if (c.lastDays > 45) {
    steps.push({ id: "wake1", kind: "唤醒", txt: "发一条无推销关怀（护肤小知识 / 节气提醒）破冰" });
    steps.push({ id: "wake2", kind: "唤醒", txt: "3 天内轻推「回归体验」专属权益，不推卡" });
    steps.push({ id: "wake3", kind: "唤醒", txt: "到店后补录跟进，更新沉睡状态" });
  }
  if (c.card.remain > 0 && c.card.remain <= 3) {
    steps.push({ id: "renew1", kind: "续卡", txt: "疗程尾声提前 3 天触达，推续卡锁价" });
    steps.push({ id: "renew2", kind: "续卡", txt: "按已做项目推同系列居家产品，强化效果" });
  }
  steps.push({ id: "ful1", kind: "履约", txt: "按项目周期（清洁28天 / 补水14天）到期生成回访任务" });
  steps.push({ id: "ful2", kind: "履约", txt: "下次到店前做效果对比跟进，更新前后照" });
  steps.push({ id: "care1", kind: "关怀", txt: "生日前 7 天准备私密关怀，不打折式骚扰" });
  if (c.refer && c.refer !== "—") steps.push({ id: "ref1", kind: "转介绍", txt: "触点满意后邀约转介绍，发放回馈" });
  return steps;
}

    var on = done[s.id];
    return '<label class="plan-step' + (on ? " on" : "") + '"><input type="checkbox" data-pid="' + s.id + '"' + (on ? " checked" : "") + " />" +
      '<span class="ps-kind ps-' + PLAN_KIND[s.kind] + '">' + s.kind + '</span><span class="ps-txt">' + esc(s.txt) + "</span></label>";
  }).join("");
  var doneN = steps.filter(function (s) { return done[s.id]; }).length;
  var pct = steps.length ? Math.round(doneN / steps.length * 100) : 0;
  var h = '<div class="hint-bar">系统依据「沉睡 / 卡项余量 / 待卡 / 生日 / 转介绍」自动生成下一步动作，勾选即标记完成。</div>';
  h += "<div>" + rows + "</div>";
  h += '<div class="plan-foot"><span class="tx">已完成 <b>' + doneN + "</b> / " + steps.length + ' 项</span><div class="pbar"><i class="pfill" style="width:' + pct + '%"></i></div></div>';
  return h;
}
function planHtml(c) {
  return '<section class="span2 rise" id="planSec"><div class="sec-head"><h2><span class="bar"></span>服务计划 · 按客户状态自动生成</h2></div><div class="card" id="planBox">' + planBoxHtml(c) + "</div></section>";
}

/* ---------- 渲染 ---------- */
function render() {
  var c = cur(), s = LQ.store();
  $("#app").innerHTML =
    '<section class="span2 rise"><div class="top-row"><a class="back-link" href="crm.html">← 返回客户管理</a><span class="top-hint">AI客户分析 · 单客户报告</span></div></section>' +
    switcherHtml() +
    headHtml(c) +
    metricsHtml(c) +
    gradeHtml(c) +
    warnHtml(c) +
    adviceHtml(c) +
    planHtml(c) +
    '<section class="span2 rise mod-div"><div class="sec-head" style="justify-content:center"><h2><span class="bar"></span>🎙 AI录音分析 · 附属模块</h2></div><div class="ln">录音 → 文字 → 经营建议 · 结论自动写回上方客户档案</div></section>' +
    aiHtml(s) +
    flowHtml() +
    ctaHtml() +
    listHtml() +
    profileHtml();
  LQ.riseIn();
}

/* ---------- 事件（委托绑定，重渲染不丢） ---------- */
var app = $("#app");

app.addEventListener("click", function (e) {
  /* 客户切换 */
  var chip = e.target.closest("[data-cid]");
  if (chip) {
    var id = chip.getAttribute("data-cid");
    if (id !== curId) {
      curId = id;
      render();
      var g = gradeOf(cur());
      LQ.toast("已切换：" + cur().nm + " · " + g + "级 · " + GRADE_TXT[g]);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    return;
  }
  /* 指标卡口径说明 */
  var m = e.target.closest(".metric");
  if (m) {
    var mk = m.getAttribute("data-k");
    metricsOf(cur()).forEach(function (x) { if (x.k === mk) LQ.toast("💡 " + x.k + "：" + x.tip, 2600); });
    return;
  }
  /* 服务建议展开 */
  var adv = e.target.closest(".adv-row");
  if (adv) { adv.classList.toggle("open"); return; }
  /* 录音标签说明 */
  var tag = e.target.closest(".rec-tag");
  if (tag) { LQ.toast("🏷 标签由 AI 从录音转写自动提取，接待时自动调用"); return; }
  /* 上传录音演示 */
  if (e.target.closest("#upBtn")) {
    var st = $("#stFirst"), bar = $("#runBar");
    clearTimers();
    LQ.toast("演示：已开始分析 06:14 录音");
    if (st) { st.className = "rec-st run"; st.textContent = "⏳ 分析中…"; }
    if (bar) bar.classList.add("on");
    later(function () {
      var st2 = $("#stFirst"), bar2 = $("#runBar");
      if (st2) { st2.className = "rec-st done"; st2.textContent = "✓ 已分析"; }
      if (bar2) bar2.classList.remove("on");
      LQ.toast("✓ 06:14 录音分析完成，结果已写入 X女士 记忆库");
    }, 2000);
  }
});

/* 服务计划勾选 */
app.addEventListener("change", function (e) {
  var input = e.target.closest(".plan-step input");
  if (!input) return;
  var c = cur(), pid = input.getAttribute("data-pid");
  if (!PLAN_DONE[c.id]) PLAN_DONE[c.id] = {};
  PLAN_DONE[c.id][pid] = input.checked;
  $("#planBox").innerHTML = planBoxHtml(c);
  var steps = buildPlan(c);
  var step = null;
  steps.forEach(function (s) { if (s.id === pid) step = s; });
  LQ.toast(input.checked ? "✓ 已标记完成：" + (step ? step.kind : "") : "已取消完成标记", 1500);
});

render();

LQ.init({ nav: "record", title: "AI客户分析" });
})();
</script>
</body>
</html>
