/* 子模块切换 chips */

.wb-mode .tg.b { background: var(--soft); color: var(--o3); border: 1px solid var(--line2); }

/* 桌面增强 */
@media (min-width: 960px) {
  .pane.on { grid-template-columns: 1fr 1fr; }

  .gp-grid { grid-template-columns: repeat(3, 1fr); }
  .wb-pillars { grid-template-columns: repeat(4, 1fr); }
  .wb-modes { grid-template-columns: 1fr 1fr; }
}

}

/* ---------- 专业模式（七柱） ---------- */
function stratHtml(s, p, imgMode) {
  var imgN = { own: "用自己照片", ai: "AI 生成（按需）", none: "暂不配图" }[imgMode];
  return '<div class="wb-strategy">' +
    '<div><div class="k">身份</div><div class="v">美容门店老板 · ' + esc(s.short) + "</div></div>" +
    '<div><div class="k">七柱类型</div><div class="v">' + p.name + "（" + p.pct + "%）</div></div>" +
    '<div><div class="k">配图</div><div class="v">' + imgN + "</div></div></div>";
}
function buildProResult() {
  var p = PRO_PILLARS.filter(function (x) { return x.k === W.pro.pillar; })[0] || PRO_PILLARS[0];
  var v = function (i) {
    var val = (W.pro.vals[p.k + "_" + i] || "").trim();
    return val || p.f[i][1].replace(/^例：/, "");
  };
  var body = "";
  if (p.k === "p1") body = "她说完这句话，我在旁边差点没绷住。\n" + v(0) + "。她的原话：「" + v(1) + "」。\n前后对比放图里了（已获授权、脱敏处理）。不夸大：改善是按步骤坚持出来的。\n想要同款思路的，评论区扣 1，我把方案私发你。";
  else if (p.k === "p2") body = "今天又有人问我这个问题，一次说清楚。\n问：" + v(0) + "\n答：" + v(1) + "\n拿不准自己情况的，别自己乱试，到店先做个免费检测，用数据说话。";
  else if (p.k === "p3") body = "很多姐妹这一步都做错了。\n误区：" + v(0) + "\n正确做法：" + v(1) + "\n收藏起来照着做，比换十瓶精华都管用。";
  else if (p.k === "p4") body = "一个真实案例（已脱敏）。\n" + v(0) + "\n" + v(1) + "\n过程比结果重要：步骤做对了，结果是自然来的。";
  else if (p.k === "p5") body = "本周的活动，直说：\n" + v(0) + "\n" + v(1) + "\n想要的回复「1」，我按顺序登记，人满就停。";
  else if (p.k === "p6") body = "开店一天下来，记得住的就是这些小事。\n" + v(0) + "\n明天继续。有问题评论区问我，看到都会回。";
  else body = "不推销，就提一句：\n" + v(0) + "\n" + v(1) + "\n感兴趣的来，不感兴趣就当我没说。";
  var cta = "结尾动作：" + (p.k === "p6" ? "无 · 生活内容不强带动作" : p.k === "p5" || p.k === "p7" ? "回复「1」登记" : "评论区扣 1 / 到店检测");
  return { p: p, body: body, cta: cta };
}
function wbProHtml(s) {
  var pr = W.pro;
  if (!pr.pillar) {
    var h = '<section class="span2 rise"><div class="wb-card"><h3>🧭 先选一条朋友圈类型</h3>' +
      '<div class="wb-sub">七柱内容模型里，不同场景要填的内容不一样。选类型后系统给你对应的必填项，填齐后 AI 用「美容门店老板」口吻写文案，配图可 AI 生成也能用自己照片。</div>' +
      '<div class="wb-pillars">';
    PRO_PILLARS.forEach(function (p) {
      h += '<button type="button" class="wb-pill" data-wpill="' + p.k + '"><span class="pn">' + p.name + ' <span class="pc">' + p.pct + "%</span></span><span class=\"pd\">" + p.desc + '</span><span class="rq">必填：' + p.f.map(function (x) { return x[0]; }).join(" / ") + "</span></button>";
    });
    h += "</div></div></section>";
    return h;
  }
  var p = PRO_PILLARS.filter(function (x) { return x.k === pr.pillar; })[0];
  if (pr.state === "form") {
    var h2 = '<section class="span2 rise"><div class="wb-card"><h3>' + p.name + '（建议 ' + p.pct + '% 配比）<span class="sp"></span><button type="button" class="btn ghost" style="min-height:32px;font-size:11.5px;padding:4px 11px" data-wback="pillar">↩ 换类型</button></h3>' +
      '<div class="wb-sub">' + p.desc + '</div>';
    p.f.forEach(function (fl, i) {
      h2 += '<div class="wb-label">' + fl[0] + '<span class="req">*</span></div><textarea class="wb-textarea" style="min-height:64px" data-pf="' + p.k + "_" + i + '" placeholder="' + fl[1] + '">' + esc(pr.vals[p.k + "_" + i] || "") + "</textarea>";
    });
    h2 += '<div class="wb-label">🖼️ 配图方式</div>' + wbChip(IMG_MODES, pr.img, "pm");
    h2 += '<div class="wb-acts" style="margin-top:14px"><button type="button" class="btn primary" style="flex:1" data-wgen="pro">✨ 生成文案' + (pr.img === "ai" ? " + AI 配图" : "") + "</button></div>";
    h2 += '<div class="wb-note">带 <span class="req">*</span> 的必填项填齐再生成；<b>不编客户数据，只基于你填的写</b>。</div></div></section>';
    return h2;
  }
  if (pr.state === "gen") {
    return '<section class="span2 rise">' + stratHtml(s, p, pr.img) + '<div class="wb-card"><div class="wb-loading"><span class="wb-spin"></span>正在按七柱模板生成朋友圈文案…</div>' +
      FAST_STEPS.slice(1).map(function (st) { return '<div class="wb-step"><span class="ic">•</span>' + st + "</div>"; }).join("") +
      '<div class="wb-skel w90"></div><div class="wb-skel w70"></div><div class="wb-skel w50"></div></div></section>';
  }
  /* done */
  var r = pr.r;
  var h3 = '<section class="span2 rise">' + stratHtml(s, r.p, pr.img);
  h3 += '<div class="wb-post"><div class="wb-post-head"><span class="wb-pbadge">' + r.p.name + '</span><span class="wb-words">' + r.body.replace(/\s/g, "").length + ' 字</span></div>' +
    '<div class="wb-body">' + esc(r.body) + "</div>" +
    '<div class="wb-cta">' + r.cta + "</div>";
  /* 配图 */
  if (pr.img === "own") {
    h3 += '<div class="wb-label">配图（你的照片，发布时就地配）</div><div class="wb-figs">';
    for (var i = 0; i < 3; i++) h3 += '<div class="wb-fig own">📷 你的照片</div>';
    h3 += "</div>";
  } else if (pr.img === "none") {
    h3 += '<div class="wb-note">已选「暂不配图」——发布时当场拍一张随手配，真实感反而更好。</div>';
  } else if (pr.figs === "idle") {
    h3 += '<div class="wb-acts" style="margin-top:11px"><button type="button" class="btn primary" data-figgen="1">🎨 AI 生图（3 张）</button></div>';
  } else if (pr.figs === "gen") {
    h3 += '<div class="wb-label">AI 配图生成中…</div><div class="wb-figs"><div class="wb-fig loading" style="grid-column:1/-1"><span class="wb-spin"></span></div></div>';
  } else {
    h3 += '<div class="wb-label">AI 配图（点「下载」存到本地）</div><div class="wb-figs">';
    PRO_FIGS.forEach(function (f2) {
      h3 += '<div class="wb-fig"><div class="img" style="background:linear-gradient(135deg,' + f2.c1 + "," + f2.c2 + ')">' + f2.label + '</div><div class="cap">' + f2.cap + '</div><button type="button" class="dl" data-mock="已下载：' + f2.label + '（演示）">⬇ 下载图片</button></div>';
    });
    h3 += "</div>";
  }
  h3 += '<div class="wb-acts"><button type="button" class="btn primary" data-copy="pb">📋 复制文案</button><button type="button" class="btn" data-wregen="1">🔄 重新生成</button><button type="button" class="btn" data-wback="form">✍️ 改内容</button></div></div></section>';
  return h3;
}

function wbHtml(s) {
  var h = '<section class="span2 rise"><div class="wb-modes">';
  h += '<button type="button" class="wb-mode' + (W.mode === "fast" ? " on" : "") + '" data-wmode="fast"><span class="ck">✓</span><span class="mt"><b>⚡ 快速模式</b><span class="tg a">推荐</span></span><p>给图 + 原话 → AI 升级成能直接发的文案：诊断 → 升级 → 改动说明 → 配图建议 → 发布前检查。</p></button>';
  h += '<button type="button" class="wb-mode' + (W.mode === "pro" ? " on" : "") + '" data-wmode="pro"><span class="ck">✓</span><span class="mt"><b>🧭 专业模式 · 七柱</b><span class="tg b">完整图文</span></span><p>按七柱体系从零写：选类型 → 填必填项 → 策略条确认 → 文案 + 配图（AI 生图可下载）。</p></button>';
  h += "</div></section>";
  h += W.mode === "fast" ? wbFastHtml(s) : wbProHtml(s);
  return h;
}
function renderWb() {
  var pane = document.querySelector('[data-pane="wb"]');
  if (pane) { pane.innerHTML = wbHtml(LQ.store()); LQ.riseIn(pane); }
}

/* ---------- 社群：群消息生成表单 ---------- */
function buildGrpMsgs() {
  var g = W.grp, topic = (g.topic || "").trim() || GROUP_DEMO;
  var sets = {
    act: ["📢 " + topic, "报名方式：群里回复「1」接龙，我按顺序登记，人满就停。", "到时候见～地址在群里，找不到的随时喊我。"],
    keep: [topic, "最近天气变化大，姐妹们注意保湿，有皮肤问题群里随时问我。"],
    fiss: [topic, "带一位闺蜜一起来，你们俩都有小礼物，记得提前跟我说一声～"],
    fest: [topic, "假期店里正常营业，想约的提前说，我帮你们留档期～"]
  };
  return (sets[g.goal] || sets.act).slice(0, +g.cnt || 1);
}
function grpFormHtml(s) {
  var g = W.grp;
  var h = '<section class="span2 rise" id="grpFormSec"><div class="sec-head"><h2><span class="bar"></span>群消息生成</h2><p>填需求 → AI 按群聊节奏拆多条 → 复制逐条发</p></div><div class="card">';
  if (g.state === "form") {
    h += '<div class="wb-label">📌 这条消息的目的</div>' + wbChip(GROUP_GOALS, g.goal, "gg");
    h += '<div class="wb-label">👥 发到哪个群</div><div class="wb-chips">' + GROUP_TYPES.map(function (t, i) {
      return '<button type="button" class="' + (i === g.type ? "on" : "") + '" data-chip="gt" data-v="' + i + '">' + t + "</button>";
    }).join("") + "</div>";
    h += '<div class="wb-label">✂️ 拆几条</div>' + wbChip(GROUP_COUNTS, g.cnt, "gc");
    h += '<div class="wb-label">📝 想说的内容（必填<span class="req">*</span>）</div>';
    h += '<textarea class="wb-textarea" id="grpTopic">' + esc(g.topic) + "</textarea>";
    h += '<div class="wb-acts" style="margin-top:8px"><button type="button" class="btn ghost" style="min-height:34px;font-size:12px" data-grpdemo="1">填入示例</button></div>';
    h += '<div class="wb-acts" style="margin-top:12px"><button type="button" class="btn primary" style="flex:1" data-ggen="1">✨ AI 拆多条群消息</button></div>';
    h += '<div class="wb-note">AI 按群聊节奏拆成多条、口吻跟群类型走；<b>不编活动数据</b>，只基于你填的内容组织。</div>';
  } else if (g.state === "gen") {
    h += '<div class="wb-loading"><span class="wb-spin"></span>正在按「' + GROUP_TYPES[g.type] + '」的群聊节奏拆消息…</div><div class="wb-skel w90"></div><div class="wb-skel w70"></div>';
  } else {
    h += '<h3 style="font-size:14px;font-weight:800;margin-bottom:2px">📨 拆好 ' + g.msgs.length + ' 条 · 发「' + GROUP_TYPES[g.type] + "」</h3>";
    g.msgs.forEach(function (m, i) {
      h += '<div class="gp-msg"><div class="hd"><span class="no">第 ' + (i + 1) + ' 条</span><button type="button" class="btn ghost" style="min-height:28px;font-size:11px;padding:3px 10px;margin-left:auto" data-copy="m' + i + '">📋 复制</button></div><div class="bd">' + esc(m) + "</div></div>";
    });
    h += '<div class="wb-acts" style="margin-top:11px"><button type="button" class="btn primary" data-mock="已加入定时群发队列 · 今晚 19:30 发出（演示）">📤 定时群发（19:30）</button><button type="button" class="btn" data-gback="1">↩ 改需求重拆</button></div>';
  }
  h += "</div></section>";
  return h;
}
function renderGrpForm() {
  var sec = $("#grpFormSec");
  if (!sec) return;
  sec.outerHTML = grpFormHtml(LQ.store());
  var ns = $("#grpFormSec");
  if (ns) { ns.classList.add("in"); LQ.riseIn(ns); }
}

/* ---------- 渲染 ---------- */
function render() {
  var s = LQ.store();
  var app = $("#app");
  if (!app) return;
  app.innerHTML =
    chipsHtml() +
    '<div class="pane on" data-pane="pyq">' + aiHtml(s) + previewHtml() + calHtml() + "</div>" +
    '<div class="pane" data-pane="group">' + grpFormHtml(s) + groupHtml(s) + "</div>" +
    '<div class="pane" data-pane="chat">' + chatHtml() + "</div>" +
    '<div class="pane" data-pane="wb">' + wbHtml(s) + "</div>";
}

/* ---------- 子模块切换 ---------- */
function switchTab(key) {
  $$(".mod-chips button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-tab") === key); });
  $$(".pane").forEach(function (p) { p.classList.toggle("on", p.getAttribute("data-pane") === key); });
}

/* ---------- 复制 / 演示动作 ---------- */
function copyTxt(key) {
  var t = COPY[key] || "";
  if (key === "fb" && W.fast.r) t = W.fast.r.body;
  if (key === "pb" && W.pro.r) t = W.pro.r.body;
  if (key.charAt(0) === "m" && W.grp.msgs) t = W.grp.msgs[+key.slice(1)] || "";
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () {}, function () {});
    }
  } catch (e) {}
  LQ.toast("文案已复制");
}

function wGen(kind) {
  if (kind === "fast") {
    var ta = $("#wbRaw");
    if (ta) W.fast.raw = ta.value;
    W.fast.state = "gen"; renderWb();
    setTimeout(function () { W.fast.r = buildFastResult(); W.fast.state = "done"; renderWb(); }, 1600);
  } else {
    var pr = W.pro;
    $$("[data-pf]").forEach(function (el) { pr.vals[el.getAttribute("data-pf")] = el.value; });
    pr.state = "gen"; pr.figs = "idle"; renderWb();
    setTimeout(function () {
      pr.r = buildProResult(); pr.state = "done"; renderWb();
      if (pr.img === "ai") {
        pr.figs = "gen"; renderWb();
        setTimeout(function () { pr.figs = "done"; renderWb(); }, 1400);
      }
    }, 1500);
  }
}

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-copy]");
  if (el) { copyTxt(el.getAttribute("data-copy")); return; }
  el = e.target.closest("[data-word]");
  if (el) { LQ.toast("已导出 Word（演示）"); return; }
  el = e.target.closest("[data-tab]");
  if (el) { switchTab(el.getAttribute("data-tab")); return; }
  el = e.target.closest("[data-mock]");
  if (el) { LQ.toast(el.getAttribute("data-mock")); return; }

  /* 工作台：选项 chips */
  el = e.target.closest("[data-chip]");
  if (el) {
    var g = el.getAttribute("data-chip"), v = el.getAttribute("data-v");
    if (g === "fg") W.fast.goal = v; else if (g === "ft") W.fast.tone = v;
    else if (g === "fl") W.fast.lvl = v; else if (g === "fs") W.fast.stay = v;
    else if (g === "pm") W.pro.img = v;
    else if (g === "gg") W.grp.goal = v; else if (g === "gt") W.grp.type = +v;
    else if (g === "gc") W.grp.cnt = v;
    var row = el.closest(".wb-chips");
    if (row) $$("button", row).forEach(function (b) { b.classList.toggle("on", b === el); });
    return;
  }
  /* 工作台：模式切换 / 生成 / 返回 / 七柱 / 配图 */
  el = e.target.closest("[data-wmode]");
  if (el) { W.mode = el.getAttribute("data-wmode"); renderWb(); return; }
  el = e.target.closest("[data-wgen]");
  if (el) { wGen(el.getAttribute("data-wgen")); return; }
  el = e.target.closest("[data-wregen]");
  if (el) {
    if (W.mode === "fast") { W.fast.state = "gen"; renderWb(); setTimeout(function () { W.fast.r = buildFastResult(); W.fast.state = "done"; renderWb(); LQ.toast("已换一版"); }, 1200); }
    else { W.pro.state = "gen"; W.pro.figs = "idle"; renderWb(); setTimeout(function () { W.pro.r = buildProResult(); W.pro.state = "done"; if (W.pro.img === "ai") { W.pro.figs = "done"; } renderWb(); LQ.toast("已重新生成"); }, 1200); }
    return;
  }
  el = e.target.closest("[data-wback]");
  if (el) {
    var to = el.getAttribute("data-wback");
    if (to === "fast") { var ta2 = $("#wbRaw"); if (ta2) W.fast.raw = ta2.value; W.fast.state = "form"; }
    else if (to === "pillar") W.pro.pillar = null;
    else W.pro.state = "form";
    renderWb(); return;
  }
  el = e.target.closest("[data-wpill]");
  if (el) { W.pro.pillar = el.getAttribute("data-wpill"); W.pro.state = "form"; renderWb(); return; }
  el = e.target.closest("[data-figgen]");
  if (el) { W.pro.figs = "gen"; renderWb(); setTimeout(function () { W.pro.figs = "done"; renderWb(); LQ.toast("AI 配图已生成，可下载"); }, 1400); return; }
  el = e.target.closest("[data-rawdemo]");
  if (el) { var tr = $("#wbRaw"); if (tr) tr.value = DEMO_RAW; W.fast.raw = DEMO_RAW; LQ.toast("已填入示例原话"); return; }

  /* 社群：群消息生成 */
  el = e.target.closest("[data-grpdemo]");
  if (el) { var tg2 = $("#grpTopic"); if (tg2) tg2.value = GROUP_DEMO; W.grp.topic = GROUP_DEMO; LQ.toast("已填入示例需求"); return; }
  el = e.target.closest("[data-ggen]");
  if (el) {
    var gt = $("#grpTopic");
    if (gt) W.grp.topic = gt.value;
    W.grp.state = "gen"; renderGrpForm();
    setTimeout(function () { W.grp.msgs = buildGrpMsgs(); W.grp.state = "done"; renderGrpForm(); }, 1200);
    return;
  }
  el = e.target.closest("[data-gback]");
  if (el) { W.grp.state = "form"; renderGrpForm(); return; }
});

render();
LQ.init({ nav: "moments", title: "私域营销" });
})();
</script>
</body>
</html>
