<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>兰琪AI·经营大脑 v2 · 积分中心</title>
<link rel="stylesheet" href="assets/lanqi-ui.css">
<style>
/* ===== 积分中心私有样式（共享部分在 lanqi-ui.css） ===== */
/* 余额大卡（复用 AI 深色卡） */
.bal-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bal-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 180px; }
.bal-ic { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(145deg, rgba(255,138,61,.3), rgba(224,78,0,.3)); border: 1px solid rgba(255,150,80,.4); display: grid; place-items: center; font-size: 25px; flex-shrink: 0; }
.bal-main b { display: block; font-size: 30px; font-weight: 900; letter-spacing: -.5px; color: #FFC79B; line-height: 1.15; }
.bal-main span { font-size: 11.5px; color: rgba(255,220,190,.65); }
.bal-side { text-align: right; font-size: 11.5px; color: rgba(255,220,190,.75); line-height: 2; }
.bal-side b { color: #7CE0AC; font-weight: 800; }

/* 充值套餐 */
.plan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.plan { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 15px 10px 12px; text-align: center; transition: all .15s; min-height: 40px; cursor: pointer; }
.plan:active { transform: scale(.97); }
.plan.on { border-color: var(--o1); background: var(--soft); box-shadow: 0 6px 16px rgba(255,106,0,.18); }
.plan .hot { position: absolute; top: -9px; right: 8px; font-size: 9.5px; font-weight: 800; background: var(--red); color: #fff; border-radius: 999px; padding: 2px 8px; }
.plan .pts { font-size: 17px; font-weight: 900; }
.plan .price { font-size: 14px; color: var(--o3); font-weight: 800; margin-top: 2px; }
.plan .gift { font-size: 10px; color: var(--green); font-weight: 700; margin-top: 3px; min-height: 15px; }
.plan .sub { font-size: 10px; color: var(--t3); margin-top: 1px; }
.pay { margin-top: 13px; min-height: 48px; font-size: 15px; cursor: pointer; }
.pay-note { text-align: center; font-size: 10.5px; color: var(--t3); margin-top: 8px; }

/* 自定义金额 / 支付方式 */
.field { margin-top: 13px; }
.field label { display: block; font-size: 11.5px; color: var(--t2); font-weight: 700; margin-bottom: 6px; }
.input { width: 100%; border: 1px solid var(--line2); border-radius: 12px; padding: 11px 13px; font-size: 14px; background: #fff; color: var(--t1); outline: none; transition: border-color .15s, box-shadow .15s; }
.input:focus { border-color: var(--o1); box-shadow: 0 0 0 3px rgba(255,106,0,.12); }
.convert-hint { font-size: 10.5px; color: var(--t3); margin-top: 6px; line-height: 1.6; }
.convert-hint b { color: var(--o3); }

/* 消耗说明 / 消费记录 */
.cost-row, .rec-row { display: flex; align-items: center; gap: 11px; padding: 12px 2px; border-bottom: 1px solid #FFF3EA; min-height: 40px; }
.cost-row:last-of-type, .rec-row:last-of-type { border-bottom: none; }
.cost-ic, .rec-ic { width: 38px; height: 38px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
.cost-t, .rec-t { flex: 1; min-width: 0; }
.cost-t b, .rec-t b { display: block; font-size: 13px; font-weight: 700; }
.cost-t span, .rec-t span { display: block; font-size: 10.5px; color: var(--t3); margin-top: 1px; }
.cost-v { font-size: 13px; font-weight: 900; color: var(--o3); white-space: nowrap; }
.cost-v small { font-size: 10px; color: var(--t3); font-weight: 600; }
.rec-v { font-size: 14px; font-weight: 900; color: var(--red); white-space: nowrap; }
.cost-note, .rec-foot { font-size: 10.5px; color: var(--t3); line-height: 1.7; padding-top: 11px; border-top: 1px dashed var(--line); margin-top: 4px; }

/* 积分说明（汇率 4 格） */
.ratio-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.ratio-cell { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.ratio-cell .k { font-size: 10.5px; color: var(--t3); font-weight: 600; }
.ratio-cell .v { font-size: 13.5px; font-weight: 900; margin-top: 2px; color: var(--o3); }
.intro-txt { font-size: 11.5px; color: var(--t2); line-height: 1.8; margin-top: 11px; padding-top: 10px; border-top: 1px dashed var(--line); }

/* 积分用途参考表 */
.use-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.use-table th { text-align: left; font-size: 10.5px; color: var(--t3); font-weight: 700; padding: 7px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.use-table td { padding: 10px 6px; border-bottom: 1px solid #FFF3EA; vertical-align: top; line-height: 1.55; }
.use-table tr:last-child td { border-bottom: none; }
.use-table td b { color: var(--o3); white-space: nowrap; }
.use-note { font-size: 10.5px; color: var(--t3); line-height: 1.7; padding-top: 10px; border-top: 1px dashed var(--line); margin-top: 4px; }

/* 充值记录 */
.payrec { display: flex; align-items: center; gap: 10px; padding: 11px 2px; border-bottom: 1px solid #FFF3EA; min-height: 40px; }
.payrec:last-of-type { border-bottom: none; }
.payrec .d { font-size: 11px; color: var(--t3); font-weight: 600; width: 42px; flex-shrink: 0; }
.payrec .t { flex: 1; min-width: 0; }
.payrec .t b { display: block; font-size: 13px; font-weight: 700; }
.payrec .t span { display: block; font-size: 10.5px; color: var(--t3); }
.payrec .a { font-size: 13.5px; font-weight: 900; white-space: nowrap; }
.payrec.dn .a { color: var(--red); }
.payrec .badge { flex-shrink: 0; }

/* 发票 / 开票 */
.inv-btns { display: flex; gap: 8px; margin-top: 12px; }
.inv-btns .btn { flex: 1; min-height: 42px; }

/* FAQ */
.faq details { border-bottom: 1px solid var(--line); }
.faq details:last-child { border-bottom: none; }
.faq summary { list-style: none; cursor: pointer; font-size: 13px; font-weight: 700; padding: 12px 2px; display: flex; align-items: center; gap: 8px; user-select: none; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; margin-left: auto; color: var(--o3); font-weight: 900; font-size: 17px; line-height: 1; transition: transform .2s; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq .ans { font-size: 11.5px; color: var(--t2); line-height: 1.8; padding: 0 26px 12px 2px; }

/* 确认充值 / 全部记录 sheet 内 */
.kv { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 2px; border-bottom: 1px solid #FFF3EA; font-size: 12.5px; }
.kv:last-of-type { border-bottom: none; }
.kv .k { color: var(--t3); font-weight: 600; }
.kv .v { font-weight: 800; }
.sheet .s-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }

@media (min-width: 960px) {
  .plan-grid { grid-template-columns: repeat(4, 1fr); }
  .bal-main b { font-size: 34px; }
  .ratio-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>

<div id="lqHeader"></div>

<main id="app"></main>

<div class="foot-note">兰琪AI·经营大脑 v2 · 积分中心 · 2026-09-24 · 仅设计演示</div>

<div id="lqTabbar"></div>

<script src="assets/lanqi-ui.js"></script>
<script>
/* ============================================================
   积分中心（余额 · 充值套餐/自定义金额/支付方式 · 积分说明 ·
   用途参考 · 消耗说明 · 消费记录 · 充值记录 · 发票 · FAQ）
   ============================================================ */
(function () {
"use strict";
var $ = LQ.$, $$ = LQ.$$, fmt = LQ.fmt, esc = LQ.esc;

/* 充值套餐（4 档 · ¥299 为热门） */
var PLANS = [
  { price: "¥99",  pts: "1,000",  gift: "",              sub: "约 ¥0.099 / 积分" },
  { price: "¥299", pts: "3,500",  gift: "含赠 500",      sub: "约 ¥0.085 / 积分", hot: true },
  { price: "¥599", pts: "8,000",  gift: "含赠 1,800",    sub: "约 ¥0.075 / 积分" },
  { price: "¥999", pts: "15,000", gift: "含赠 5,000 · 最划算", sub: "约 ¥0.067 / 积分" }
];
var sel = 1, customMode = false; /* 默认选中 ¥299；输入自定义金额后切换模式 */
var BAL = 1280, USED = 312;

/* 消耗说明 / 消费记录（演示数据） */
var COSTS = [
  { ic: "✍️", n: "文字生成", d: "朋友圈文案 / 唤醒话术 / 夕会复盘", v: "10", u: "/ 条" },
  { ic: "🖼", n: "图片生成", d: "海报 / 实拍风格图 / 探店配图",     v: "40", u: "/ 张" },
  { ic: "🎬", n: "视频生成", d: "AI 数字人 / 探店短视频",           v: "120", u: "/ 条" }
];
var RECS = [
  { ic: "✍️", n: "生成朋友圈文案", t: "今天 14:32", v: "-10" },
  { ic: "🧑‍💻", n: "AI 数字人视频", t: "今天 10:18", v: "-120" },
  { ic: "🎙", n: "录音分析",       t: "昨天 19:05", v: "-10" }
];

/* 积分说明（原版演示数据） */
var RATIO = [
  { k: "充值汇率", v: "¥1 = 20 积分" },
  { k: "有效期",   v: "12 个月" },
  { k: "录音时长", v: "20 积分/分钟" },
  { k: "免费补给", v: "签到 / 拉新 / 任务" }
];
var INTRO = "积分是「兰琪·美业门店 AI 经营大脑」的通用额度，可用于 AI 对话、内容生成、客户分析、销售陪练、录音转写等全部功能。充值后即时到账，余额不足时部分功能会暂停使用。";

/* 积分用途参考（原版演示数据） */
var USES = [
  ["数字咨询师对话（单次）",     "约 12 积分",    "经营/获客/管理问题问答"],
  ["AI 录音卡转写（1 分钟）",    "约 20 积分",    "会议、培训、客户沟通录音"],
  ["内容生成（一篇图文/脚本）",  "约 40–80 积分", "朋友圈、小红书、短视频文案"],
  ["AI 模拟销售练习（一次）",    "约 80 积分",    "话术对练与点评"],
  ["直播逐字稿（2 小时）",       "约 200 积分",   "完整直播录音转写"],
  ["长录音 / 深度分析（一次）",  "约 2,000 积分", "长时间录音深度拆解"]
];
var USE_NOTE = "说明：以上为参考值，实际消耗会根据具体任务长度和复杂度略有浮动，最终以账单显示为准。";

/* 充值记录（原版演示数据 · 最近 5 笔） */
var PAYRECS = [
  { d: "08-28", t: "充值", a: "¥500", w: "微信", st: "已到账" },
  { d: "08-15", t: "充值", a: "¥300", w: "微信", st: "成功" },
  { d: "07-28", t: "充值", a: "¥100", w: "微信", st: "成功" },
  { d: "06-28", t: "充值", a: "¥300", w: "对公", st: "成功" },
  { d: "05-28", t: "充值", a: "¥50",  w: "微信", st: "成功" }
];

/* 发票（原版演示数据） */
var INVOICE = { t: "示例市颜值美学美容有限公司", k: "企业" };

/* FAQ（原版演示文案） */
var FAQS = [
  ["什么是积分？", "积分是「兰琪·美业门店 AI 经营大脑」的通用额度。对话、生成内容、分析客户、练习话术、转写录音等功能都会按次/按量扣除积分。"],
  ["1 元可以充多少积分？", "固定汇率 ¥1 = 20 积分。例如充值 ¥500，到账 10,000 积分。"],
  ["充值的积分会过期吗？", "充值积分自到账起 12 个月内有效。免费补给积分（签到/拉新/任务）的有效期以具体活动规则为准。系统会优先使用即将过期的积分。"],
  ["积分可以退吗？", "充值后积分一般不支持退款。如因服务异常导致积分未到账或重复扣款，请联系客服或专属顾问处理。"],
  ["充值后多久到账？", "微信支付通常即时到账；对公转账一般在 1–3 个工作日内到账，到账后自动推送通知。"],
  ["录音时长为什么单独显示？", "AI 录音卡转写/分析按分钟消耗积分，与文本类任务分开展示，方便门店分别管理「算力积分」和「录音时长」预算。"]
];

function payInfo() {
  if (customMode) {
    var v = parseInt($("#amtCustom").value, 10) || 0;
    return { amt: v, pts: v * 20 }; /* 自定义按基准 ¥1 = 20 积分 */
  }
  var p = PLANS[sel];
  return { amt: parseInt(p.price.replace(/[^\d]/g, ""), 10) || 0, pts: parseInt(p.pts.replace(/[^\d]/g, ""), 10) || 0 };
}
function updatePayBtn() {
  var btn = $("#payBtn"); if (!btn) return;
  if (customMode) {
    var v = parseInt($("#amtCustom").value, 10) || 0;
    btn.textContent = v > 0 ? "💳 确认充值 · ¥" + fmt(v) + " → " + fmt(v * 20) + " 积分" : "💳 请输入自定义金额";
  } else {
    btn.textContent = "💳 立即充值 · " + PLANS[sel].price + " · " + PLANS[sel].pts + " 积分";
  }
}
function renderBal() {
  var n = $("#balNum"); if (!n) return;
  n.textContent = fmt(BAL);
  var hp = $("#lqHeader .tb-pts"); if (hp) hp.innerHTML = "💎 " + fmt(BAL);
  var left = Math.max(BAL - USED, 0);
  $("#balLeft").innerHTML = "剩余可生成 <b>" + Math.floor(left / 10) + " 条文案</b> 或 <b>" + Math.floor(left / 120) + " 条视频</b>";
}
function renderBills() {
  var host = $("#billCard"); if (!host) return;
  var h = "";
  PAYRECS.forEach(function (r) {
    h += '<div class="payrec"><span class="d">' + r.d + '</span><span class="t"><b>' + r.t + '</b><span>' + esc(r.w) + '支付</span></span>';
    h += '<span class="a">' + r.a + '</span><span class="badge g">' + r.st + "</span></div>";
  });
  host.innerHTML = h;
}

function render() {
  var h = "";
  /* ① 余额大卡（深色渐变） */
  h += '<section class="span2 rise"><div class="ai-wrap"><div class="ai-card">';
  h += '<div class="ai-head"><span class="ai-badge"><span class="dot"></span>💎 算力积分 · 全部 AI 能力通用</span></div>';
  h += '<div class="bal-row"><div class="bal-main"><span class="bal-ic">💎</span><div><b id="balNum">1,280</b><span>算力积分余额</span></div></div>';
  h += '<div class="bal-side">本月已用 <b>' + USED + '</b><br>录音时长 <b>6.5h</b> · AI 录音卡可用<br><span id="balLeft"></span><br>建议常备 1,000+ 积分余量</div></div>';
  h += '</div></div></section>';

  /* ② 充值套餐 + 自定义金额 + 支付方式 */
  h += '<section class="span2 rise"><div class="sec-head"><h2><span class="bar"></span>充值金额</h2><p>¥1 = 20 积分 · 到账后 12 个月有效 · 无门槛 · 套餐含加赠更划算</p></div>';
  h += '<div class="plan-grid">';
  PLANS.forEach(function (p, i) {
    h += '<button class="plan' + (p.hot ? " hotp" : "") + (i === sel ? " on" : "") + '" data-plan="' + i + '">';
    if (p.hot) h += '<span class="hot">🔥 热门</span>';
    h += '<div class="pts">💎 ' + p.pts + '</div><div class="price">' + p.price + "</div>";
    h += '<div class="gift">' + (p.gift || " ") + '</div><div class="sub">' + p.sub + "</div></button>";
  });
  h += '</div>';
  h += '<div class="field"><label>自定义金额（元）</label><input class="input" id="amtCustom" type="number" inputmode="numeric" min="1" placeholder="输入金额，按 ¥1 = 20 积分 换算">';
  h += '<div class="convert-hint">自定义按 <b>¥1 = 20 积分</b> 换算 · 大额定制联系顾问</div></div>';
  h += '<div class="field"><label>支付方式</label><select class="input" id="payWay"><option>微信支付</option><option>对公转账</option></select></div>';
  h += '<button class="btn primary block pay" id="payBtn">💳 立即充值 · ' + PLANS[sel].price + "</button>";
  h += '<div class="pay-note">演示环境 · 不发起真实支付 · 支付成功后积分即时到账</div></section>';

  /* ③ 积分说明 */
  h += '<section class="rise"><div class="sec-head"><h2><span class="bar"></span>积分说明</h2><p>充值 / 有效期 / 使用范围</p></div>';
  h += '<div class="card"><div class="ratio-grid">';
  RATIO.forEach(function (r) { h += '<div class="ratio-cell"><div class="k">' + r.k + '</div><div class="v">' + r.v + "</div></div>"; });
  h += '</div><div class="intro-txt">' + INTRO + "</div></div></section>";

  /* ④ 消耗说明 */
  h += '<section class="rise"><div class="sec-head"><h2><span class="bar"></span>消耗说明</h2><p>不同 AI 能力消耗不同</p></div>';
  h += '<div class="card">';
  COSTS.forEach(function (c) {
    h += '<div class="cost-row"><span class="cost-ic">' + c.ic + '</span><span class="cost-t"><b>' + c.n + "</b><span>" + c.d + '</span></span><span class="cost-v">' + c.v + " <small>积分 " + c.u + "</small></span></div>";
  });
  h += '<div class="cost-note">💡 生成失败自动退回积分 · 积分有效期 12 个月 · 大额套餐单价更低</div>';
  h += '</div></section>';

  /* ⑤ 积分用途参考 */
  h += '<section class="span2 rise"><div class="sec-head"><h2><span class="bar"></span>积分用途参考</h2><p>每次使用大约消耗多少积分</p></div>';
  h += '<div class="card" style="overflow-x:auto;"><table class="use-table"><thead><tr><th>使用场景</th><th>大约消耗</th><th>说明</th></tr></thead><tbody>';
  USES.forEach(function (u) {
    h += "<tr><td>" + u[0] + "</td><td><b>" + u[1] + "</b></td><td>" + u[2] + "</td></tr>";
  });
  h += '</tbody></table><div class="use-note">' + USE_NOTE + "</div></div></section>";

  /* ⑥ 充值记录 */
  h += '<section class="rise"><div class="sec-head"><h2><span class="bar"></span>充值记录</h2><p>最近 5 笔</p></div>';
  h += '<div class="card" id="billCard"></div></section>';

  /* ⑦ 发票 / 开票 */
  h += '<section class="rise"><div class="sec-head"><h2><span class="bar"></span>发票 / 开票</h2><p>报销无忧</p></div>';
  h += '<div class="card">';
  h += '<div class="kv"><span class="k">发票抬头</span><span class="v">' + INVOICE.t + "（" + INVOICE.k + "）</span></div>";
  h += '<div class="inv-btns"><button class="btn ghost" data-toast="已管理发票抬头（原型）">管理抬头</button><button class="btn primary" data-toast="已提交开票申请（原型）">申请开票</button></div>';
  h += '<div class="cost-note">充值款项可开具增值税普通 / 专用发票，在「我的」页维护抬头。</div></div></section>';

  /* ⑧ 消费记录 */
  h += '<section class="span2 rise"><div class="sec-head"><h2><span class="bar"></span>消费记录</h2><span class="more" id="recAll">全部 ›</span></div>';
  h += '<div class="card">';
  RECS.forEach(function (r) {
    h += '<div class="rec-row"><span class="rec-ic">' + r.ic + '</span><span class="rec-t"><b>' + r.n + "</b><span>" + r.t + '</span></span><span class="rec-v">' + r.v + "</span></div>";
  });
  h += '<div class="rec-foot">今日共消耗 140 积分 · 更多明细见「我的 › 使用记录」</div>';
  h += '</div></section>';

  /* ⑨ 常见问题 FAQ */
  h += '<section class="span2 rise"><div class="sec-head"><h2><span class="bar"></span>常见问题</h2><p>关于积分充值</p></div>';
  h += '<div class="card faq">';
  FAQS.forEach(function (f, i) {
    h += "<details" + (i === 0 ? " open" : "") + "><summary>" + f[0] + '</summary><div class="ans">' + f[1] + "</div></details>";
  });
  h += "</div></section>";

  $("#app").innerHTML = h;
}

render();
renderBal();
renderBills();
updatePayBtn();

/* ---------- sheet（复用共享 #lqSheet 遮罩） ---------- */
function openSheet(html) {
  $("#lqSheet").innerHTML = html;
  $("#lqSheet").classList.add("show");
  $("#lqSheetMask").classList.add("show");
}
function closeSheet() {
  $("#lqSheet").classList.remove("show");
  $("#lqSheetMask").classList.remove("show");
}
function openPaySheet() {
  var info = payInfo();
  if (info.amt <= 0) { LQ.toast("请先输入自定义金额"); return; }
  var way = $("#payWay").value;
  var h = '<div class="grap"></div><h3>确认充值</h3><div class="sub">演示环境 · 不发起真实支付 · 到账后 12 个月有效</div>';
  h += '<div class="kv"><span class="k">充值金额</span><span class="v" style="color:var(--o3)">¥' + fmt(info.amt) + "</span></div>";
  h += '<div class="kv"><span class="k">到账积分</span><span class="v" style="color:var(--o3)">💎 ' + fmt(info.pts) + " 积分</span></div>";
  h += '<div class="kv"><span class="k">积分有效期</span><span class="v">12 个月</span></div>';
  h += '<div class="kv"><span class="k">支付方式</span><span class="v">' + esc(way) + "</span></div>";
  h += '<div class="s-btns"><button class="btn primary block" id="payGo">确认支付</button><button class="btn ghost block" id="payCancel">取消</button></div>';
  openSheet(h);
}
function doPay() {
  var info = payInfo(), way = $("#payWay").value;
  BAL += info.pts;
  PAYRECS.unshift({ d: "09-27", t: "充值", a: "¥" + fmt(info.amt), w: way === "微信支付" ? "微信" : "对公", st: "已到账" });
  closeSheet(); renderBal(); renderBills(); updatePayBtn();
  LQ.toast("演示环境：支付成功 · " + fmt(info.pts) + " 积分即时到账 💎");
}
function openRecSheet() {
  var h = '<div class="grap"></div><h3>全部消费记录</h3><div class="sub">本月消耗 ' + USED + ' 积分 · 今日 140 积分</div>';
  RECS.forEach(function (r) {
    h += '<div class="payrec dn"><span class="d">' + r.t + '</span><span class="t"><b>' + r.n + "</b></span><span class=\"a\">" + r.v + " 积分</span></div>";
  });
  h += '<div class="sub" style="margin-top:10px">生成失败自动退回积分 · 演示数据 · 完整账单以线上版为准</div>';
  openSheet(h);
}

/* ---------- 页面事件（事件委托） ---------- */
document.addEventListener("click", function (e) {
  var p = e.target.closest("[data-plan]");
  if (p) {
    sel = +p.getAttribute("data-plan"); customMode = false;
    $$(".plan").forEach(function (el, i) { el.classList.toggle("on", i === sel); });
    $("#amtCustom").value = "";
    updatePayBtn(); return;
  }
  if (e.target.closest("#payBtn")) { openPaySheet(); return; }
  if (e.target.closest("#payGo")) { doPay(); return; }
  if (e.target.closest("#payCancel")) { closeSheet(); return; }
  if (e.target.closest("#recAll")) { openRecSheet(); return; }
  var t = e.target.closest("[data-toast]");
  if (t) LQ.toast(t.getAttribute("data-toast") || "演示模块");
});
document.addEventListener("input", function (e) {
  if (e.target && e.target.id === "amtCustom") {
    customMode = true;
    $$(".plan").forEach(function (el) { el.classList.remove("on"); });
    updatePayBtn();
  }
});

LQ.init({ tab: "mine", title: "积分中心" });
})();
</script>
</body>
</html>
