<style>
/* ===== 目标明细私有样式（共享部分在 lanqi-ui.css） ===== */
/* 返回驾驶舱 */
.back-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--o3); background: #fff; border: 1.5px solid var(--line2); border-radius: 999px; padding: 8px 14px; min-height: 40px; transition: all .15s; margin-left: auto; }
.back-chip:active { transform: scale(.95); background: var(--soft); }

/* 月度目标总卡 */
.gd-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.gd-t { font-size: 15.5px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gd-num { display: flex; align-items: baseline; gap: 7px; }
.gd-num b { font-size: 34px; font-weight: 900; letter-spacing: -1px; color: var(--t1); }
.gd-num span { font-size: 12.5px; color: var(--t3); font-weight: 600; }
.gd-bar { margin: 13px 0 11px; height: 10px; }
.gd-cmp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--t3); font-weight: 600; }
.pill { background: var(--soft); border-radius: 999px; padding: 4px 12px; font-size: 11.5px; color: var(--t2); font-weight: 700; }
.pill b { color: var(--t1); }
.pill-o { background: var(--og); color: #fff; box-shadow: 0 4px 12px rgba(255,106,0,.28); }
.pill-o b { color: #fff; }
.gd-diff { font-weight: 800; color: var(--green); }
.gd-diff.bad { color: var(--red); }
.gd-rest { margin-top: 11px; font-size: 12px; color: var(--t2); }
.gd-rest b { color: var(--o3); }

/* 四项子目标 */
.sg-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.sg-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad-s); padding: 13px 13px 12px; box-shadow: var(--shadow-s); border-top: 3px solid var(--red); transition: transform .15s; }
.sg-card.ok { border-top-color: var(--green); }
.sg-card.on { outline: 2px solid rgba(255,106,0,.5); outline-offset: 1px; }
.sg-card:active { transform: scale(.98); }
.sg-top { display: flex; align-items: center; gap: 6px; }
.sg-top .ic { font-size: 15px; }
.sg-top .nm { font-size: 12.5px; font-weight: 700; color: var(--t2); flex: 1; }
.sg-num { display: flex; align-items: baseline; gap: 4px; margin: 8px 0; }
.sg-num b { font-size: 19px; font-weight: 900; letter-spacing: -.3px; }
.sg-num span { font-size: 10.5px; color: var(--t3); font-weight: 600; }
.sg-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--t3); font-weight: 600; margin-top: 7px; }
.sg-meta .pct { font-size: 14px; font-weight: 900; color: var(--green); }
.sg-meta .pct.bad { color: var(--red); }

/* 下钻表 */
.mb { display: inline-flex; flex-direction: column; line-height: 1.35; }
.mb small { font-size: 10px; color: var(--t3); font-weight: 600; }
table.tbl td.good { color: var(--green); }
table.tbl td.bad { color: var(--red); }
.tbl-note { font-size: 10.5px; color: var(--t3); line-height: 1.7; padding: 9px 4px 2px; }

/* AI 建议条 */
.ai-bd { font-size: 13.5px; line-height: 1.9; }
.ai-bd p { margin-bottom: 6px; }
.ai-bd [n] { color: #FFAE6E; font-weight: 800; font-size: 1.06em; text-shadow: 0 0 14px rgba(255,138,61,.4); }
.ai-acts { display: flex; gap: 9px; margin-top: 13px; flex-wrap: wrap; }
.ai-btn { flex: 1; min-width: 120px; min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: 12px; border: 1px solid rgba(255,150,80,.4); color: #FFC79B; font-size: 12.5px; font-weight: 700; transition: transform .15s; background: rgba(255,138,61,.08); cursor: pointer; }
.ai-btn.pri { background: var(--og); color: #fff; border-color: transparent; box-shadow: 0 5px 14px rgba(255,106,0,.35); }
.ai-btn:active { transform: scale(.96); }

/* 当前门店说明 */
.gd-store { font-size: 11px; color: var(--t2); background: #FFFBF7; border: 1px dashed var(--line2); border-radius: 10px; padding: 8px 12px; line-height: 1.6; }
.gd-store b { color: var(--o3); }

/* 目标切换器 */
.gswitch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
@media (max-width: 640px) { .gswitch { grid-template-columns: repeat(2, 1fr); } }
.gs-btn { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 10px 6px; border-radius: var(--rad-s); border: 1px solid var(--line); background: #fff; color: var(--t2); font-size: 12px; font-weight: 700; transition: all .15s; white-space: nowrap; min-height: 42px; }
.gs-btn:active { transform: scale(.97); }
.gs-btn.on { background: var(--og); color: #fff; border-color: transparent; font-weight: 800; box-shadow: 0 4px 12px rgba(255,106,0,.28); }
.gs-btn .g-n { font-size: 10px; opacity: .8; font-weight: 800; }

/* 沉睡分档三卡 */
.tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
@media (max-width: 640px) { .tier-grid { gap: 7px; } }
.tc { position: relative; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--rad-s); padding: 11px; cursor: pointer; transition: .15s; box-shadow: var(--shadow-s); }
.tc.on { border-color: var(--o1); background: var(--soft); box-shadow: 0 3px 14px rgba(255,106,0,.16); }
.tc:active { transform: scale(.98); }
.tc-top { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-bottom: 6px; }
.tc-nm { font-size: 11px; font-weight: 800; white-space: nowrap; }
.tc-badge { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 20px; color: #fff; white-space: nowrap; }
.tc-num { font-size: 19px; font-weight: 900; letter-spacing: -.4px; white-space: nowrap; line-height: 1.25; }
.tc-num small { font-size: 10px; font-weight: 600; color: var(--t3); margin-left: 2px; }
.tc-sub { font-size: 9.5px; color: var(--t3); margin-top: 2px; white-space: nowrap; }
.tc .pbar { height: 5px; margin-top: 8px; }
.tc-rate { display: flex; justify-content: space-between; gap: 5px; font-size: 9.5px; color: var(--t3); margin-top: 6px; }
.tc-rate b { color: var(--t1); }

/* 口径说明 / 打法条 */
.rule-bar { display: flex; gap: 9px; align-items: flex-start; background: var(--soft); border: 1px solid var(--line2); border-radius: var(--rad-s); padding: 11px 13px; margin-bottom: 12px; font-size: 12px; color: var(--t2); line-height: 1.75; }
.rule-bar .rb-ic { font-size: 14px; flex-shrink: 0; }
.rule-bar b { color: var(--o3); }
.rule-bar .rb-t { display: block; font-weight: 800; color: var(--t1); margin-bottom: 2px; }

/* 筛选条 */
.filter-bar { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 11px; }
.f-chip { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line2); background: #fff; color: var(--t2); font-size: 12px; font-weight: 700; transition: .15s; min-height: 34px; }
.f-chip.on { background: var(--og); border-color: transparent; color: #fff; }
.f-chip .cnt { opacity: .75; margin-left: 3px; font-weight: 600; }
.f-search { padding: 8px 12px; border: 1px solid var(--line2); border-radius: var(--rad-s); background: #fff; font-size: 12.5px; color: var(--t1); width: 150px; min-height: 34px; }
.f-search:focus { outline: none; border-color: var(--o1); }

/* 明细表（移动端转卡片） */
.gd-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--t3); font-weight: 600; }
.gd-head .th-t { font-size: 12.5px; font-weight: 800; color: var(--t1); }
.gd-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-top: 1px dashed var(--line); font-size: 11px; color: var(--t2); font-weight: 600; }
table.gdtd { width: 100%; border-collapse: collapse; font-size: 12px; }
table.gdtd th { background: var(--soft); color: var(--t2); font-size: 10.5px; font-weight: 700; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.gdtd td { padding: 9px 10px; border-bottom: 1px solid #FFF3EA; vertical-align: middle; white-space: nowrap; }
table.gdtd tbody tr { cursor: pointer; }
table.gdtd tbody tr:active { background: var(--soft); }
table.gdtd td.num, table.gdtd th.num { text-align: right; }
.cust-cell { display: flex; align-items: center; gap: 8px; }
.cust-av { width: 26px; height: 26px; border-radius: 50%; background: var(--soft); color: var(--o3); display: grid; place-items: center; font-size: 11px; font-weight: 800; flex-shrink: 0; }
.tag2 { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2.5px 8px; border-radius: 6px; white-space: nowrap; }
.tag2.ok { background: #E7F8F0; color: var(--green); }
.tag2.blue { background: #E8F0FE; color: var(--blue); }
.tag2.bad { background: #FCE9EB; color: var(--red); }
.tag2.gray { background: #F3EDE6; color: var(--t3); }
.money2 { font-weight: 800; color: var(--o3); }
.money2.gray { color: var(--t3); font-weight: 600; }
.ttag { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 20px; border: 1px solid; white-space: nowrap; }
.row-go { color: var(--t3); font-size: 11px; }
.gd-empty { padding: 26px 14px; text-align: center; color: var(--t3); font-size: 12.5px; }
@media (max-width: 720px) {
  table.gdtd thead { display: none; }
  table.gdtd, table.gdtd tbody, table.gdtd tr, table.gdtd td { display: block; width: 100%; }
  table.gdtd tr { border-bottom: 1px solid var(--line); padding: 9px 10px; }
  table.gdtd tr:last-child { border-bottom: none; }
  table.gdtd td { padding: 3px 0; border: none; display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; white-space: normal; }
  table.gdtd td::before { content: attr(data-label); color: var(--t3); font-size: 11px; font-weight: 700; flex-shrink: 0; }
  table.gdtd td.num { text-align: right; }
  table.gdtd td.hide-sm { display: none; }
}

/* 外链配置 */
.ext-head { display: flex; align-items: center; gap: 9px; padding: 12px 14px; background: var(--soft); border-radius: var(--rad-s); cursor: pointer; flex-wrap: wrap; }
.ext-head .eh-t { font-size: 13px; font-weight: 800; }
.ext-head .eh-s { font-size: 11px; color: var(--t3); font-weight: 600; }
.ext-head .eh-ar { margin-left: auto; font-size: 11px; color: var(--o3); font-weight: 800; }
.ext-body { display: none; padding: 6px 4px 2px; }
.ext-card.open .ext-body { display: block; }
.ext-row { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 12px; flex-wrap: wrap; }
.ext-row:last-child { border-bottom: none; }
.ext-row .er-k { width: 84px; font-weight: 700; flex-shrink: 0; }
.ext-row .er-u { flex: 1; min-width: 130px; color: var(--t3); font-family: ui-monospace, Consolas, monospace; font-size: 11px; word-break: break-all; }
.ext-row .er-b { font-size: 11px; font-weight: 700; color: var(--o3); background: var(--soft); border: 1px solid var(--line2); border-radius: 8px; padding: 5px 10px; white-space: nowrap; }
.ext-note { margin-top: 9px; font-size: 11px; color: var(--t3); line-height: 1.7; background: #FFFBF7; border: 1px dashed var(--line2); border-radius: var(--rad-s); padding: 10px 12px; }
.ext-note b { color: var(--o3); }
.ext-note code { background: var(--soft); padding: 1px 5px; border-radius: 5px; }

/* 子目标卡可点切换 */
.sg-card { cursor: pointer; }

@media (min-width: 960px) {
  .sg-grid { grid-template-columns: repeat(4, 1fr); }
  .gd-num b { font-size: 40px; }
  .tier-grid { gap: 12px; }
}
</style>

  h += '<section class="span2 rise"><div class="rule-bar" style="margin-bottom:0"><span class="rb-ic">📐</span><div><span class="rb-t">' + def.label + " · 达成口径</span>" + def.rule + "</div></div></section>";

  /* ⑤ 四项子目标（点卡片切换下方明细） */
  h += '<section class="span2 rise"><div class="sec-head"><h2><span class="bar"></span>四项子目标</h2><p>达标线 = 时间进度 ' + timePct + "% · 点卡片切换上方总卡与明细</p></div>";
  h += '<div class="sg-grid">';
  GOAL_DEFS.forEach(function (d) {
    var g = s.targets[d.k][0], c = s.targets[d.k][1], pp = pct(c, g), ok = pp >= timePct;
    var cTxt = d.k === "rev" ? "¥" + fmt(c) : c + " 人";
    var gTxt = d.k === "rev" ? "¥" + fmt(g) : g + " 人";
    h += '<div class="sg-card' + (ok ? " ok" : "") + (cur === d.k ? " on" : "") + '" data-goal="' + d.k + '" role="button" tabindex="0">';
    h += '<div class="sg-top"><span class="ic">' + d.ic + '</span><span class="nm">' + d.nm + '</span><span class="badge ' + (ok ? "g" : "r") + '">' + (ok ? "达标" : "落后") + "</span></div>";
    h += '<div class="sg-num"><b>' + cTxt + "</b><span>/ " + gTxt + "</span></div>";
    h += '<div class="pbar"><i class="pfill" data-w="' + pp + '"></i></div>';
    h += '<div class="sg-meta"><span class="pct' + (ok ? "" : " bad") + '">' + pp + "%</span><span>" + (pp >= timePct ? "快 " + (pp - timePct) : "慢 " + (timePct - pp)) + " 个点</span></div></div>";
  });
  h += "</div></section>";

  /* ⑥ 筛选条 + 达成明细 */
  var tierRows = scopeRows(), list = filteredRows(tierRows);
  h += '<section class="span2 rise"><div class="sec-head"><h2><span class="bar"></span>达成明细</h2><p>' + (cur === "wake" ? "回店即算唤醒成功 · 不要求消费" : "最近记录 · 点行打开客户档案") + '</p><span class="more" style="cursor:default">已筛选 ' + list.length + " / " + tierRows.length + " 条</span></div>";
  h += '<div class="filter-bar">';
  def.filters.forEach(function (f) {
    var n = 0;
    tierRows.forEach(function (r) { if (f[0] === "all" || r.k === f[0]) n++; });
    h += '<button type="button" class="f-chip' + (filter === f[0] ? " on" : "") + '" data-f="' + f[0] + '">' + f[1] + '<span class="cnt"> ' + n + "</span></button>";
  });
  h += '<input class="f-search" id="gdKw" type="text" placeholder="搜客户 / 项目" value="' + esc(kw) + '"/>';
  h += "</div>";
  h += '<div id="gdTbl">' + tableHtml(list) + "</div>";
  h += "</section>";

  /* ⑦ 跳转配置（外链） */
  h += '<section class="span2 rise"><div class="ext-card' + (extOpen ? " open" : "") + '" style="background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:4px 12px 10px;box-shadow:var(--shadow-s)">';
  h += '<div class="ext-head" data-ext-toggle><span class="eh-t">🔗 跳转配置（店长可改）</span><span class="eh-s">明细可跳本系统其他页面，也可跳外部系统</span><span class="eh-ar">' + (extOpen ? "收起 ▲" : "展开 ▼") + "</span></div>";
  h += '<div class="ext-body">';
  GOAL_DEFS.forEach(function (d) {
    var d0 = GDEFS[d.k];
    var isExt = d0.extUrl.indexOf("http") === 0;
    h += '<div class="ext-row"><span class="er-k">' + d0.ic + " " + d0.short + '</span><span class="er-u">' + d0.extName + " · " + d0.extUrl + "</span>";
    h += isExt ? '<a class="er-b" href="#" data-exturl="' + d0.extUrl + '">打开 ↗</a></div>' : '<a class="er-b" href="' + d0.extUrl + '">打开 ↗</a></div>';
  });
  h += '<div class="ext-note">工程化说明：明细默认进<b>本系统客户档案</b>（crm.html?customer=客户ID）。若门店已用有赞 / 美团 / 抖音来客，可在后台把某一目标的下钻地址改成外部 URL，点击后新窗口打开并带上 <code>?store_id=&amp;month=</code> 参数。<b>外部系统只做跳转，不回写数据</b>——目标达成数仍以本系统口径为准。</div>';
  h += "</div></div></section>";

  /* ⑧ 下钻表（按员工 / 按门店） */
  var rows = STAFF[s.id] || STAFF.s1;
  h += '<section class="rise"><div class="sec-head"><h2><span class="bar"></span>' + (s.id === "all" ? "按门店拆解（业绩）" : "按员工拆解（业绩）") + "</h2><p>" + esc(s.short) + " · 目标已拆到" + (s.id === "all" ? "店" : "人") + "</p></div>";
  h += '<div class="tbl-card"><table class="tbl"><tr><th>成员</th><th>目标</th><th>完成</th><th>完成率</th></tr>';
  rows.forEach(function (r) {
    var rp = pct(r.c, r.g);
    h += '<tr><td><span class="mb"><b>' + esc(r.n) + "</b><small>" + esc(r.r) + "</small></span></td><td>¥" + fmt(r.g) + '</td><td>¥' + fmt(r.c) + '</td><td class="' + (rp >= timePct ? "good" : "bad") + '">' + rp + "%</td></tr>";
  });
  h += "</table>";
  h += '<div class="tbl-note">📌 完成率 ≥ 时间进度 ' + timePct + "% 记绿灯 · 拆解口径：按上月业绩占比，工程化时由服务端聚合，不允许前端写死</div></div></section>";

  /* ⑨ AI 建议条 */
  var nGap = s.targets.new[0] - s.targets.new[1], nDay = Math.ceil(nGap / MONTH.leftDays);
  h += '<section class="rise"><div class="sec-head"><h2><span class="bar"></span>AI 建议</h2><p>按当前缺口自动生成 · 每天 09:00 更新</p></div>';
  h += '<div class="ai-wrap"><div class="ai-card">';
  h += '<div class="ai-head"><span class="ai-badge"><span class="dot"></span>✨ AI 经营建议</span></div>';
  h += '<div class="ai-bd">';
  h += "<p>⚠️ <n>新客目标</n>落后 <n>" + nGap + " 人</n>（当前 " + s.targets.new[1] + "/" + s.targets.new[0] + "）→ 建议：<n>加投 2 条抖音探店视频</n> + <n>老客转介绍激励</n>（带礼到店）</p>";
  h += "<p>按日均补 <n>" + nDay + " 人</n> × 剩 " + MONTH.leftDays + " 天，月末新客可望追平；同步把升单缺口拆进今天在跟的 3 名 980 体验客。</p>";
  h += "</div>";
  h += '<div class="ai-acts"><a class="ai-btn pri" href="acquire.html">📢 去加投获客内容</a><button class="ai-btn" data-toast="演示：已生成老客转介绍激励方案">🎁 生成转介绍激励</button></div>';
  h += "</div></div></section>";

  $("#app").innerHTML = h;
  LQ.riseIn();
  bindKw();
}

render();

/* ---------- 页面事件 ---------- */
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-goal]");
  if (el) {
    cur = el.getAttribute("data-goal");
    curTier = "all"; filter = "all"; kw = "";
    render();
    return;
  }
  el = e.target.closest("[data-tier]");
  if (el) {
    var tk = el.getAttribute("data-tier");
    curTier = curTier === tk ? "all" : tk;
    filter = "all";
    render();
    return;
  }
  el = e.target.closest("[data-f]");
  if (el) { filter = el.getAttribute("data-f"); render(); return; }
  el = e.target.closest("[data-ext-toggle]");
  if (el) { extOpen = !extOpen; render(); return; }
  el = e.target.closest("[data-exturl]");
  if (el) { e.preventDefault(); LQ.toast("演示：已在新窗口打开 " + el.getAttribute("data-exturl")); return; }
  el = e.target.closest("[data-toast]");
  if (el) { LQ.toast(el.getAttribute("data-toast") || "演示模块"); return; }
  var tr = e.target.closest("tr[data-cust]");
  if (tr) LQ.toast("已打开客户档案 → crm.html?customer=" + tr.getAttribute("data-cust"));
});

LQ.init({ nav: "home", title: "目标明细" });
})();
</script>
</body>
</html>
