<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>兰琪AI·经营大脑 v2 · 我的</title>
<link rel="stylesheet" href="assets/lanqi-ui.css">
<style>
/* ===== 我的 · 私有样式（共享部分在 lanqi-ui.css） ===== */
/* 用户头卡 */
.me-hero { display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, #FFF3EA, #FFEBDD); border: 1px solid var(--line2); border-radius: var(--rad); padding: 18px 16px; box-shadow: var(--shadow-s); }
.me-av { width: 58px; height: 58px; border-radius: 18px; background: var(--og); display: grid; place-items: center; font-size: 27px; flex-shrink: 0; box-shadow: 0 6px 16px rgba(255,106,0,.35); }
.me-info { flex: 1; min-width: 0; }
.me-nm { font-size: 17.5px; font-weight: 900; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.me-store { font-size: 12px; color: var(--t2); margin-top: 4px; font-weight: 600; }
.me-store b { color: var(--o3); }
.me-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
.me-tags span { font-size: 10px; background: #fff; border: 1px solid var(--line2); color: var(--t2); border-radius: 999px; padding: 2px 9px; font-weight: 700; }
.me-set { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 17px; background: #fff; border: 1px solid var(--line2); flex-shrink: 0; transition: transform .15s; cursor: pointer; }
.me-set:active { transform: scale(.93); }

/* 数据卡 */
.tile { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--rad); padding: 16px 15px; box-shadow: var(--shadow-s); transition: transform .15s; cursor: pointer; width: 100%; text-align: left; }
.tile:active { transform: scale(.98); }
.tile-ic { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(145deg, #FFF1E4, #FFE3CE); display: grid; place-items: center; font-size: 21px; flex-shrink: 0; }
.tile-body { flex: 1; min-width: 0; }
.tile-body b { display: block; font-size: 21px; font-weight: 900; letter-spacing: -.3px; line-height: 1.2; }
.tile-body span { font-size: 11px; color: var(--t3); font-weight: 600; }
.tile-go { font-size: 11.5px; color: var(--o3); font-weight: 700; white-space: nowrap; }

/* 功能列表 */
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 4px; min-height: 52px; border-bottom: 1px solid #FFF3EA; text-align: left; background: none; cursor: pointer; }
.row:last-child { border-bottom: none; }
.row:active { opacity: .7; }
.row .ic { width: 36px; height: 36px; border-radius: 11px; background: var(--soft); display: grid; place-items: center; font-size: 16px; flex-shrink: 0; }
.row .rt { flex: 1; min-width: 0; }
.row .rt b { display: block; font-size: 13.5px; font-weight: 700; }
.row .rt > span { display: block; font-size: 10.5px; color: var(--t3); margin-top: 1px; }
.row .ar { color: #D9C6B6; font-weight: 800; flex-shrink: 0; font-size: 15px; }
.row.out .ic { background: #FCE9EB; }
.row.out b { color: var(--red); }

/* 套餐与订阅 */
.kv { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 11px 2px; border-bottom: 1px solid #FFF3EA; }
.kv .k { font-size: 11.5px; color: var(--t3); font-weight: 600; white-space: nowrap; padding-top: 2px; }
.kv .v { font-size: 12.5px; font-weight: 700; text-align: right; line-height: 1.55; }
.kv .v em { font-style: normal; color: var(--o3); }
.btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btns .btn { flex: 1; min-height: 42px; font-size: 13px; }
.plan-note { font-size: 10.5px; color: var(--t3); line-height: 1.7; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.plan-note a { color: var(--o3); font-weight: 700; white-space: nowrap; }

/* 充值记录 */
.brow { display: flex; align-items: center; gap: 10px; padding: 11px 2px; border-bottom: 1px solid #FFF3EA; min-height: 40px; }
.brow:last-of-type { border-bottom: none; }
.brow .d { font-size: 11px; color: var(--t3); font-weight: 600; width: 42px; flex-shrink: 0; }
.brow .t { flex: 1; min-width: 0; }
.brow .t b { display: block; font-size: 13px; font-weight: 700; }
.brow .t span { display: block; font-size: 10.5px; color: var(--t3); }
.brow .a { font-size: 13.5px; font-weight: 900; white-space: nowrap; }
.brow .badge { flex-shrink: 0; }
.rec-foot { font-size: 10.5px; color: var(--t3); line-height: 1.7; padding-top: 11px; border-top: 1px dashed var(--line); margin-top: 4px; }
</style>
</head>
<body>

<div id="lqHeader"></div>

<main id="app"></main>

<div class="foot-note">兰琪AI·经营大脑 v2 · 设计演示版 · 2026-09-24 · 仅设计演示</div>

<div id="lqTabbar"></div>

<script src="assets/lanqi-ui.js"></script>
<script>
/* ============================================================
   我的 / 系统中心（用户头卡 · 积分数据 · 套餐与订阅 ·
   充值记录 · 发票/开票 · 功能列表）
   门店名 / 员工数 / 会员数 读 LQ.store()，随门店切换刷新
   ============================================================ */
(function () {
"use strict";
var $ = LQ.$, $$ = LQ.$$, esc = LQ.esc;

/* 充值记录（原版演示数据 · 最近 5 笔，含套餐续费） */
var BILLS = [
  { d: "08-28", t: "套餐续费", a: "¥29",  w: "微信", st: "成功" },
  { d: "07-28", t: "充值",     a: "¥500", w: "微信", st: "成功" },
  { d: "06-28", t: "套餐续费", a: "¥29",  w: "微信", st: "成功" },
  { d: "05-28", t: "充值",     a: "¥300", w: "对公", st: "成功" },
  { d: "04-28", t: "试用转正", a: "¥29",  w: "微信", st: "成功" }
];

function render() {
  var s = LQ.store();
  var h = "";
  /* ① 用户头卡 */
  h += '<section class="span2 rise"><div class="me-hero">';
  h += '<div class="me-av">👩‍💼</div>';
  h += '<div class="me-info"><div class="me-nm">兰琪店长 <span class="badge o">店长 · 全部权限</span></div>';
  h += '<div class="me-store">🏬 <b>' + esc(s.short) + "</b>" + (s.tag ? " · " + esc(s.tag) : "") + " · 数据随顶部门店条切换</div>";
  h += '<div class="me-tags"><span>' + s.staff + " 名员工</span><span>" + s.members + " 位会员</span><span>连锁 3 店</span></div></div>";
  h += '<button class="me-set" id="btnSetting">⚙️</button>';
  h += '</div></section>';

  /* ② 数据卡：算力积分 + AI 使用 */
  h += '<section class="rise"><a class="tile" href="points-recharge.html"><span class="tile-ic">💎</span><span class="tile-body"><b>1,280</b><span>算力积分 · 当前余额</span></span><span class="tile-go">去充值 ›</span></a></section>';
  h += '<section class="rise"><button class="tile" id="btnUsage"><span class="tile-ic">🤖</span><span class="tile-body"><b>312</b><span>本月 AI 使用次数 · 点看构成</span></span><span class="tile-go">看明细 ›</span></button></section>';

  /* ③ 套餐与订阅（当前套餐详情） */
  h += '<section class="span2 rise"><div class="sec-head"><h2><span class="bar"></span>套餐与订阅</h2><p>当前套餐 · 权益 · 余额</p></div>';
  h += '<div class="card">';
  h += '<div class="kv"><span class="k">套餐版本</span><span class="v">全案版 · <em>¥29 / 月</em> · 全部模块 <span class="badge g">生效中</span></span></div>';
  h += '<div class="kv"><span class="k">有效期至</span><span class="v">2026-10-01</span></div>';
  h += '<div class="kv"><span class="k">包含权益</span><span class="v" style="flex:1"><span style="display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%">' +
    [["👩‍🏫", "4 位数字咨询师", "在线接待·话术库"], ["🎙", "AI 录音卡", "录音转写·复盘"], ["♾", "无限客户档案", "4 层档案·AI分级"], ["⚙️", "内容自动化", "图文/视频生成"], ["🏬", "多门店多角色", "3 店 · 权限细分"]].map(function (x) {
      return '<span style="display:flex;gap:8px;align-items:flex-start;background:#FFFBF7;border:1px solid var(--line);border-radius:10px;padding:8px 10px"><span style="font-size:16px">' + x[0] + '</span><span style="min-width:0"><b style="display:block;font-size:11.5px;color:var(--t1)">' + x[1] + '</b><small style="font-size:10px;color:var(--t3)">' + x[2] + "</small></span></span>";
    }).join("") + "</span></span></div>";
  h += '<div class="kv"><span class="k">账户余量</span><span class="v">AI 积分 <em>1,280</em> · 录音时长 <em>6.5h</em></span></div>';
  h += '<div class="btns"><button class="btn primary" data-toast="演示环境：已续费（样例）">续费</button><button class="btn ghost" id="btnUpgrade">升级套餐</button><button class="btn ghost" id="btnInvite">邀请成员</button></div>';
  h += '<div class="plan-note">积分用于 AI 模拟销售、内容生成、数字咨询师对话、录音卡转写等场景；充值档位、比例与有效期见 <a href="points-recharge.html">积分中心 →</a></div>';
  h += '</div></section>';

  /* ④ 充值记录 */
  h += '<section class="span2 rise" id="billSec"><div class="sec-head"><h2><span class="bar"></span>充值记录</h2><p>套餐续费与积分充值 · 最近 5 笔</p></div>';
  h += '<div class="card">';
  BILLS.forEach(function (b) {
    h += '<div class="brow"><span class="d">' + b.d + '</span><span class="t"><b>' + b.t + '</b><span>' + esc(b.w) + '支付</span></span>';
    h += '<span class="a">' + b.a + '</span><span class="badge g">' + b.st + "</span></div>";
  });
  h += '<div class="rec-foot">积分充值档位与明细见<a href="points-recharge.html" style="color:var(--o3);font-weight:700">「积分中心」</a></div>';
  h += '</div></section>';

  /* ⑤ 发票 / 开票 */
  h += '<section class="span2 rise"><div class="sec-head"><h2><span class="bar"></span>发票 / 开票</h2><p>充值款项报销无忧</p></div>';
  h += '<div class="card">';
  h += '<div class="kv"><span class="k">发票抬头</span><span class="v">示例市颜值美学美容有限公司（企业）</span></div>';
  h += '<div class="btns"><button class="btn ghost" data-toast="已管理发票抬头（原型）">管理抬头</button><button class="btn primary" data-toast="已提交开票申请（原型）">申请开票</button></div>';
  h += '<div class="plan-note">充值款项可开具增值税普通 / 专用发票，发票抬头在此维护。</div>';
  h += '</div></section>';

  /* ⑥ 功能列表（设置组） */
  var ROWS = [
    { ic: "🏬", n: "我的门店",   s: "当前 " + s.short + " · 点顶部门店条可切换" },
    { ic: "👥", n: "员工管理",   s: "共 " + s.staff + " 人 · 含 1 名店长" },
    { ic: "🔑", n: "权限角色",   s: "店长 / 顾问 / 美容师 / 前台" },
    { ic: "💎", n: "积分充值",   s: "余额 1,280 · 本月已用 312", href: "points-recharge.html" },
    { ic: "📊", n: "使用记录",   s: "本月 312 次 AI 调用" },
    { ic: "🧾", n: "充值记录 / 发票", s: "最近 5 笔 · 抬头管理与申请开票", href: "#billSec" },
    { ic: "❓", n: "帮助中心",   s: "常见问题 · 新手引导" },
    { ic: "🚪", n: "退出登录",   s: "演示环境 · 不会真的退出", toast: "演示环境：不执行退出", out: true }
  ];
  h += '<section class="span2 rise"><div class="sec-head"><h2><span class="bar"></span>系统中心</h2><p>门店 / 团队 / 权限 / 帮助</p></div>';
  h += '<div class="card" style="padding:6px 14px;">';
  ROWS.forEach(function (r) {
    var inner = '<span class="ic">' + r.ic + '</span><span class="rt"><b>' + r.n + "</b><span>" + r.s + '</span></span><span class="ar">›</span>';
    if (r.href) h += '<a class="row" href="' + r.href + '">' + inner + "</a>";
    else h += '<button class="row' + (r.out ? " out" : "") + '" data-toast="' + (r.toast || "演示模块") + '">' + inner + "</button>";
  });
  h += '</div></section>';

  $("#app").innerHTML = h;
}

render();

/* ---------- sheet（复用共享 #lqSheet 遮罩，点遮罩由 lanqi-ui.js 统一关闭） ---------- */
function openSheet(html) {
  $("#lqSheet").innerHTML = html;
  $("#lqSheet").classList.add("show");
  $("#lqSheetMask").classList.add("show");
}
function closeSheet() {
  $("#lqSheet").classList.remove("show");
  $("#lqSheetMask").classList.remove("show");
}

/* AI 使用统计（构成 mini bars） */
var USAGE = [
  { ic: "🧑‍🏫", n: "数字咨询师对话", d: "客户咨询 · 经营问答", v: 128 },
  { ic: "⚙️", n: "内容生成",       d: "朋友圈 / 图文 / 视频", v: 96 },
  { ic: "🎯", n: "AI 模拟销售",    d: "话术对练 · 点评",     v: 52 },
  { ic: "🎙", n: "录音分析",       d: "夕会 / 沟通转写复盘", v: 36 }
];
function openUsage() {
  var total = USAGE.reduce(function (s, x) { return s + x.v; }, 0);
  var h = '<div class="grap"></div><h3>AI 使用统计 · 本月</h3><div class="sub">共 ' + total + " 次 · 较上月 +28% · 明细按模块构成</div>";
  USAGE.forEach(function (x) {
    var pct = Math.round(x.v / total * 100);
    h += '<div style="padding:10px 2px;border-bottom:1px solid #FFF3EA">' +
         '<div style="display:flex;align-items:center;gap:8px"><span style="font-size:15px">' + x.ic + "</span>" +
         '<b style="font-size:12.5px;flex:1">' + x.n + '</b><span style="font-size:12px;font-weight:900;color:var(--o3)">' + x.v + ' 次</span></div>' +
         '<div style="font-size:10px;color:var(--t3);margin:4px 0 6px">' + x.d + " · 占比 " + pct + "%</div>" +
         '<div style="height:7px;background:var(--soft);border-radius:99px;overflow:hidden"><i style="display:block;height:100%;width:' + pct + "%;background:var(--og);border-radius:99px\"></i></div></div>";
  });
  h += '<div class="s-btns"><button class="btn ghost" id="btnUsageClose">知道了</button><a class="btn primary" style="display:grid;place-items:center;text-decoration:none" href="points-recharge.html">去积分中心看消耗明细</a></div>';
  openSheet(h);
}

/* 账号设置 */
function openSetting() {
  var h = '<div class="grap"></div><h3>账号设置</h3><div class="sub">兰琪店长 · 138****6688 · 店长权限</div>';
  [["🔔", "新客预约提醒", "已开启"], ["📰", "每日经营 AI 日报", "每天 21:00 推送"], ["🌙", "深色模式", "跟随系统"], ["🔄", "门店数据自动同步", "已开启（3 店）"]].forEach(function (x) {
    h += '<div class="kv"><span class="k" style="display:flex;gap:8px;align-items:center"><span style="font-size:15px">' + x[0] + "</span>" + x[1] + '</span><span class="v" style="color:var(--t2)">' + x[2] + "</span></div>";
  });
  h += '<div class="s-btns"><button class="btn ghost" data-toast="演示原型：设置项不可真实修改">修改设置（原型）</button><button class="btn primary" id="btnUsageClose2">完成</button></div>';
  openSheet(h);
}

/* 升级套餐对比 */
function openUpgrade() {
  var PLANS = [
    { n: "体验版", p: "¥9 / 月", d: "1 家门店 · 每日 20 次 AI · 基础客户档案", cur: false },
    { n: "全案版", p: "¥29 / 月", d: "全部模块 · 无限档案 · 数字咨询师 · 内容自动化", cur: true },
    { n: "旗舰版", p: "¥99 / 月", d: "多店连锁看板 · 专属咨询师定制 · 私有数据对接", cur: false }
  ];
  var h = '<div class="grap"></div><h3>升级套餐</h3><div class="sub">当前：全案版 · 有效期至 2026-10-01 · 升级差价按天折算</div>';
  PLANS.forEach(function (x) {
    h += '<button class="opt' + (x.cur ? " on" : "") + '" data-toast="' + (x.cur ? "当前套餐，无需切换" : "演示原型：已发送「" + x.n + "」开通申请") + '">';
    h += '<span class="ic">' + (x.cur ? "⭐" : x.p === "¥9 / 月" ? "🌱" : "👑") + "</span>";
    h += '<span><span class="nm">' + x.n + " · " + x.p + (x.cur ? '<span class="tg">当前</span>' : "") + '</span><span class="ds">' + x.d + "</span></span>";
    h += '<span class="ck">' + (x.cur ? "✓" : "›") + "</span></button>";
  });
  h += '<div class="s-btns"><button class="btn primary" id="btnUpgradeClose">知道了</button></div>';
  openSheet(h);
}

/* 邀请成员 */
function openInvite() {
  var h = '<div class="grap"></div><h3>邀请成员</h3><div class="sub">生成邀请链接发给员工，加入后自动归入「' + esc(LQ.store().short) + "」</div>";
  h += '<div class="kv"><span class="k">邀请链接</span><span class="v" style="font-size:11.5px;color:var(--o3)">lq.ai/inv/x7K2</span></div>';
  h += '<div class="kv"><span class="k">默认角色</span><span class="v">美容师（店长可再调）</span></div>';
  h += '<div class="kv"><span class="k">有效期</span><span class="v">7 天 · 最多 5 人</span></div>';
  h += '<div class="s-btns"><button class="btn ghost" data-toast="演示原型：已复制邀请链接">复制链接</button><button class="btn primary" data-toast="演示原型：已生成邀请二维码（样例图）">生成二维码</button></div>';
  h += '<div class="sub" style="margin-top:8px">👥 当前 ' + LQ.store().staff + " 名员工 · 已用席位 24 / 30</div>";
  openSheet(h);
}

/* ---------- 页面事件（事件委托） ---------- */
document.addEventListener("click", function (e) {
  var t;
  if ((t = e.target.closest("#btnSetting"))) { openSetting(); return; }
  if ((t = e.target.closest("#btnUsage"))) { openUsage(); return; }
  if ((t = e.target.closest("#btnUpgrade"))) { openUpgrade(); return; }
  if ((t = e.target.closest("#btnInvite"))) { openInvite(); return; }
  if ((t = e.target.closest("#btnUsageClose")) || (t = e.target.closest("#btnUsageClose2")) || (t = e.target.closest("#btnUpgradeClose"))) { closeSheet(); return; }
  t = e.target.closest("[data-toast]");
  if (t) LQ.toast(t.getAttribute("data-toast") || "演示模块");
});

LQ.init({ tab: "mine", title: "我的" });
})();
</script>
</body>
</html>
