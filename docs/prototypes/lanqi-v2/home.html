<style>
/* ===== 驾驶舱私有样式（共享部分在 lanqi-ui.css） ===== */
/* AI 结论卡细节 */
.ai-body { font-size: 15px; line-height: 1.85; min-height: 118px; }
.ai-body p { margin-bottom: 7px; opacity: 0; transform: translateY(4px); transition: all .4s; }
.ai-body p.show { opacity: 1; transform: none; }
.ai-body [n] { color: #FFAE6E; font-weight: 800; font-size: 1.06em; text-shadow: 0 0 14px rgba(255,138,61,.4); }
.ai-head .time { font-size: 11px; color: rgba(255,220,190,.55); margin-left: 2px; }
.ai-regen { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; color: #FFB37E; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,150,80,.35); transition: all .18s; }
.ai-regen:active { transform: scale(.94); background: rgba(255,138,61,.15); }
.ai-foot { display: flex; align-items: center; gap: 14px; margin-top: 13px; padding-top: 14px; border-top: 1px dashed rgba(255,180,130,.22); flex-wrap: wrap; }
.ai-ring { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
.ai-ring svg { transform: rotate(-90deg); }
.ai-ring .rv { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ai-ring .rv b { display: block; font-size: 19px; font-weight: 900; color: #FFC79B; line-height: 1.1; }
.ai-ring .rv span { font-size: 9.5px; color: rgba(255,220,190,.6); }
.ai-forecast { flex: 1; min-width: 150px; }
.ai-forecast .fc-line { font-size: 12.5px; color: rgba(255,235,218,.85); margin-bottom: 5px; }
.ai-forecast .fc-line b { color: #7CE0AC; font-weight: 800; }
.ai-forecast .fc-line b.warn { color: #FF9C8A; }
.ai-worst { display: flex; align-items: center; gap: 7px; background: rgba(226,62,78,.16); border: 1px solid rgba(226,62,78,.4); border-radius: 10px; padding: 7px 11px; font-size: 12px; color: #FFC3BC; font-weight: 600; }
.ai-worst b { color: #FF8F80; }
.ai-cta { width: 100%; margin-top: 2px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px; border-radius: 13px; background: var(--og); color: #fff; font-size: 14.5px; font-weight: 800; letter-spacing: 1px; box-shadow: 0 6px 18px rgba(255,106,0,.4); transition: transform .15s; }
.ai-cta:active { transform: scale(.97); }

/* 本月目标横滑卡 */
.tg-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: 78%; gap: 11px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 8px; scrollbar-width: none; }
.tg-scroll::-webkit-scrollbar { display: none; }
.tg-card { scroll-snap-align: start; background: var(--card); border: 1px solid var(--line); border-radius: var(--rad); padding: 14px 15px 13px; box-shadow: var(--shadow-s); position: relative; overflow: hidden; transition: transform .15s; display: block; }
.tg-card:active { transform: scale(.98); }
.tg-card::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--og); opacity: .85; }
.tg-top { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
.tg-top .ic { font-size: 16px; }
.tg-top .nm { font-size: 13px; font-weight: 700; color: var(--t2); }
.tg-top .sub { font-size: 10px; color: var(--t3); background: var(--soft); padding: 2px 7px; border-radius: 999px; font-weight: 600; }
.tg-num { display: flex; align-items: baseline; gap: 5px; }
.tg-num b { font-size: 24px; font-weight: 900; letter-spacing: -.5px; }
.tg-num span { font-size: 11.5px; color: var(--t3); font-weight: 600; }
.tg-bar { height: 8px; background: #FFEBDD; border-radius: 99px; margin: 9px 0 7px; overflow: hidden; }
.tg-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--t3); }
.tg-meta .pct { font-weight: 900; font-size: 15px; color: var(--o1); }
.tg-meta .pct.slow { color: var(--red); }
.tg-meta .go { color: var(--o3); font-weight: 700; }

/* 沉睡分档 */
.sl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sl-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad-s); padding: 12px 11px; box-shadow: var(--shadow-s); border-top: 3px solid var(--o1); transition: transform .15s; display: block; }
.sl-card:active { transform: scale(.97); }
.sl-card.m2 { border-top-color: var(--amber); }
.sl-card.m3 { border-top-color: var(--red); }
.sl-name { font-size: 11px; font-weight: 700; color: var(--t2); display: flex; align-items: center; gap: 5px; }
.sl-name .bg { font-size: 9.5px; padding: 1px 6px; border-radius: 99px; font-weight: 800; }
.sl-card.m1 .bg { background: var(--soft); color: var(--o3); }
.sl-card.m2 .bg { background: #FDF3E0; color: var(--amber); }
.sl-card.m3 .bg { background: #FCE9EB; color: var(--red); }
.sl-stock { font-size: 20px; font-weight: 900; margin: 6px 0 1px; }
.sl-stock small { font-size: 10.5px; color: var(--t3); font-weight: 600; margin-left: 3px; }
.sl-range { font-size: 10px; color: var(--t3); margin-bottom: 8px; }
.sl-bar { height: 6px; border-radius: 99px; background: #FFEBDD; overflow: hidden; margin-bottom: 5px; }
.sl-bar i { display: block; height: 100%; border-radius: 99px; width: 0; transition: width .9s ease; }
.sl-card.m1 .sl-bar i { background: var(--og); }
.sl-card.m2 .sl-bar i { background: linear-gradient(90deg,#F2B23C,#E8930C); }
.sl-card.m3 .sl-bar i { background: linear-gradient(90deg,#F06E7C,#E23E4E); }
.sl-meta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--t3); font-weight: 600; }
.sl-meta b { color: var(--t1); }
.sl-tip { font-size: 10px; color: var(--t3); margin-top: 6px; line-height: 1.5; }

/* 9 维雷达 */
.radar-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad); padding: 16px 15px; box-shadow: var(--shadow-s); }
.rd-layout { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.rd-canvas { position: relative; width: 100%; max-width: 320px; }
.rd-canvas svg { width: 100%; height: auto; display: block; }
.rd-scan { transform-origin: 130px 130px; animation: rdspin 5.5s linear infinite; }
@keyframes rdspin { to { transform: rotate(360deg); } }
.rd-sum { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; justify-content: center; margin-top: -6px; }
.rd-sum .num { font-size: 27px; font-weight: 900; color: var(--o1); }
.rd-sum .lv { font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 99px; }
.rd-sum .wk { font-size: 11.5px; color: var(--t3); }
.rd-sum .wk b { color: var(--red); }
.rd-dims { display: grid; grid-template-columns: 1fr; gap: 6px; width: 100%; }
.rd-dim { display: grid; grid-template-columns: 22px 68px 1fr 52px 26px; align-items: center; gap: 7px; padding: 8px 10px; border-radius: 10px; font-size: 12px; cursor: pointer; border: 1px solid transparent; transition: all .16s; }
.rd-dim:hover, .rd-dim.on { background: var(--soft); border-color: var(--line2); }
.rd-dim .ic { text-align: center; font-size: 14px; }
.rd-dim .nm { font-weight: 700; color: var(--t2); white-space: nowrap; }
.rd-dim .bar { height: 6px; border-radius: 99px; background: #FFEFE3; position: relative; overflow: hidden; }
.rd-dim .bar i { display: block; height: 100%; border-radius: 99px; transition: width .8s ease; }
.rd-dim .bar::after { content: ""; position: absolute; left: 85%; top: -2px; bottom: -2px; width: 2px; background: rgba(122,100,85,.35); }
.rd-dim .vl { font-size: 10.5px; color: var(--t3); text-align: right; white-space: nowrap; }
.rd-dim .sc { font-size: 12.5px; font-weight: 900; text-align: right; }
.rd-tip { background: linear-gradient(135deg, #FFF3EA, #FFEBDD); border: 1px solid var(--line2); border-radius: 12px; padding: 10px 13px; font-size: 12px; color: var(--t2); line-height: 1.7; width: 100%; }
.rd-tip b { color: var(--o3); }
.rd-cmp { display: flex; align-items: center; gap: 7px; width: 100%; flex-wrap: wrap; }
.rd-cmp span { font-size: 11.5px; color: var(--t3); font-weight: 600; }
.rd-cmp button { font-size: 11.5px; font-weight: 700; padding: 5px 13px; border-radius: 99px; border: 1px solid var(--line2); color: var(--t2); background: #fff; transition: all .15s; }
.rd-cmp button.on { background: var(--blue); color: #fff; border-color: var(--blue); }
.rd-cmp button.on.c2 { background: var(--purple); border-color: var(--purple); }
.rd-foot { font-size: 10.5px; color: var(--t3); line-height: 1.7; margin-top: 10px; }
.rd-foot b { color: var(--t2); }

/* 门店健康度 */
.sh-list { display: grid; gap: 10px; }
.sh-row { display: flex; align-items: center; gap: 11px; background: var(--card); border: 1px solid var(--line); border-radius: var(--rad-s); padding: 12px 13px; box-shadow: var(--shadow-s); }
.sh-row.danger { border-color: rgba(226,62,78,.4); background: #FFF7F7; }
.sh-row.cur { outline: 2px solid rgba(255,106,0,.45); outline-offset: 1px; }
.sh-light { width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0; display: grid; place-content: center; text-align: center; font-weight: 900; font-size: 15px; }
.sh-row.danger .sh-light { background: #FCE9EB; color: var(--red); box-shadow: 0 0 0 3px rgba(226,62,78,.12); animation: lqPulse 2s infinite; }
.sh-row.ok .sh-light { background: #E7F8F0; color: var(--green); }
.sh-mid { flex: 1; min-width: 0; }
.sh-name { font-size: 13.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sh-name .tg { font-size: 9.5px; padding: 1px 7px; border-radius: 99px; background: var(--soft); color: var(--o3); font-weight: 700; }
.sh-name .now { font-size: 10px; padding: 1px 7px; border-radius: 99px; background: var(--og); color: #fff; font-weight: 700; }
.sh-desc { font-size: 11px; color: var(--t3); margin-top: 2px; line-height: 1.55; }
.sh-desc b { color: var(--t1); }
.sh-desc .todo { color: var(--o3); font-weight: 700; }
.sh-go { flex-shrink: 0; font-size: 11.5px; font-weight: 700; color: var(--o3); border: 1.5px solid var(--line2); border-radius: 999px; padding: 7px 13px; background: #fff; transition: all .15s; }
.sh-go:active { background: var(--og); color: #fff; border-color: transparent; }
.sh-note { font-size: 10.5px; color: var(--t3); margin-top: 8px; line-height: 1.65; }

/* 今日指标 */
.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad-s); padding: 12px 10px 10px; box-shadow: var(--shadow-s); text-align: center; }
.kpi .lb { font-size: 10.5px; color: var(--t3); font-weight: 600; }
.kpi .vl { font-size: 18.5px; font-weight: 900; margin: 3px 0 2px; letter-spacing: -.3px; }
.kpi .dt { font-size: 10px; font-weight: 700; }
.kpi .dt.up { color: var(--green); }
.kpi .dt.dn { color: var(--red); }
.kpi .dt.mid { color: var(--amber); }

/* 多店对比 */
table.cmp { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 480px; }
table.cmp th { font-size: 10.5px; color: var(--t3); font-weight: 700; text-align: center; padding: 9px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.cmp td { text-align: center; padding: 10px 6px; border-bottom: 1px solid #FFF3EA; font-weight: 700; white-space: nowrap; }
table.cmp tr:last-child td { border-bottom: none; }
table.cmp td:first-child, table.cmp th:first-child { text-align: left; }
.store-cell { font-weight: 800; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.store-cell .now-dot { font-size: 9.5px; background: var(--og); color: #fff; border-radius: 99px; padding: 1px 7px; }
table.cmp tr.cur { background: var(--soft); }
td.bad { color: var(--red); }
td.warn { color: var(--amber); }
td.good { color: var(--green); }
.cmp-ai { margin-top: 8px; font-size: 11.5px; color: var(--t2); line-height: 1.7; background: linear-gradient(135deg,#FFF3EA,#FFEBDD); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 12px; }
.cmp-ai b { color: var(--o3); }
.cmp-ai .aic { font-size: 10px; font-weight: 800; color: #fff; background: var(--og); border-radius: 99px; padding: 1.5px 8px; margin-right: 5px; }

/* 工具宫格 */
.tools-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
.tool { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad-s); padding: 13px 5px 10px; text-align: center; box-shadow: var(--shadow-s); transition: transform .15s; position: relative; }
.tool:active { transform: scale(.94); }
.tool .ic { width: 40px; height: 40px; margin: 0 auto 7px; border-radius: 13px; background: linear-gradient(145deg, #FFF1E4, #FFE3CE); display: grid; place-items: center; font-size: 19px; }
.tool.hot .ic { background: var(--og); box-shadow: 0 5px 14px rgba(255,106,0,.35); }
.tool .nm { font-size: 10.5px; font-weight: 700; color: var(--t2); line-height: 1.35; }
.tool .bd { position: absolute; top: 6px; right: 6px; font-size: 8.5px; font-weight: 800; background: var(--red); color: #fff; border-radius: 99px; padding: 1px 6px; }
.tool .bd.new { background: var(--o1); }

/* 今天干什么 */
.todo-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad); padding: 16px 14px; box-shadow: var(--shadow-s); }
.todo-lv { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12.5px; color: var(--t2); font-weight: 700; }
.todo-lv .cnt { font-size: 10.5px; background: var(--soft); color: var(--o3); border-radius: 99px; padding: 2px 9px; font-weight: 800; }
.todo-item { border: 1px solid var(--line); border-radius: 13px; padding: 12px 13px; margin-bottom: 10px; position: relative; background: linear-gradient(180deg, #fff, #FFFBF7); transition: all .15s; }
.todo-item.p0 { border-left: 4px solid var(--red); background: linear-gradient(180deg,#FFF9F9,#fff); }
.todo-item.p1 { border-left: 4px solid var(--o1); }
.todo-item.p2 { border-left: 4px solid var(--amber); }
.todo-item .pri { position: absolute; top: 12px; right: 12px; font-size: 9.5px; font-weight: 900; padding: 2px 8px; border-radius: 6px; letter-spacing: .5px; }
.todo-item.p0 .pri { background: #FCE9EB; color: var(--red); }
.todo-item.p1 .pri { background: var(--soft); color: var(--o3); }
.todo-item.p2 .pri { background: #FDF3E0; color: var(--amber); }
.todo-item h4 { font-size: 13.5px; font-weight: 800; padding-right: 44px; line-height: 1.5; }
.todo-item .why { font-size: 11.5px; color: var(--t2); margin: 6px 0 9px; line-height: 1.7; }
.todo-item .why b { color: var(--t1); }
.todo-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.todo-acts .act { font-size: 11.5px; font-weight: 700; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line2); color: var(--o3); background: #fff; transition: all .15s; min-height: 34px; display: inline-flex; align-items: center; }
.todo-acts .act.pri-a { background: var(--og); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(255,106,0,.3); }
.todo-acts .act:active { transform: scale(.95); }
.r-head { display: flex; align-items: center; gap: 8px; margin: 16px 0 10px; font-size: 12.5px; color: var(--t2); font-weight: 700; }
.r-head .cnt { font-size: 10.5px; background: #F3EDE6; color: var(--t2); border-radius: 99px; padding: 2px 9px; font-weight: 800; }
.r-item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border-radius: 12px; margin-bottom: 7px; background: #FFF9F4; border: 1px dashed var(--line2); }
.r-check { width: 21px; height: 21px; border-radius: 8px; flex-shrink: 0; margin-top: 1px; border: 2px solid #E8C9AE; background: #fff; display: grid; place-items: center; font-size: 12px; color: #fff; transition: all .18s; cursor: pointer; }
.r-item.done .r-check { background: var(--og); border-color: var(--og); }
.r-item.done .r-t, .r-item.done .r-w { opacity: .45; text-decoration: line-through; }
.r-mid { flex: 1; min-width: 0; }
.r-t { font-size: 12.5px; font-weight: 700; line-height: 1.5; }
.r-t .rtag { font-size: 9.5px; background: var(--soft); color: var(--o3); border-radius: 99px; padding: 1px 7px; font-weight: 800; margin-right: 5px; vertical-align: 1px; }
.r-w { font-size: 10.5px; color: var(--t3); margin-top: 2px; }
.r-link { font-size: 11px; color: var(--o3); font-weight: 700; white-space: nowrap; margin-top: 3px; }

/* 演示按钮 */
.demo-btn { position: fixed; right: 14px; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 70; display: inline-flex; align-items: center; gap: 6px; background: var(--og); color: #fff; font-size: 13px; font-weight: 800; padding: 11px 18px; border-radius: 999px; box-shadow: 0 8px 22px rgba(255,106,0,.45); transition: transform .15s; }
.demo-btn:active { transform: scale(.93); }

/* 桌面增强 */
@media (min-width: 960px) {
  .tg-scroll { grid-auto-columns: calc((100% - 33px)/4); overflow: visible; }
  .kpi-grid { grid-template-columns: repeat(5, 1fr); }
  .rd-layout { flex-direction: row; align-items: flex-start; }
  .rd-canvas { flex-shrink: 0; width: 320px; }
  .rd-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .demo-btn { bottom: 26px; }
}
</style>

  svg += '<polygon id="rdPoly" points="' + radarPts(scores, C, R) + '" fill="rgba(255,106,0,.16)" stroke="#FF6A00" stroke-width="2" stroke-linejoin="round" style="transform-origin:130px 130px;animation:rdIn .9s cubic-bezier(.2,.8,.3,1.1) both"/>';
  scores.forEach(function (sc, i2) {
    var a2 = (-90 + i2 * 45) * Math.PI / 180, r2 = R * sc / 100;
    svg += '<circle cx="' + (C + r2 * Math.cos(a2)).toFixed(1) + '" cy="' + (C + r2 * Math.sin(a2)).toFixed(1) + '" r="3.4" fill="' + scColor(sc) + '" stroke="#fff" stroke-width="1.5"/>';
  });
  RADAR_DIMS.forEach(function (d, i3) {
    var a3 = (-90 + i3 * 45) * Math.PI / 180;
    svg += '<text x="' + (C + (R + 16) * Math.cos(a3)).toFixed(1) + '" y="' + (C + (R + 16) * Math.sin(a3) + 3.5).toFixed(1) + '" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7A6455">' + d.n + "</text>";
  });
  svg += "<style>@keyframes rdIn{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}</style></svg>";

  var h = '<section class="rise"><div class="sec-head"><h2><span class="bar"></span>9 维经营健康度</h2><p>越靠外越健康 · 虚线圈是行业健康线</p></div>';
  h += '<div class="radar-card"><div class="rd-layout">';
  h += '  <div class="rd-canvas">' + svg + "</div>";
  h += '  <div class="rd-side">';
  h += '    <div class="rd-sum"><span class="num">' + total + '</span><span class="lv" style="color:' + scColor(total) + ";background:" + scColor(total) + '1A">' + scLv(total) + '</span><span class="wk">' + danger + " 项未达标 · 最弱 <b>" + RADAR_DIMS[weak].n + "（" + scores[weak] + "）</b></span></div>";
  h += '    <div class="rd-dims">';
  RADAR_DIMS.forEach(function (d, i4) {
    var sc = scores[i4], v = vals[i4];
    h += '  <div class="rd-dim' + (i4 === rdActive ? " on" : "") + '" data-dim="' + i4 + '">';
    h += '    <span class="ic">' + d.ico + '</span><span class="nm">' + d.n + '</span>';
    h += '    <span class="bar"><i style="background:' + scColor(sc) + '" data-w="' + sc + '"></i></span>';
    h += '    <span class="vl">' + (d.unit === "元" ? "¥" + fmt(v) : v + "%") + '</span><span class="sc" style="color:' + scColor(sc) + '">' + sc + "</span></div>";
  });
  h += "    </div>";
  h += '    <div class="rd-tip" id="rdTip"></div>';
  h += '    <div class="rd-cmp"><span>叠加对比：</span>';
  ["s1", "s2", "s3"].forEach(function (id) {
    if (id === s.id) return;
    h += '<button type="button" class="' + (id === "s2" ? "" : "c2") + (rdCmp.indexOf(id) >= 0 ? " on" : "") + '" data-cmp="' + id + '">' + esc(LQ.STORES.filter(function (x) { return x.id === id; })[0].short) + "</button>";
  });
  h += "    </div></div></div>";
  h += '  <div class="rd-foot">口径：每项换算成 0–100 分，<b>85 分 = 刚好踩健康线</b>，负向指标已反向计分，<b>越靠外越健康</b>。其中<b>「预收健康」是多数同类系统没有的</b>。</div></div></section>';
  return h;
}
function renderRdTip(s) {
  var tip = $("#rdTip");
  if (!tip) return;
  var scores = RADAR_DIMS.map(function (d) { return radarScore(d, s.radar[d.k]); });
  if (rdActive < 0) {
    var bad = scores.filter(function (x) { return x < 85; }).length;
    tip.innerHTML = "👆 点上面任意一项，看这项是什么意思、现在该怎么动。" + (bad ? ' 当前有 <b>' + bad + " 项</b>在健康线以内（未达标）。" : " 9 项全部达标。");
  } else {
    var d = RADAR_DIMS[rdActive], v = s.radar[d.k];
    tip.innerHTML = "<b>" + d.ico + " " + d.n + "</b>　当前 <b>" + (d.unit === "元" ? "¥" + fmt(v) : v + "%") + "</b>，健康线 " + (d.unit === "元" ? "¥" + fmt(d.line) : d.line + "%") + "（" + (d.dir > 0 ? "越高越好" : "越低越好") + "）<br>" + d.tip + "<br>👉 <b>" + d.act + "</b>";
  }
}

/* ---------- ⑤ 门店健康度 ---------- */
function storeHealthHtml(s) {

    s1: { back: "唤醒 47%（慢 13 个点）· 升单 55%（慢 5 个点）", todo: "还差 16 人，日均 2 人" },
    s2: { back: "唤醒 55%（慢 5 个点）· 卡耗率 58%（低于达标线 2 个点）", todo: "还差 9 人，日均 1 人" },
    s3: { back: "唤醒 33%（慢 27 个点）· 升单 38%（慢 22 个点）", todo: "还差 8 人，日均 1 人" }
  };
  var list = LQ.STORES.filter(function (x) { return x.id !== "all"; }).sort(function (a, b) { return a.health - b.health; });
  var h = '<section class="rise"><div class="sec-head"><h2><span class="bar"></span>门店健康度</h2><p>分低的排最前 · 点「切到」换店</p></div><div class="sh-list">';

    h += '  <div class="sh-mid">';

    h += '    <div class="sh-desc">落后最多：<b>' + L.back + "</b></div>";
    h += '    <div class="sh-desc">今天该盯 <b class="todo">唤醒</b>：' + L.todo + " · 剩 " + MONTH.leftDays + " 天</div></div>";
    h += isCur ? '<span class="sh-go">已在这家</span>' : '<button class="sh-go" data-lq-store="' + st.id + '">切到这家 →</button>';

  h += "</div>";
  h += '<div class="sh-note">3 家店 · <b style="color:var(--red)">1 家要救</b> · 2 家健康。打分口径：业绩/新客/升单/唤醒 = 达成率 ÷ 时间进度（60%），卡耗率 = 卡耗率 ÷ 60，封顶 100 取平均。<b style="color:var(--red)">2 项以上落后超 10 个点直接判红</b>。</div></section>';
  return h;
}

function kpiHtml(s) {

/* ---------- ⑦ 多店对比 ---------- */
function cmpHtml(s) {

    { id: "s1", vals: ["61%", "65%", "55%", "47%", "63%", "37%"], cls: ["good", "good", "warn", "bad", "good", "bad"] },
    { id: "s2", vals: ["67%", "68%", "67%", "55%", "58%", "35%"], cls: ["good", "good", "good", "warn", "warn", "warn"] },

/* ---------- 渲染 ---------- */
var todoDone = {};
function render() {
  var s = LQ.store();
  $("#app").innerHTML =
    aiHtml(s) + todoHtml(s) + targetsHtml(s) + sleepHtml(s) + radarHtml(s) +
    storeHealthHtml(s) + kpiHtml(s) + cmpHtml(s) + toolsHtml();
  renderRdTip(s);
  $$("#app .rise").forEach(function (el, i) { setTimeout(function () { el.classList.add("in"); }, 60 * i); });
  setTimeout(function () { $$("#app [data-w]").forEach(function (el) { el.style.width = el.getAttribute("data-w") + "%"; }); }, 350);
  playVerdict(s);
}
render();

/* ---------- 页面事件 ---------- */
document.addEventListener("click", function (e) {
  var dim = e.target.closest("[data-dim]");
  if (dim) {
    rdActive = (rdActive === +dim.getAttribute("data-dim")) ? -1 : +dim.getAttribute("data-dim");
    $$(".rd-dim").forEach(function (el) { el.classList.toggle("on", +el.getAttribute("data-dim") === rdActive); });
    renderRdTip(LQ.store());
    return;
  }
  var cmp = e.target.closest("[data-cmp]");
  if (cmp) {
    var cid = cmp.getAttribute("data-cmp"), ix = rdCmp.indexOf(cid);
    if (ix >= 0) rdCmp.splice(ix, 1); else rdCmp.push(cid);
    cmp.classList.toggle("on");
    LQ.toast("叠加 " + LQ.STORES.filter(function (x) { return x.id === cid; })[0].short + " 对比（demo：雷达上叠加展示）");
    return;
  }
  var rItem = e.target.closest("[data-daily]");
  if (rItem && !e.target.closest(".r-link")) {
    var key = rItem.getAttribute("data-daily");
    todoDone[key] = !todoDone[key];
    rItem.classList.toggle("done");
    rItem.querySelector(".r-check").textContent = todoDone[key] ? "✓" : "";
    var s2 = LQ.store();
    var done = DAILY.filter(function (d, i) { return todoDone[s2.id + "-" + i]; }).length;
    var cnt = $("#rCnt");
    if (cnt) cnt.textContent = "每天固定 · 已做 " + done + "/" + DAILY.length;
    return;
  }
});
