<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>兰琪AI·经营大脑 v2 · 沉睡唤醒引擎</title>
<link rel="stylesheet" href="assets/lanqi-ui.css">
<style>
/* ===== 沉睡唤醒引擎私有样式（共享部分在 lanqi-ui.css） ===== */
/* AI 结论卡细节（与首页同款节奏） */
.ai-body { font-size: 15px; line-height: 1.85; min-height: 96px; }
.ai-body p { margin-bottom: 7px; opacity: 0; transform: translateY(4px); transition: all .4s; }
.ai-body p.show { opacity: 1; transform: none; }
.ai-body [n] { color: #FFAE6E; font-weight: 800; font-size: 1.06em; text-shadow: 0 0 14px rgba(255,138,61,.4); }
.ai-head .time { font-size: 11px; color: rgba(255,220,190,.55); margin-left: 2px; }
.ai-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 13px; }
.ai-stat { flex: 1; min-width: 104px; background: rgba(255,150,80,.1); border: 1px solid rgba(255,150,80,.28); border-radius: 12px; padding: 9px 11px; }
.ai-stat .k { font-size: 10px; color: rgba(255,220,190,.6); font-weight: 600; }
.ai-stat .v { font-size: 17px; font-weight: 900; color: #FFC79B; margin-top: 1px; }
.ai-stat .v small { font-size: 10px; font-weight: 600; color: rgba(255,220,190,.6); margin-left: 2px; }
.ai-cta2 { margin-top: 13px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px; border-radius: 13px; background: var(--og); color: #fff; font-size: 14.5px; font-weight: 800; letter-spacing: 1px; box-shadow: 0 6px 18px rgba(255,106,0,.4); transition: transform .15s; }
.ai-cta2:active { transform: scale(.97); }

/* 沉睡分档三卡 */
.tw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tw-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad-s); padding: 12px 11px; box-shadow: var(--shadow-s); border-top: 3px solid var(--o1); }
.tw-card.m2 { border-top-color: var(--amber); }
.tw-card.m3 { border-top-color: var(--red); }
.tw-name { font-size: 11px; font-weight: 700; color: var(--t2); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.tw-name .bg { font-size: 9.5px; padding: 1px 6px; border-radius: 99px; font-weight: 800; }
.tw-card.m1 .bg { background: var(--soft); color: var(--o3); }
.tw-card.m2 .bg { background: #FDF3E0; color: var(--amber); }
.tw-card.m3 .bg { background: #FCE9EB; color: var(--red); }
.tw-stock { font-size: 20px; font-weight: 900; margin: 6px 0 1px; }
.tw-stock small { font-size: 10.5px; color: var(--t3); font-weight: 600; margin-left: 3px; }
.tw-range { font-size: 10px; color: var(--t3); margin-bottom: 8px; }
.tw-card .pbar { height: 7px; }
.tw-card.m2 .pfill { background: linear-gradient(90deg, #F2B23C, #E8930C); }
.tw-card.m3 .pfill { background: linear-gradient(90deg, #F06E7C, #E23E4E); }
.tw-meta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--t3); font-weight: 600; margin-top: 7px; }
.tw-meta b { color: var(--t1); }
.tw-tip { font-size: 10px; color: var(--t3); margin-top: 6px; line-height: 1.5; }

/* 唤醒话术卡 */
.sc-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad); padding: 14px 15px; box-shadow: var(--shadow-s); }
.sc-head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.sc-badge { font-size: 10px; font-weight: 800; padding: 2.5px 9px; border-radius: 6px; color: #fff; }
.sc-card.m1 .sc-badge { background: var(--o1); }
.sc-card.m2 .sc-badge { background: var(--amber); }
.sc-card.m3 .sc-badge { background: var(--red); }
.sc-chan { font-size: 10.5px; font-weight: 700; color: var(--t3); background: var(--soft); border-radius: 99px; padding: 2.5px 9px; margin-left: auto; }
.sc-txt { white-space: pre-line; font-size: 13.5px; line-height: 1.9; background: var(--soft); border-radius: 12px; padding: 12px 13px; margin-top: 10px; color: var(--t1); }
.sc-acts { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
.wake-cta { width: 100%; margin-top: 13px; display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 50px; border-radius: 14px; background: var(--og); color: #fff; font-size: 15px; font-weight: 800; letter-spacing: 1px; box-shadow: 0 6px 18px rgba(255,106,0,.4); transition: transform .15s; }
.wake-cta:active { transform: scale(.97); }

/* 唤醒漏斗 */
.fn-row { display: grid; grid-template-columns: 52px 1fr 46px; gap: 9px; align-items: center; padding: 7px 0; }
.fn-lb { font-size: 12px; font-weight: 700; color: var(--t2); }
.fn-num { font-size: 15px; font-weight: 900; text-align: right; }
.fn-num small { display: block; font-size: 9.5px; color: var(--t3); font-weight: 600; }
.fn-note { font-size: 10.5px; color: var(--t2); line-height: 1.7; margin-top: 10px; background: linear-gradient(135deg, #FFF3EA, #FFEBDD); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 12px; }
.fn-note b { color: var(--o3); }

/* 沉睡客户名单表 */
.wk-tbl { min-width: 780px; }
.wk-tbl td, .wk-tbl th { text-align: left; }
.wk-tbl td.ctr, .wk-tbl th.ctr { text-align: center; }
.wk-tbl td { white-space: normal; }
.lv { font-size: 9.5px; font-weight: 800; border-radius: 99px; padding: 1px 6px; margin-left: 5px; vertical-align: 1px; }
.lv.A { background: #FCE9EB; color: var(--red); }
.lv.B { background: #FDF3E0; color: var(--amber); }
.lv.C { background: #F3EDE6; color: var(--t3); }
.tp { display: inline-block; font-size: 9.5px; font-weight: 800; border-radius: 99px; padding: 1.5px 8px; }
.tp.m1 { background: #FDF3E0; color: var(--amber); }
.tp.m2 { background: var(--soft); color: var(--o3); }
.tp.m3 { background: #FCE9EB; color: var(--red); }
#wkTbody tr { cursor: pointer; }
#wkTbody tr.sel { background: rgba(255,106,0,.07); }
.why-cell { max-width: 210px; font-weight: 500; color: var(--t2); font-size: 11.5px; }

/* 详细话术面板 */
.sp-panel { margin-top: 12px; border: 1.5px solid var(--line2); border-radius: var(--rad-s); background: linear-gradient(180deg, #FFFDFB, #FFF6EE); padding: 14px; display: none; }
.sp-panel.open { display: block; }
.sp-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sp-head b { font-size: 13.5px; }
.sp-tabs { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.sp-tab { border: 1px solid var(--line2); background: #fff; color: var(--t2); border-radius: 999px; padding: 5px 13px; font-size: 12px; font-weight: 700; transition: all .15s; }
.sp-tab.on { background: var(--og); color: #fff; border-color: transparent; }
.sp-body { white-space: pre-line; font-size: 13px; line-height: 1.9; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; margin-top: 10px; color: var(--t1); }
.sp-why { font-size: 11.5px; color: var(--t2); line-height: 1.75; margin-top: 9px; }
.sp-why b { color: var(--o3); }
.sp-acts { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
.sp-acts .btn { flex: 1; min-width: 108px; min-height: 38px; font-size: 12px; }

/* 执行提醒 */
.act-item { display: flex; gap: 11px; padding: 12px 2px; border-bottom: 1px dashed var(--line); cursor: pointer; transition: transform .15s; }
.act-item:last-of-type { border-bottom: none; padding-bottom: 3px; }
.act-item:active { transform: scale(.99); }
.act-item .a-b { flex: 1; min-width: 0; }
.a-n { width: 22px; height: 22px; border-radius: 8px; background: var(--og); color: #fff; font-size: 11.5px; font-weight: 900; display: grid; place-items: center; flex-shrink: 0; margin-top: 2px; }
.a-t { font-size: 13px; font-weight: 800; line-height: 1.5; }
.a-d { font-size: 11.5px; color: var(--t2); line-height: 1.7; margin-top: 2px; }
.a-d b { color: var(--o3); }

/* 桌面增强 */
@media (min-width: 960px) {
  .tw-grid { gap: 12px; }
}
</style>
</head>

<body>

<div id="lqHeader"></div>

<main id="app"></main>

<div class="foot-note">兰琪AI·经营大脑 v2 · UI 升级设计稿 · 2026-09-24 · 仅设计演示</div>

<div id="lqTabbar"></div>

<script src="assets/lanqi-ui.js"></script>
<script>
/* ============================================================
   沉睡唤醒引擎（数据随门店切换：LQ.store()）
   ============================================================ */
(function () {
"use strict";
var $ = LQ.$, $$ = LQ.$$, esc = LQ.esc, fmt = LQ.fmt, pct = LQ.pct;
var MONTH = LQ.MONTH;

/* 分档元信息（口径：M1 = 30-60 天，M2 = 60-90 天，M3 = 90 天+） */
var TIER = {
  m1: { n: "浅睡", badge: "黄金期", range: "30-60 天", chan: "建议渠道：企微 / 电话", tip: "最好叫：直接约档期，别寒暄太久" },
  m2: { n: "中睡", badge: "关键期", range: "60-90 天", chan: "建议渠道：企微群发", tip: "要有钩子：到店礼 / 专享档期" },
  m3: { n: "深睡", badge: "重症期", range: "90 天+", chan: "建议渠道：短信破冰", tip: "只破冰不推销，回一句算赢" }
};

/* 话术库（复制按钮取这里） */
var SCRIPTS = {
  m1: "X姐～我是您专属顾问小兰 😊 翻档案看到您上次做肩颈护理是 38 天前，算算日子该补一补了。这周三、四我还有档期，老时间一小时，给您留一个？\n（发完隔一天没回，补一句：『姐，忙的话我下周再问您』）",
  m2: "X姐，这个月店里给老客留了个「回来礼」——到店送一次深层热敷，约 20 分钟，不额外收费。我第一个想到的就是您，您看这周哪天方便？\n（M2 要给一个具体回来的理由，别空喊『好久不见』）",
  m3: "X姐，好久没见您了。不聊项目，就想知道您最近身体怎么样。哪天路过，进来坐坐，我给您泡杯茶，顺手放松十分钟，不收钱。\n（M3 只破冰、不推销：能回一句就算赢，先别算进本月业绩）"
};

/* 渠道标签 + 沉睡客户名单（原型示例数据 · 与目标明细页同源人物，按历史消费降序） */
var CH_LABEL = { "企微": "企微群发/单发", "微信": "微信私聊", "电话": "电话呼出", "短信": "短信触达" };
var WLIST = [
  { name: "顾晓",  lv: "A", tier: "m2", days: 89,  spent: 6000, proj: "6000 深宠年卡",    staff: "张店长", touch: "08-25 电话", why: "高消费力 + 长周期未回，转介绍过 1 位新客", ch: "电话" },
  { name: "姜楠",  lv: "A", tier: "m1", days: 36,  spent: 2980, proj: "抗初老疗程 6 次",  staff: "X师傅",  touch: "09-02 微信", why: "才走 1 个多月，效果好但没人提醒续做", ch: "企微" },
  { name: "崔颖",  lv: "A", tier: "m1", days: 38,  spent: 2980, proj: "肩颈舒缓 10 次卡", staff: "X姐",    touch: "09-02 微信", why: "卡内还剩 6 次，天凉肩颈易僵正是召回时机", ch: "企微" },
  { name: "韩梅",  lv: "B", tier: "m3", days: 96,  spent: 1980, proj: "补水护理 12 次",   staff: "张店长", touch: "09-01 电话", why: "沉睡刚过 90 天，历史消费稳定，破冰仍有戏", ch: "电话" },
  { name: "袁华",  lv: "B", tier: "m1", days: 58,  spent: 1980, proj: "肩颈舒缓 10 次卡", staff: "X小美",  touch: "08-30 短信", why: "临近 60 天临界点，再不跟就滑入 M2", ch: "短信" },
  { name: "沈璐",  lv: "B", tier: "m1", days: 33,  spent: 1980, proj: "980 体验卡",       staff: "X师傅",  touch: "08-29 微信", why: "体验后未升单即失联，价格敏感，适合带券回", ch: "微信" },
  { name: "石敏",  lv: "B", tier: "m2", days: 61,  spent: 1980, proj: "抗初老疗程 6 次",  staff: "X姐",    touch: "08-30 电话", why: "刚进 M2 还有印象，带「到店礼」钩子成功率最高", ch: "电话" },
  { name: "章程",  lv: "C", tier: "m1", days: 45,  spent: 980,  proj: "小气泡清洁",       staff: "X小美",  touch: "08-28 短信", why: "套餐做一半停了，大概率是忘了不是不满意", ch: "短信" },
  { name: "白雪",  lv: "C", tier: "m1", days: 41,  spent: 980,  proj: "补水护理 12 次",   staff: "X姐",    touch: "09-01 企微", why: "老客复购型，正常问候 + 约档期即可", ch: "企微" },
  { name: "汪蕊",  lv: "C", tier: "m1", days: 49,  spent: 980,  proj: "肩颈舒缓 10 次卡", staff: "X小美",  touch: "09-01 企微", why: "转介绍过 2 位新客，种子客户要重点维护", ch: "企微" },
  { name: "唐燕",  lv: "C", tier: "m1", days: 47,  spent: 980,  proj: "深层清洁",         staff: "张店长", touch: "08-27 电话", why: "生日月在 9 月，带生日礼触达有由头", ch: "电话" },
  { name: "曹颖",  lv: "C", tier: "m2", days: 72,  spent: 980,  proj: "980 体验卡",       staff: "X师傅",  touch: "09-01 微信", why: "M2 关键期，要用具体理由（回来礼）拉回", ch: "微信" }
];
var curIdx = -1, curKind = "企微";

function estRev() { var n = 0; WLIST.forEach(function (c) { n += c.spent; }); return Math.round(n * 0.08); } /* 按名单历史消费 8% 估（行业经验值） */

/* AI 话术生成（本地模板，按档位 + 沉睡原因 + 历史项目 + 归属人拼接） */
function genScript(c, kind) {
  var st = LQ.store();
  if (kind === "电话") {
    return c.name + "您好，我是" + st.short + "的" + c.staff + "。\n" +
      "看您上次来做" + c.proj + "是 " + c.days + " 天前了，最近" + (c.tier === "m3" ? "一直没见着您" : "天凉了") + "，肩颈是不是又紧了？\n" +
      (c.tier === "m1"
        ? "我这边周三四还有档期，给您留一个？还是老时间，一小时搞定。"
        : (c.tier === "m2"
          ? "这个月店里有个老客回归的护理，我特意给您留了名额，不额外收费，您看这周哪天方便？"
          : "不推销，就是想问问您最近身体怎么样。要是方便，回来让我给您看看，这次我给您加个热敷，算我请您的。")) +
      "\n—— 说完停住，等她回话，别一口气讲完。";
  }
  if (kind === "短信") {
    return "【" + st.short + "】" + c.name + "，我是您的美容顾问" + c.staff + "。\n" +
      "您有 " + c.days + " 天没来做" + c.proj + "了，" + c.why + "。\n" +
      "本月老客回归专享：到店即送热敷/肩颈放松一次（约 20 分钟），不额外收费。\n" +
      "回复 1 我给您留档期，回复 0 我就不打扰您了。";
  }
  /* 企微 / 微信 */
  return c.name + "～ 我是" + c.staff + " 😊\n" +
    "翻档案看到您上次做" + c.proj + "是 " + c.days + " 天前，算算日子，效果该补一补了。\n" +
    (c.tier === "m1"
      ? "这周三/四我还有档期，给您留一个？老时间，一小时。"
      : (c.tier === "m2"
        ? "这个月店里给老客留了个「回来礼」——到店送一次深层热敷，我第一个想到的就是您。您看这周哪天方便？"
        : "好久没见您了，不聊项目，就想知道您最近身体怎么样。\n要是哪天路过，进来坐坐，我给您泡杯茶，顺手放松十分钟，不收钱。")) +
    "\n（别发完就完，隔一天没回，再补一句：「姐，忙的话我下个月再问您」）";
}

function sleepTotal(s) { var n = 0; s.sleep.forEach(function (t) { n += t.stock; }); return n; }
function sleepGoal(s) { var n = 0; s.sleep.forEach(function (t) { n += t.goal; }); return n; }
function sleepCur(s) { var n = 0; s.sleep.forEach(function (t) { n += t.cur; }); return n; }

/* ---------- ① AI 今日唤醒结论（深色卡） ---------- */
function aiHtml(s) {
  var stock = sleepTotal(s), goal = sleepGoal(s), cur = sleepCur(s);
  var daily = Math.max(1, Math.ceil((goal - cur) / Math.max(1, MONTH.leftDays)));
  var h = '<section class="span2 rise"><div class="ai-wrap"><div class="ai-card">';
  h += '  <div class="ai-head">';
  h += '    <span class="ai-badge"><span class="dot"></span>✨ AI 唤醒引擎 · 今日结论</span>';
  h += '    <span class="time">09:00 已分析 ' + esc(s.short) + " 沉睡名单</span>";
  h += "  </div>";
  h += '  <div class="ai-body" id="aiBody"></div>';
  h += '  <div class="ai-stats">';
  h += '    <div class="ai-stat"><div class="k">😴 沉睡存量</div><div class="v">' + stock + "<small>人 · 占 " + pct(stock, s.members) + '%</small></div></div>';
  h += '    <div class="ai-stat"><div class="k">🎯 今日待唤</div><div class="v">' + daily + "<small>人</small></div></div>";
  h += '    <div class="ai-stat"><div class="k">🤖 已生成话术</div><div class="v">' + s.sleep.length * 3 + "<small>条 · 按档位</small></div></div>";
  h += '    <div class="ai-stat"><div class="k">💵 唤醒预估营收</div><div class="v">¥' + fmt(estRev()) + "<small>按名单消费 8% 估</small></div></div>";
  h += "  </div>";
  h += '  <a class="ai-cta2" href="#wakeLib">↓ 查看 AI 生成的今日话术库</a>';
  h += "</div></div></section>";
  return { html: h, daily: daily };
}
function playAi(s) {
  var body = $("#aiBody");
  if (!body) return;
  var stock = sleepTotal(s), goal = sleepGoal(s), cur = sleepCur(s);
  var daily = Math.max(1, Math.ceil((goal - cur) / Math.max(1, MONTH.leftDays)));
  var rate = pct(cur, goal);
  var lines = [
    "数据截至 9 月第 18 天 —— " + esc(s.short) + " 三档沉睡共 <n>" + stock + " 人</n>（占会员 " + pct(stock, s.members) + "%），本月已唤醒 <n>" + cur + "/" + goal + "</n>（" + rate + "%），还剩 " + MONTH.leftDays + " 天。",
    "今日目标 <n>" + daily + " 人</n>：AI 已按档生成话术——M1 直接约档期、M2 带钩子、M3 只破冰。先啃 M1，一通电话能回来一半。"
  ];
  body.innerHTML = lines.map(function () { return "<p></p>"; }).join("");
  var ps = body.querySelectorAll("p");
  lines.forEach(function (t, i) {
    setTimeout(function () {
      var p = ps[i];
      if (!p) return;
      p.innerHTML = t;
      p.classList.add("show");
    }, 240 * i + 150);
  });
}

/* ---------- ② 沉睡分档三卡 ---------- */
function tierHtml(s) {
  var h = '<section class="span2 rise"><div class="sec-head"><h2><span class="bar"></span>沉睡分档</h2><p>沉睡 <b>' + sleepTotal(s) + "</b> 人 · 本月已唤醒 " + sleepCur(s) + "/" + sleepGoal(s) + " 人</p></div>";
  h += '<div class="tw-grid">';
  s.sleep.forEach(function (t) {
    var m = TIER[t.key], p = pct(t.cur, t.goal);
    h += '<div class="tw-card ' + t.key + '">';
    h += '  <div class="tw-name">' + m.n + ' <span class="bg">' + m.badge + "</span></div>";
    h += '  <div class="tw-stock">' + t.stock + "<small>人存量</small></div>";
    h += '  <div class="tw-range">' + m.range + " · 历史成功率 " + t.rate + "%</div>";
    h += '  <div class="pbar"><i class="pfill" data-w="' + p + '"></i></div>';
    h += '  <div class="tw-meta"><span>已唤醒 <b>' + t.cur + "/" + t.goal + "</b></span><span>" + p + '%</span></div>';
    h += '  <div class="tw-tip">💡 ' + m.tip + "</div></div>";
  });
  h += "</div></section>";
  return h;
}

/* ---------- ③ 唤醒话术库 ---------- */
function libHtml(s) {
  var batch = s.sleep[0].goal;
  var h = '<section class="rise" id="wakeLib"><div class="sec-head"><h2><span class="bar"></span>唤醒话术库</h2><p>AI 按 档位 + 沉睡原因 + 历史项目 现写，不是模板群发</p></div>';
  var defs = [
    { k: "m1", t: SCRIPTS.m1, ch: TIER.m1.chan },
    { k: "m2", t: SCRIPTS.m2, ch: TIER.m2.chan },
    { k: "m3", t: SCRIPTS.m3, ch: TIER.m3.chan }
  ];
  defs.forEach(function (d, i) {
    var m = TIER[d.k];
    h += '<div class="sc-card ' + d.k + '" style="margin-top:' + (i ? "10px" : "0") + '">';
    h += '  <div class="sc-head"><span class="sc-badge">' + d.k.toUpperCase() + " · " + m.n + "</span><span class=\"sc-chan\">" + m.chan + "</span></div>";
    h += '  <div class="sc-txt">' + esc(d.t) + "</div>";
    h += '  <div class="sc-acts">';
    h += '    <button type="button" class="btn primary" data-copy="' + d.k + '">📋 复制</button>';
    h += '    <button type="button" class="btn" data-mock="已换一版话术（演示）">🔄 换一版</button>';
    h += "  </div></div>";
  });
  h += '<button type="button" class="wake-cta" data-batch>⚡ 一键批量发送 ' + batch + " 人（M1 待发名单）</button>";
  h += '<div style="font-size:10.5px;color:var(--t3);margin-top:9px;line-height:1.6">口径：M1 = 30-60 天未到店，M2 = 61-90 天，M3 = 90 天以上。批量发送走企微通道，每人间隔 3 分钟，避开 22:00-08:00。</div>';
  h += "</section>";
  return h;
}

/* ---------- ③+ 沉睡客户名单 + 详细话术面板 ---------- */
function listHtml() {
  var h = '<section class="span2 rise" id="wakeList"><div class="sec-head"><h2><span class="bar"></span>沉睡客户名单</h2><p>按「历史消费」排序 —— 先叫值钱的</p><span class="badge o" style="margin-left:auto">共 ' + WLIST.length + " 人 · Top" + WLIST.length + '</span></div>';
  h += '<div class="tbl-card"><table class="tbl wk-tbl"><thead><tr><th>客户</th><th class="ctr">档位</th><th class="ctr">沉睡</th><th class="ctr">历史消费</th><th>上次项目</th><th class="ctr">归属</th><th class="ctr">上次跟进</th><th>AI 判断原因</th><th class="ctr">建议渠道</th><th class="ctr">操作</th></tr></thead><tbody id="wkTbody">';
  WLIST.forEach(function (c, i) {
    h += '<tr data-row="' + i + '"' + (i === curIdx ? ' class="sel"' : "") + ">";
    h += '<td><b>' + esc(c.name) + '</b><span class="lv ' + c.lv + '">' + c.lv + "</span></td>";
    h += '<td class="ctr"><span class="tp ' + c.tier + '">' + c.tier.toUpperCase() + "</span></td>";
    h += '<td class="ctr">' + c.days + " 天</td>";
    h += '<td class="ctr">¥' + fmt(c.spent) + "</td>";
    h += "<td>" + esc(c.proj) + "</td>";
    h += '<td class="ctr">' + esc(c.staff) + "</td>";
    h += '<td class="ctr">' + esc(c.touch) + "</td>";
    h += '<td class="why-cell">' + esc(c.why) + "</td>";
    h += '<td class="ctr"><span class="badge o">' + esc(c.ch) + "</span></td>";
    h += '<td class="ctr"><button type="button" class="btn primary" style="min-height:30px;padding:5px 11px;font-size:11.5px" data-gen="' + i + '">生成话术</button></td></tr>';
  });
  h += "</tbody></table>";
  h += '<div style="font-size:10.5px;color:var(--t3);padding:9px 4px 2px;line-height:1.6">📍 名单为原型示例数据 · 按历史消费降序 · 点「生成话术」展开下方 AI 话术面板，可切换企微 / 微信 / 电话 / 短信四种渠道</div>';
  h += "</div></section>";
  return h;
}
function panelHtml() {
  var h = '<section class="span2" id="spWrap"><div class="sp-panel' + (curIdx >= 0 ? " open" : "") + '" id="spPanel">';
  if (curIdx >= 0) {
    var c = WLIST[curIdx];
    var kinds = ["企微", "微信", "电话", "短信"];
    h += '<div class="sp-head"><b>🤖 ' + esc(c.name) + " 的唤醒话术</b>";
    h += '<span class="tp ' + c.tier + '">' + c.tier.toUpperCase() + " · " + c.days + ' 天没来</span><span class="sp-tabs">';
    kinds.forEach(function (k) {
      h += '<button type="button" class="sp-tab' + (k === curKind ? " on" : "") + '" data-kind="' + k + '">' + k + "</button>";
    });
    h += "</span></div>";
    h += '<div class="sp-body" id="spBody">' + esc(genScript(c, curKind)) + "</div>";
    h += '<div class="sp-why"><b>为什么这么写：</b>' + esc(c.why) + "，所以" +
      (c.tier === "m3" ? "<b>不谈项目、只谈身体</b>，先把关系接上。" : (c.tier === "m2" ? "<b>给一个具体回来的理由</b>，不能空喊。" : "<b>直接约档期</b>，别寒暄太久。")) +
      "建议走 <b>" + esc(CH_LABEL[c.ch] || c.ch) + "</b>；发完隔一天没回，再补一句软的。</div>";
    h += '<div class="sp-acts">';
    h += '<button type="button" class="btn primary" data-mock="📤 已推送给 ' + esc(c.staff) + " 跟进（演示）\">📤 发给 " + esc(c.staff) + " 跟进</button>";
    h += '<button type="button" class="btn" data-sp-copy>📋 复制话术</button>';
    h += '<button type="button" class="btn" data-mock="已换一版话术（演示）">🔄 换一版</button>';
    h += '<button type="button" class="btn ghost" data-mock="✅ 已标记为已联系（演示）">✅ 标记已联系</button>';
    h += "</div>";
  } else {
    h += '<div style="font-size:12.5px;color:var(--t3);text-align:center;padding:6px 0">👆 点名单里的「生成话术」，AI 按 档位 + 沉睡原因 + 历史项目 + 归属人 现写一版</div>';
  }
  h += "</div></section>";
  return h;
}
function selectCustomer(i) {
  curIdx = i;
  curKind = WLIST[i].ch || "企微";
  $$("#wkTbody tr").forEach(function (tr) {
    tr.classList.toggle("sel", +tr.getAttribute("data-row") === i);
  });
  var wrap = $("#spWrap");
  if (wrap) wrap.outerHTML = panelHtml();
  var p = $("#spPanel");
  if (p && p.scrollIntoView) p.scrollIntoView({ behavior: "smooth", block: "center" });
}
function switchKind(k) {
  curKind = k;
  $$(".sp-tab").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-kind") === k); });
  var body = $("#spBody");
  if (body && curIdx >= 0) body.textContent = genScript(WLIST[curIdx], k);
}

/* ---------- ⑤+ 执行提醒（不分配 = 没人干） ---------- */
function remindHtml(s) {
  var goal = sleepGoal(s), staff = s.staff || 8;
  var h = '<section class="span2 rise"><div class="sec-head"><h2><span class="bar"></span>执行提醒</h2><p>不分配 = 没人干 · 点任意一条直接执行</p><button type="button" class="btn ghost" style="min-height:30px;padding:5px 12px;font-size:11.5px;margin-left:auto" data-remind="👥 已按历史消费把名单分配给各顾问（演示）">一键分配名单</button></div>';
  h += '<div class="card">';
  h += '<div class="act-item" data-remind="📞 已把今天 8 个 M1 电话名单推给归属顾问（演示）"><span class="a-n">1</span><div class="a-b"><div class="a-t">今天先打 8 个电话（M1 优先）</div><div class="a-d">M1 才走 1-2 个月，<b>一个电话能回来一半</b>。别用群发，名单已经按历史消费排好，从第一个开始打。</div></div></div>';
  h += '<div class="act-item" data-remind="🔔 已把 M3 移出本月业绩目标，改为破冰率考核（演示）"><span class="a-n">2</span><div class="a-b"><div class="a-t">把 M3 从本月目标里摘出来</div><div class="a-d">90 天以上的人靠话术拉不动，硬算进 KPI 只会逼美容师群发骚扰。改成「破冰率」考核：<b>回一句就算成功</b>。</div></div></div>';
  h += '<div class="act-item" data-remind="✅ 已按「每人每天 5 个」下发唤醒名额（演示）"><span class="a-n">3</span><div class="a-b"><div class="a-t">每个美容师每天 5 个名额</div><div class="a-d">' + goal + " 个目标分给 " + staff + " 个人，<b>每人每天 5 个、20 天干完</b>。做完在群里报数，别等到月底。</div></div></div>";
  h += "</div></section>";
  return h;
}

/* ---------- ④ 唤醒效果漏斗 ---------- */
function funnelHtml(s) {
  var f0 = s.targets.wake[0];
  var rows = [
    { l: "应唤", n: f0, sub: "本月目标", w: 100, c: "" },
    { l: "触达", n: Math.round(f0 * 0.8), sub: "80%", w: 80, c: "background:linear-gradient(90deg,#FFB37E,#FF9A4D)" },
    { l: "回复", n: Math.round(f0 * 0.37), sub: "37%", w: 37, c: "background:linear-gradient(90deg,#F2B23C,#E8930C)" },
    { l: "到店", n: Math.round(f0 * 0.13), sub: "13%", w: 13, c: "background:linear-gradient(90deg,#4ED08E,#0FA968)" },
    { l: "消费", n: Math.max(1, Math.round(f0 * 0.13 * 0.34)), sub: "到店的 34%", w: 5, c: "background:linear-gradient(90deg,#57C79A,#0A7F4E)" },
    { l: "办卡", n: Math.max(1, Math.round(f0 * 0.13 * 0.11)), sub: "到店的 11%", w: 2, c: "background:linear-gradient(90deg,#2AAE7C,#07603C)" }
  ];
  var h = '<section class="rise"><div class="sec-head"><h2><span class="bar"></span>本月唤醒漏斗</h2><p>叫回来 ≠ 赚到钱 · 看完整条链</p></div>';
  h += '<div class="card">';
  rows.forEach(function (r) {
    h += '<div class="fn-row"><span class="fn-lb">' + r.l + "</span>";
    h += '  <div class="pbar"><i class="pfill" data-w="' + r.w + '"' + (r.c ? ' style="' + r.c + '"' : "") + "></i></div>";
    h += '  <span class="fn-num">' + r.n + "<small>" + r.sub + "</small></span></div>";
  });
  h += '  <div class="fn-note">📉 <b>「触达 → 到店」掉得最狠</b>：说明话术或钩子有问题，先改这里。产生消费 = 到店后有买单；办卡 / 升单 = 当场办卡或升单。M3 别硬算进业绩，改成「破冰率」考核：回一句就算成功。</div>';
  h += "</div></section>";
  return h;
}

/* ---------- ⑤ 回驾驶舱 ---------- */
function backHtml() {
  var h = '<section class="span2 rise" style="display:flex;gap:10px;flex-wrap:wrap">';
  h += '<a class="btn ghost" style="flex:1;min-width:200px" href="home.html">🏠 回到经营驾驶舱</a>';
  h += '<a class="btn" style="flex:1;min-width:200px" href="moments.html">💬 去私域营销发圈</a>';
  h += "</section>";
  return h;
}

/* ---------- 渲染 ---------- */
function render() {
  var s = LQ.store();
  var app = $("#app");
  if (!app) return;
  app.innerHTML =
    aiHtml(s).html + tierHtml(s) + listHtml() + panelHtml() + libHtml(s) + funnelHtml(s) + remindHtml(s) + backHtml();
  playAi(s);
}

/* ---------- 复制 / 演示动作 ---------- */
function copyTxt(key) {
  var t = SCRIPTS[key] || "";
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () {}, function () {});
    }
  } catch (e) {}
  LQ.toast("话术已复制，可粘贴到企微 / 微信");
}

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-copy]");
  if (el) { copyTxt(el.getAttribute("data-copy")); return; }
  el = e.target.closest("[data-gen]");
  if (el) { selectCustomer(+el.getAttribute("data-gen")); return; }
  el = e.target.closest("[data-kind]");
  if (el) { switchKind(el.getAttribute("data-kind")); return; }
  el = e.target.closest("[data-sp-copy]");
  if (el) {
    var body = $("#spBody");
    var t = body ? body.textContent : "";
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(function () {}, function () {});
      }
    } catch (err) {}
    LQ.toast("话术已复制，可粘贴到企微 / 微信");
    return;
  }
  el = e.target.closest("[data-remind]");
  if (el) { LQ.toast(el.getAttribute("data-remind")); return; }
  el = e.target.closest("[data-batch]");
  if (el) { LQ.toast("已进入批量发送队列（演示）"); return; }
  el = e.target.closest("[data-mock]");
  if (el) { LQ.toast(el.getAttribute("data-mock")); return; }
});

render();
LQ.init({ nav: "home", title: "沉睡唤醒引擎" });
})();
</script>
