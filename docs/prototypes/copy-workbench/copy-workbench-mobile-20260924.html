<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1f1a">
<title>金牌文案主笔 · 创作工作台 · 思潼AI商城</title>
<style>
/* ===================== 基础重置 ===================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f0f2f5; --card:#fff; --text:#1c2733; --sub:#8496a8; --line:#e3e9f2;
  --dark:#0d1f1a; --dark2:#14302a; --dark-fg:#e8f1ec;
  --orange:#e8651a; --orange-soft:#fdeee2; --blue:#2563eb; --blue-soft:#e8effd;
  --purple:#7c3aed; --purple-soft:#f3e8ff; --green:#16a34a; --green-soft:#dcfce7;
  --amber:#d97706; --amber-soft:#fef3c7; --red:#ef4444;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --tab-h:56px; --input-h:56px;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}

/* ===================== App 容器（手机优先） ===================== */
.app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}

/* ===================== 顶栏 ===================== */
.topbar{background:var(--dark);color:var(--dark-fg);padding:calc(var(--safe-t) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:10}
.topbar .logo{font-size:15px;font-weight:800;letter-spacing:-.5px}
.topbar .logo i{font-style:normal;color:var(--orange)}
.topbar .spacer{flex:1}
.topbar .credit{font-size:12px;color:#9ab2a5;background:rgba(255,255,255,.1);padding:3px 10px;border-radius:99px;white-space:nowrap}
.topbar .abtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:var(--dark-fg);border-radius:8px;font-size:12px;font-weight:700;padding:5px 10px;cursor:pointer;font-family:inherit;white-space:nowrap}
.topbar .abtn:active{background:rgba(255,255,255,.2)}
.topbar .abtn.demo{background:rgba(232,101,26,.2);border-color:rgba(232,101,26,.5);color:#ffd9bd}
.topbar .abtn.demo.on{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}

/* ===================== 智能体头 ===================== */
.agent-head{background:var(--dark2);padding:0 14px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.agent-head img{width:42px;height:42px;border-radius:12px;object-fit:cover;flex-shrink:0}
.agent-head .info h1{font-size:15px;color:var(--dark-fg);font-weight:700;display:flex;align-items:center;gap:5px}
.agent-head .info h1 .on{font-size:9px;color:#4ade80}
.agent-head .info p{font-size:11px;color:#9ab2a5;margin-top:1px}
.agent-head .tags{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.agent-head .tag{font-size:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:1px 7px;color:#c4d4cb}
.agent-head .depth-sel{margin-left:auto;display:flex;gap:4px;flex-shrink:0}
.agent-head .depth-sel button{font-size:10px;font-weight:700;border:none;border-radius:7px;padding:5px 8px;cursor:pointer;font-family:inherit;white-space:nowrap}
.agent-head .depth-sel .act{background:var(--orange);color:#fff}
.agent-head .depth-sel button:not(.act){background:rgba(255,255,255,.08);color:#9ab2a5}

/* ===================== 主内容区（三个 tab 面板） ===================== */
.main{flex:1;min-height:0;position:relative;overflow:hidden}
.panel{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column}
.panel.show{display:flex}

/* ===================== 对话面板 ===================== */
#panel-chat{padding:12px 12px 8px}
#panel-chat .chat-log{flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{display:flex;gap:7px;align-items:flex-start;animation:slideUp .3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg .m-av{width:30px;height:30px;border-radius:8px;flex-shrink:0;overflow:hidden}
.msg .m-av img{width:100%;height:100%;object-fit:cover}
.msg .bub{background:var(--card);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:13.5px;line-height:1.7;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.04);max-width:calc(100% - 42px);word-break:break-word}
.msg.user{flex-direction:row-reverse}
.msg.user .bub{background:#95ec69;border-radius:14px 4px 14px 14px}
.msg .bub b{color:var(--dark)}
.msg .bub .dim{color:var(--sub);font-size:12px}
.msg .bub .warn{display:block;color:var(--red);background:#fdeaea;padding:4px 8px;border-radius:5px;font-size:12px;margin-top:4px}
.msg .bub .todo-mark{color:#b26a00;background:#fff4e0;font-size:11px;font-weight:700;padding:1px 5px;border-radius:3px}

/* 简报浮动按钮（对话面板上） */
.brief-fab{position:absolute;bottom:8px;right:12px;background:var(--dark);color:var(--dark-fg);border:none;border-radius:99px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;box-shadow:0 2px 10px rgba(0,0,0,.2);z-index:5;transition:all .2s}
.brief-fab:active{transform:scale(.95)}
.brief-fab .dot{width:18px;height:18px;border-radius:99px;background:var(--orange);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.brief-fab.ready .dot{background:var(--green)}

/* ===================== 简报面板 ===================== */
#panel-brief{padding:12px}
.brief-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.brief-header h2{font-size:16px;font-weight:800}
.brief-header .cmpl{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;margin-left:auto}
.cmpl.full{background:var(--green-soft);color:var(--green)}
.cmpl.standard{background:var(--blue-soft);color:var(--blue)}
.cmpl.generic{background:var(--amber-soft);color:var(--amber)}
.cmpl.blocked{background:#fdeaea;color:var(--red)}
.brief-grid{display:flex;flex-direction:column;gap:8px}
.bf{background:var(--card);border-radius:12px;padding:10px 12px;border:1.5px solid var(--line);transition:all .25s}
.bf.filled{border-color:var(--green);background:linear-gradient(135deg,#fff,#f0fdf4)}
.bf .k{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px;margin-bottom:3px}
.bf .k .req{color:var(--orange);font-size:10px}
.bf .k .opt-tag{font-size:9px;background:var(--bg);padding:1px 5px;border-radius:99px;color:var(--sub)}
.bf .v{font-size:13px;line-height:1.5;color:var(--text);word-break:break-word}
.bf:not(.filled) .v{color:#c2cbd6}
.brief-segs{display:flex;gap:4px;margin:14px 0}
.brief-segs .seg{flex:1;height:5px;border-radius:99px;background:var(--line);transition:background .3s}
.brief-segs .seg.on{background:var(--green)}
.brief-pct{text-align:center;font-size:12px;color:var(--sub);margin-bottom:14px}
.brief-cta{text-align:center;padding:8px 0 4px}
.brief-cta button{font-size:14px;font-weight:800;border:none;border-radius:12px;padding:13px 32px;cursor:pointer;font-family:inherit;background:var(--orange);color:#fff;width:100%;box-shadow:0 3px 12px rgba(232,101,26,.3)}
.brief-cta button:disabled{background:#ccc;box-shadow:none;cursor:not-allowed}
.brief-cta .hint{font-size:11px;color:var(--sub);margin-top:6px}

/* ===================== 交付面板 ===================== */
#panel-deliver{padding:12px}
#panel-deliver.locked{display:flex;align-items:center;justify-content:center;text-align:center}
.lock-msg{color:var(--sub);font-size:13px;line-height:1.8}
.lock-msg .big{font-size:36px;display:block;margin-bottom:8px}
.gen-wrap{display:none}
.gen-log{background:var(--dark);border-radius:12px;padding:12px;font-family:"SF Mono",Consolas,monospace;font-size:11px;line-height:1.8;max-height:200px;overflow-y:auto;margin-bottom:12px}
.gen-log .ln{color:#6b8a7a;opacity:0;transform:translateX(-4px)}
.gen-log .ln.in{opacity:1;transform:translateX(0);transition:all .3s}
.gen-log .ln.ok{color:#4ade80}
.gen-log .ln.hl{color:#fbbf24}
.ph-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.ph{background:var(--card);border-radius:10px;padding:10px 8px;text-align:center;font-size:11px;color:var(--sub);border:1.5px solid var(--line);transition:all .3s}
.ph.gening{border-color:var(--orange);color:var(--orange);background:var(--orange-soft)}
.ph.done{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.ph .spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:99px;animation:spin .6s linear infinite;vertical-align:middle;margin-right:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.dl-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.dl-head .ok-tag{font-size:12px;font-weight:800;color:var(--green);background:var(--green-soft);padding:3px 10px;border-radius:99px}
.dl-head .time{font-size:11px;color:var(--sub)}
.dl-head .ops{margin-left:auto;display:flex;gap:6px}
.cbtn{font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.cbtn:active{background:var(--bg)}
.cbtn.word{background:var(--green);border-color:var(--green);color:#fff}
.cbtn.word:active{background:#15803d}
.dl-tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.dl-tabs::-webkit-scrollbar{display:none}
.dl-tabs .tab{font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.dl-tabs .tab.act{border-color:var(--orange);color:var(--orange);background:var(--orange-soft)}
.pieces{display:flex;flex-direction:column;gap:10px}
.pc{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.pc .h{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pc .h .no{width:24px;height:24px;border-radius:6px;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pc .h b{font-size:13px;font-weight:700}
.pc .h .g-tag{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:600}
.pc .h .btns{margin-left:auto;display:flex;gap:4px}
.pc .h .btns .cbtn{padding:5px 8px;font-size:11px}
.pc .c{padding:10px 12px;font-size:12.5px;line-height:1.7}
.pc .c table{width:100%;border-collapse:collapse;margin:4px 0}
.pc .c th{background:#f4f7fb;border:1px solid #d9e2ec;padding:4px 6px;text-align:left;font-size:11px;font-weight:700}
.pc .c td{border:1px solid #d9e2ec;padding:4px 6px;font-size:11px;vertical-align:top}
.pc .c h4{font-size:12px;margin:6px 0 3px;color:var(--dark)}
.pc .c ul{padding-left:16px;margin:4px 0}
.pc .c li{margin:2px 0}
.pc .c .seg-line{margin:5px 0}
.pc .c .tm{background:var(--orange-soft);color:var(--orange);font-weight:700;font-size:10px;padding:1px 5px;border-radius:3px}
.pc .c .act-tag{color:#b26a00;background:#fff4e0;font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px}
.pc .c .broll{color:var(--blue);background:var(--blue-soft);font-size:10px;padding:1px 5px;border-radius:3px}
.pc .c .topic-chip{display:inline-block;color:var(--blue);background:var(--blue-soft);border-radius:99px;padding:1px 8px;font-size:11px;margin:2px 3px 0 0;font-weight:600}
.pc .c .warn{display:block;color:var(--red);background:#fdeaea;padding:5px 8px;border-radius:5px;font-size:11px;margin-top:4px}
.pc .c .todo-mark{color:#b26a00;background:#fff4e0;font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px}

/* ===================== 输入栏 ===================== */
.input-bar{display:none;align-items:flex-end;gap:6px;padding:6px 10px calc(var(--safe-b) + 6px);background:var(--card);border-top:1px solid var(--line);flex-shrink:0}
.input-bar.show{display:flex}
.input-bar .mic{width:38px;height:38px;border:none;border-radius:50%;background:var(--bg);font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.input-bar .mic.rec{background:var(--red);color:#fff;animation:micpulse 1s infinite}
@keyframes micpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.input-bar input{flex:1;border:1.5px solid var(--line);border-radius:20px;padding:9px 14px;font-size:14px;font-family:inherit;outline:none;min-width:0;max-height:80px}
.input-bar input:focus{border-color:var(--orange)}
.input-bar .send{width:38px;height:38px;border:none;border-radius:50%;background:var(--orange);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.input-bar .send:active{transform:scale(.9)}
.input-bar .send:disabled{background:#ccc}

/* ===================== 底部 Tab 栏 ===================== */
.tabbar{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b);flex-shrink:0}
.tabbar .tab{flex:1;border:none;background:none;font-family:inherit;font-size:10px;color:var(--sub);padding:7px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabbar .tab .icon{font-size:20px;line-height:1}
.tabbar .tab.act{color:var(--orange)}
.tabbar .tab .badge{position:absolute;top:3px;right:calc(50% - 20px);background:var(--red);color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
.tabbar .tab .badge.done{background:var(--green)}

/* ===================== Toast ===================== */
#toast{position:fixed;bottom:calc(var(--tab-h) + var(--safe-b) + 60px);left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.78);color:#fff;padding:8px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===================== 桌面端适配 ===================== */
@media (min-width:600px){
  body{background:linear-gradient(135deg,#0d1f1a,#14302a)}
  .app{margin:16px auto;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);height:calc(100dvh - 32px);min-height:600px;max-height:900px}
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 顶栏 -->
  <div class="topbar">
    <div class="logo">思潼<i>AI</i>商城</div>
    <div class="spacer"></div>
    <span class="credit" id="creditHint">完整 · 按件计费</span>
    <button class="abtn demo" id="btnDemo">▶ 演示</button>
    <button class="abtn" id="btnReset">↻</button>
  </div>

  <!-- 智能体头 -->
  <div class="agent-head">
    <img id="agentAv" alt="头像">
    <div class="info">
      <h1>金牌文案主笔 <span class="on">●</span></h1>
      <p>你把卖点给我，我给你一条多平台适配、带钩子的可直发文案。</p>
      <div class="tags">
        <span class="tag">访谈引导·7问</span><span class="tag">🎤语音</span><span class="tag">十件套</span><span class="tag">⬇Word</span>
      </div>
    </div>
    <div class="depth-sel">
      <button id="depthFull" class="act">完整</button>
      <button id="depthLight">轻量</button>
    </div>
  </div>

  <!-- 主内容区 -->
  <div class="main">
    <!-- 对话面板 -->
    <div class="panel show" id="panel-chat">
      <div class="chat-log" id="chatLog"></div>
      <button class="brief-fab" id="briefFab" style="display:none">
        📋 简报 <span class="dot" id="fabDot">0</span>
      </button>
    </div>

    <!-- 简报面板 -->
    <div class="panel" id="panel-brief">
      <div class="brief-header">
        <h2>创作简报</h2>
        <span class="cmpl blocked" id="cmplBadge">完整度：缺必填 · 暂不能出稿</span>
      </div>
      <div class="brief-grid" id="briefGrid"></div>
      <div class="brief-segs" id="segs"></div>
      <div class="brief-pct" id="briefPct">必填 0/4</div>
      <div class="brief-cta" id="briefCta">
        <button id="btnGen" disabled>✨ 开始创作</button>
        <div class="hint" id="genHint">回答完智能体的问题后点亮</div>
      </div>
    </div>

    <!-- 交付面板 -->
    <div class="panel locked" id="panel-deliver">
      <div class="lock-msg" id="lockMsg">
        <span class="big">📦</span>
        交付区将在创作完成后解锁<br>先回到对话 tab 跟智能体聊聊吧
      </div>
      <div class="gen-wrap" id="genWrap">
        <div class="gen-log" id="genLog"></div>
        <div class="ph-grid" id="phGrid"></div>
      </div>
      <div id="dlWrap" style="display:none"></div>
    </div>
  </div>

  <!-- 输入栏 -->
  <div class="input-bar show" id="inputBar">
    <button class="mic" id="btnMic">🎤</button>
    <input type="text" id="freeInput" placeholder="打字回答，或点🎤语音说" autocomplete="off" enterkeyhint="send">
    <button class="send" id="freeSend">➤</button>
  </div>

  <!-- 底部 Tab 栏 -->
  <div class="tabbar" id="tabbar">
    <button class="tab act" data-tab="chat"><span class="icon">💬</span>对话</button>
    <button class="tab" data-tab="brief"><span class="icon">📋</span>简报<span class="badge" id="briefBadge" style="display:none">0</span></button>
    <button class="tab" data-tab="deliver"><span class="icon">📦</span>交付<span class="badge" id="deliverBadge" style="display:none">!</span></button>
  </div>

</div>

<div id="toast"></div>

   plain:'可直发文案\n标题：12家直营店跑出来的单店模型：8个月回本、月流水30万+\n正文：想加盟的先别急着交钱——把这三个数看完，再决定。很多老板想加盟又怕被割韭菜：怕总部画饼、怕回本遥遥无期、怕交了钱没人管。我们不背招商话术，直接看数据：第一家直营店8个月回本；现在12家直营店，单店月流水30万往上。招商视频做三件事：亮真实经营数据不画饼、讲清总部扶持什么、给一个马上能做的动作。评论区留言「方案」，发你一份《开店考察清单》。\n话题：#餐饮加盟 #招商 #实体店老板\n红线自检：无收益承诺、无极限词、无违规引导词'};

/* ===================== 参考答法 ===================== */
const SAMPLES = {
  q1_who:'我本人出镜，做全国招商加盟，餐饮，12家直营店',
  q2_goal:'主要想招商留资，顺便立信任',
  q3_audience:'想加盟的老板，30-45岁，怕不懂获客、怕被割韭菜',
  q4_material:'第一家直营店 8 个月回本，现在 12 家直营店、单店月流水 30 万+，老加盟商续约率 90%',
  q5_redline:'不能承诺收益，不能用极限词，品牌写XX',
  q6_region:'全国招商，重点山东河南',
  q7_budget:'每月5000左右测试',
};

/* ===================== 关键词提取 ===================== */
const FIELD_RULES = [
  {k:'q6_region', re:/全国|山东|河南|地域|几个城市|暂不投|只投|投哪/},
  {k:'q7_budget', re:/预算|每月|每个月|5000|2000|投流钱/},
  {k:'q5_redline', re:/不能说|红线|极限词|承诺|别说|品牌写/},
  {k:'q2_goal', re:/招商留资|招加盟|立信任|成交|咨询|涨粉|留资|带货/},
  {k:'q3_audience', re:/说给|人群|岁|宝妈|创业者|想加盟|怕不懂|怕被/},
  {k:'q1_who', re:/出镜|招商加盟|本地门店|直营|连锁|餐饮|美业|行业/},
  {k:'q4_material', re:/案例|故事|观点|方法|转化|回本|流水|续约/},
];

/* ===================== 状态机 ===================== */
let S = {phase:'idle', qi:0, brief:{}, depth:'full', auto:false, timer:null, materialWeak:false, mode:'guided', push:{}};
let genIdx=0;
const $ = id => document.getElementById(id);
const REQ = ['q1_who','q2_goal','q3_audience','q4_material'];
let curTab='chat';

/* ===================== Tab 切换 ===================== */
function switchTab(tab){
  curTab=tab;
  $('panel-'+tab).classList.add('show');
  ['chat','brief','deliver'].forEach(t=>{ if(t!==tab) $('panel-'+t).classList.remove('show'); });
  $('tabbar').querySelectorAll('.tab').forEach(t=>t.classList.toggle('act', t.dataset.tab===tab));
  /* 输入栏只在对话 tab 且非 gen/done 阶段显示 */
  const showInput = (tab==='chat' && ['greet','ask','fallback','confirm','idle'].includes(S.phase));
  $('inputBar').classList.toggle('show', showInput);
  /* 简报 FAB 只在对话 tab 显示 */
  $('briefFab').style.display = (tab==='chat' && S.phase!=='idle' && S.phase!=='gen') ? 'flex' : 'none';
}
$('tabbar').querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));

/* ===================== 简报渲染 ===================== */
function completeness(){
  const missing = REQ.filter(k=>!S.brief[k]);
  if(missing.some(k=>k!=='q4_material')) return {level:'blocked', missing};
  if(!S.brief.q4_material) return {level:'generic', missing};
  if(!S.brief.q5_redline && !S.brief.q6_region && !S.brief.q7_budget) return {level:'standard', missing};
  return {level:'full', missing};
}
function renderBrief(){
  const g=$('briefGrid'); g.innerHTML='';
  FIELDS.forEach(f=>{
    const v = f.key==='depth' ? (S.depth==='full'?'完整内容十件套（按件计费）':'轻量 · 1 条可直发文案（40 积分）') : S.brief[f.key];
    const d=document.createElement('div');
    d.className='bf'+(v?' filled':'');
    const tag = f.req ? '<span class="req">★</span>' : (f.tag?`<span class="opt-tag">${f.tag}</span>`:'');
    d.innerHTML=`<div class="k">${f.icon} ${f.label} ${tag}</div><div class="v">${v||'——'}</div>`;
    g.appendChild(d);
  });
  const n4 = REQ.filter(k=>S.brief[k]).length;
  const nAll = Object.keys(S.brief).filter(k=>S.brief[k]).length;
  $('briefPct').textContent = '必填 '+n4+'/4 · 共 '+nAll+'/7';
  const segs=$('segs');
  [...segs.children].forEach((s,i)=>s.classList.toggle('on', i<n4));
  const c=completeness(); const badge=$('cmplBadge');
  badge.className='cmpl '+c.level;
  badge.textContent = {full:'完整度：full · 可直拍可投流', standard:'完整度：standard · 投流按常规补', generic:'完整度：generic · 偏通用模板', blocked:'完整度：缺必填 · 暂不能出稿'}[c.level];
  $('btnGen').disabled = !(S.phase==='confirm');
  $('genHint').textContent = S.phase==='confirm' ? '点击开始生成' : (S.phase==='gen' ? '生成中…' : S.phase==='done' ? '已生成，去交付 tab 查看' : '回答完智能体的问题后点亮');
  /* FAB 更新 */
  $('fabDot').textContent = nAll;
  $('briefFab').classList.toggle('ready', S.phase==='confirm');
  $('briefBadge').style.display = nAll>0 ? 'flex' : 'none';
  $('briefBadge').textContent = nAll;
  $('briefBadge').classList.toggle('done', S.phase==='done');
  $('deliverBadge').style.display = S.phase==='done' ? 'flex' : 'none';
  $('deliverBadge').classList.toggle('done', S.phase==='done');
}
(function(){const s=$('segs'); for(let i=0;i<4;i++){const d=document.createElement('div');d.className='seg';s.appendChild(d);}})();

/* ===================== 消息 ===================== */
function addMsg(html, who){
  const d=document.createElement('div'); d.className='msg'+(who==='user'?' user':'');
  d.innerHTML = who==='user' ? `<div class="bub">${html}</div>` : `<div class="m-av"><img src="${AV}" alt=""></div><div class="bub">${html}</div>`;
  $('chatLog').appendChild(d);
  const p=$('panel-chat'); p.scrollTop=p.scrollHeight;
}
function fieldLabel(k){ return (FIELDS.find(f=>f.key===k)||{}).label||k; }
function setField(k,v){ S.brief[k]=v; renderBrief(); }

/* ===================== 占位卡片 ===================== */
function pieceList(){ return S.depth==='full' ? PIECES : [LIGHT_PIECE]; }
function renderPH(state){
  const list=pieceList();
  $('phGrid').innerHTML = list.map((p,i)=>{
    const cls = state==='gen' ? (i<=S.genIdx?'gening':'') : '';
    const spin = state==='gen'&&i<=S.genIdx ? '<span class="spin"></span>' : '';
    const mark = state==='gen' ? (i<=S.genIdx?'✓':'') : (state==='done'?'✓':'');
    return `<div class="ph ${cls}">${spin}${p.no} ${p.title}`;
  }).join('');
}

/* ===================== 逐题提问 ===================== */
function askQ(){
  while(S.qi<QFLOW.length && S.brief[QFLOW[S.qi].field]) S.qi++;
  if(S.qi>=QFLOW.length){ toConfirm(); return; }
  const q=QFLOW[S.qi]; S.phase='ask'; S.cur=q;
  $('freeInput').placeholder='打字回答，如：'+SAMPLES[q.field];
  addMsg(`${q.q}<br><span class="dim">💬 参考答法：${SAMPLES[q.field]}（打字说你的情况就行）</span>`);
  switchTab('chat');
}

/* ===================== 处理回答 ===================== */
function handleAnswer(text){
  const q=S.cur; S.push=S.push||{};
  if(S.phase==='fallback'){
    if(/观点/.test(text)){ S.materialWeak=true; setField('q4_material','（无具体素材）走观点路线：'+text.replace(/^.*?观点[:：,，\s]*/,'')); addMsg('行，那我把观点讲透，稿子里会标注<span class="todo-mark">素材待补</span>。'); }
    else if(/方法|教/.test(text)){ S.materialWeak=true; setField('q4_material','（无具体素材）走方法路线：'+text.replace(/^.*?方法[:：,，\s]*/,'')); addMsg('行，那我把方法讲透，稿子里会标注<span class="todo-mark">素材待补</span>。'); }
    else if(text.length>=10){ S.materialWeak=false; setField('q4_material',text); addMsg('这不就是素材嘛！记下了。<b>这个料很实，够了。</b>'); }
    else { S.materialWeak=true; setField('q4_material','（无素材，按通用模板 · 素材待补）'); addMsg('行，先按通用模板走，稿子里标注<span class="todo-mark">素材待补</span>。'); }
    S.phase='ask'; S.qi++; S.timer=setTimeout(askQ,450); return;
  }
  if(q.field==='q4_material' && /没有|想不出|不知道|没素材|没啥|没什么/.test(text) && text.length<12){
    S.push[q.field]=2;
    addMsg('没关系。那换个角度——这条视频你想<b>讲个观点</b>，还是<b>教观众一个方法</b>？直接打字告诉我。');
    S.phase='fallback'; $('freeInput').placeholder='打字告诉我，如：讲观点';
    return;
  }
  if(q.field==='q5_redline' && /^(没有|没|无|木有)/.test(text.trim())){
    setField('q5_redline','通用红线（默认兜底）：不承诺收益 · 不用极限词 · 评论区禁"私信/加微信"');
    addMsg('那行，按<b>通用红线</b>来——不承诺收益、不用极限词、评论区不出现引导词。');
    S.qi++; S.timer=setTimeout(askQ,450); return;
  }
  if(/^跳过$|^这题跳过$|^不想说$/.test(text.trim())){
    addMsg('行，这题先跳过'+(q.optional?'':'，回头想到随时补')+'，继续下一题。');
    S.qi++; S.timer=setTimeout(askQ,450); return;
  }
  const need=['q1_who','q2_goal','q3_audience','q4_material'];
  if(need.includes(q.field) && text.length<6 && (S.push[q.field]||0)<2){
    S.push[q.field]=(S.push[q.field]||0)+1;
    addMsg((S.push[q.field]>=2?'行，就按你说的来。':'能再具体点吗？')+'<span class="dim">比如：'+SAMPLES[q.field]+'</span>');
    if(S.push[q.field]>=2){ setField(q.field,text); S.qi++; S.timer=setTimeout(askQ,450); }
    return;
  }
  setField(q.field,text);
  if(q.fb && text.length>=6) addMsg(q.fb);
  const ahead=QFLOW.slice(S.qi+1).map(x=>x.field);
  const hits=[];
  FIELD_RULES.forEach(r=>{ if(ahead.includes(r.k) && !S.brief[r.k] && r.re.test(text)){ S.brief[r.k]=text; hits.push(fieldLabel(r.k)); } });
  if(hits.length){ renderBrief(); addMsg('我听出来了——你把<b>'+hits.join('、')+'</b>也一并说了，先记进简报。'); }
  S.qi++; S.timer=setTimeout(askQ,350);
}

/* ===================== CONFIRM ===================== */
function toConfirm(){
  const b=S.brief; const dfl=[];
  if(!b.q1_who){ dfl.push('出镜与生意'); setField('q1_who','本人出镜 · 全国招商加盟（默认兜底）'); }
  if(!b.q2_goal){ dfl.push('视频目标'); setField('q2_goal','直接带来咨询或成交（默认兜底）'); }
  if(!b.q3_audience){ dfl.push('目标人群'); setField('q3_audience','意向客户/加盟者（默认兜底）'); }
  if(!b.q4_material){ dfl.push('核心素材'); S.materialWeak=true; setField('q4_material','（无素材，按通用模板 · 素材待补）'); }
  if(!b.q5_redline) setField('q5_redline','通用红线（默认兜底）：不承诺收益 · 不用极限词 · 评论区禁"私信/加微信"');
  S.phase='confirm'; renderBrief();
  const dflNote=dfl.length?'<br><span class="dim">（'+dfl.join('、')+'你没细说，我按默认兜底补上了）</span>':'';
  addMsg('好，我复述一遍确认下：<b>'+b.q1_who+'；想'+b.q2_goal+'；说给'+b.q3_audience+'，素材讲'+b.q4_material+'；红线：'+(b.q5_redline||'默认通用红线')+'。</b>有没有要改的？'+dflNote+'<br>没问题就回复「<b>没问题</b>」，或去简报 tab 点「✨ 开始创作」。');
  toast('简报已填完，去简报 tab 点「开始创作」');
}
function generateMsg(){
  const c=completeness();
  addMsg('行，没问题。我现在按你的情况出一整套——稍等。<span class="dim">（completeness='+c.level+'）</span>');
  S.phase='gen'; S.genIdx=-1; renderBrief();
  switchTab('deliver');
  $('panel-deliver').classList.remove('locked');
  $('lockMsg').style.display='none';
  S.timer=setTimeout(runGen,700);
}

/* ===================== GENERATE ===================== */
function runGen(){
  const list=pieceList();
  renderPH('gen'); $('genWrap').style.display='block';
  const log=$('genLog'); log.innerHTML='';
  const c=completeness();
  const lines=[
    '→ 注入访谈结构化答案 mode='+S.mode+' · completeness='+c.level,
    '→ 读取创作简报与产品资料 …',
    '→ 加载内容十件套 skill（baolu-content-creator V5）',
    ...list.map(p=>`✓ ${p.no} ${p.title}`),
    '✓ 交付完成（演示：用时 6 分 12 秒）'
  ];
  let li=0;
  const step=()=>{
    if(S.phase!=='gen') return;
    if(li<lines.length){
      const d=document.createElement('div'); d.className='ln '+(lines[li].startsWith('✓')?'ok':(lines[li].startsWith('→')?'hl':''));
      d.textContent=lines[li]; log.appendChild(d);
      requestAnimationFrame(()=>d.classList.add('in'));
      log.scrollTop=log.scrollHeight;
      if(lines[li].startsWith('✓')){ S.genIdx++; renderPH('gen'); }
      li++; S.timer=setTimeout(step, list.length>3?600:850);
    } else { S.timer=setTimeout(finish,450); }
  };
  step();
}
function finish(){
  S.phase='done';
  $('genWrap').style.display='none'; $('phGrid').innerHTML='';
  renderDeliverables();
  addMsg('交付完成 ✅ 去「交付」tab 查看分区内容。每件可单独复制/重生成。');
  renderBrief();
  toast('交付完成 ✅ 点击「交付」tab 查看');
  $('deliverBadge').style.display='flex';
  $('deliverBadge').classList.add('done');
  $('deliverBadge').textContent='✓';
}

    <div class="pc" id="pc_${p.id}">
      <div class="h">

}
function findPiece(id){ return pieceList().find(p=>p.id===id); }
function copyPiece(id){ const p=findPiece(id); copyText(p.plain).then(()=>toast(`已复制「${p.title}」`)); }
function copyAll(){ copyText(pieceList().map(p=>p.plain).join('\n\n────────\n\n')).then(()=>toast('已复制全部')); }
function regenPiece(id){
  const p=findPiece(id); const card=$('pc_'+id); if(!card) return;
  card.style.opacity=.45; toast(`重生成「${p.title}」（演示）…`);
  setTimeout(()=>{ card.style.opacity=1; toast(`「${p.title}」已重新生成（演示）`); },1400);
}
function copyText(t){
  return new Promise(res=>{
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).finally(()=>res()); return; } }catch(e){}
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); res();
  });
}
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1900); }

/* ===================== 语音输入 ===================== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null, recOn=false;
$('btnMic').onclick=()=>{
  if(recOn){ stopRec(); return; }
  if(SR){
    try{
      recog=new SR(); recog.lang='zh-CN'; recog.interimResults=true; recog.continuous=false;
      recog.onresult=(e)=>{ let t=''; for(let i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript; $('freeInput').value=t; if(e.results[e.results.length-1].isFinal){ stopRec(); freeSend(); } };
      recog.onend=()=>{ recOn=false; $('btnMic').classList.remove('rec'); };
      recog.onerror=(ev)=>{ stopRec(); if(ev.error&&ev.error!=='aborted'&&ev.error!=='no-speech'){ toast('语音不可用，切演示模拟'); simulateVoice(); } };
      recOn=true; $('btnMic').classList.add('rec'); toast('🎤 正在听写，请说话…'); recog.start(); return;
    }catch(e){}
  }
  simulateVoice();
};
function stopRec(){ try{ recog&&recog.stop(); }catch(e){} recOn=false; $('btnMic').classList.remove('rec'); }
function simulateVoice(){
  recOn=true; $('btnMic').classList.add('rec'); toast('🎤 听写中（演示模拟）…');
  setTimeout(()=>{
    recOn=false; $('btnMic').classList.remove('rec');
    const q=S.cur;
    $('freeInput').value=(S.phase==='ask'&&q&&SAMPLES[q.field])||(S.phase==='greet'?'我本人出镜，做全国招商加盟，餐饮，12家直营店':'好的，没问题');
    toast('识别完成（演示模拟）'); setTimeout(freeSend,350);
  },1800);
}

/* ===================== 输入路由 ===================== */
$('freeSend').onclick=freeSend;
$('freeInput').addEventListener('keydown',e=>{ if(e.key==='Enter') freeSend(); });
function freeSend(){
  const v=$('freeInput').value.trim(); if(!v) return;
  $('freeInput').value='';
  addMsg(v,'user');
  if(/别问了|别问|直接写|不想答|懒得答/.test(v)&&['greet','ask','fallback','confirm'].includes(S.phase)){
    clearTimeout(S.timer);
    if(!S.brief.q1_who) setField('q1_who','本人出镜 · 全国招商加盟（默认）');
    if(!S.brief.q2_goal) setField('q2_goal','直接带来咨询或成交（默认）');
    if(!S.brief.q3_audience) setField('q3_audience','意向客户/加盟者（默认）');
    if(!S.brief.q4_material){ S.materialWeak=true; setField('q4_material','（无素材，按通用模板 · 素材待补）'); }
    if(!S.brief.q5_redline) setField('q5_redline','通用红线（默认兜底）：不承诺收益 · 不用极限词 · 评论区禁"私信/加微信"');
    if(!S.brief.q6_region) setField('q6_region','暂不投');
    if(!S.brief.q7_budget) setField('q7_budget','暂不投');
    S.mode='direct'; S.qi=QFLOW.length;
    addMsg('行，不问了。缺的按默认兜底，马上出稿。<span class="dim">（mode=direct）</span>');
    S.phase='gen'; renderBrief(); S.timer=setTimeout(()=>{ switchTab('deliver'); $('panel-deliver').classList.remove('locked'); $('lockMsg').style.display='none'; runGen(); },800);
    return;
  }
  if(S.phase==='greet'){
    const hit0=FIELD_RULES.find(r=>r.k==='q1_who'&&r.re.test(v));
    if(hit0&&v.length>=6){ setField('q1_who',v); addMsg('好，你开头这段我先记到【出镜与生意】里了。咱们一条一条把剩下的补齐。'); }
    else addMsg('好，咱们一条一条来。');
    S.phase='ask'; S.qi=0; S.timer=setTimeout(askQ,450); return;
  }
  if(S.phase==='ask'||S.phase==='fallback'){ handleAnswer(v); return; }
  if(S.phase==='confirm'){
    if(/没问题|没有要改|确认|可以了|就这样|ok|好的|开始吧|开始/.test(v)){ generateMsg(); }
    else { addMsg('收到：<b>'+v.slice(0,50)+'</b>（演示版仅记录修改意图）。确认后点「开始创作」。'); }
    return;
  }
  if(S.phase==='gen'){ addMsg('正在生成中，先别急——生成完这里随时可以让我改。'); return; }
  if(S.phase==='done'){ setTimeout(()=>{ addMsg('已记录：<b>'+v.slice(0,40)+'</b>…（演示版仅回声确认）'); },350); return; }
}

/* ===================== 重置 ===================== */
function resetAll(greet2){
  clearTimeout(S.timer); demoAbort=true;
  S={phase:'idle',qi:0,brief:{},depth:S.depth,auto:false,timer:null,materialWeak:false,mode:'guided',push:{}};
  genIdx=0;
  $('chatLog').innerHTML='';
  $('genWrap').style.display='none';
  $('dlWrap').style.display='none';
  $('dlWrap').innerHTML='';
  $('phGrid').innerHTML='';
  $('panel-deliver').classList.add('locked');
  $('lockMsg').style.display='';
  $('briefBadge').style.display='none';
  $('deliverBadge').style.display='none';
  renderBrief();
  switchTab('chat');
  if(greet2){
    S.phase='greet';
    addMsg('你好，我是<b>金牌文案主笔</b>。在出稿之前，我先用 <b>7 个问题</b>把料备齐——答多少算多少，可跳可停，越具体越像你本人。准备好了回复「<b>开始</b>」或打字说你的情况，我就开始问。');
    $('freeInput').placeholder='打字说你的情况，或回复「开始」';
  }
}
$('btnReset').onclick=()=>{ demoAbort=true; resetAll(true); };

/* ===================== 自动演示 ===================== */
let demoOn=false, demoAbort=false;
const dSleep=ms=>new Promise(r=>setTimeout(r,ms));
function dWait(fn,timeout){return new Promise(res=>{const t0=Date.now();(function p(){if(demoAbort)return res(false);if(fn())return res(true);if(Date.now()-t0>timeout)return res(false);setTimeout(p,150);})();});}
async function dType(text){ $('freeInput').value=''; for(const ch of text){ if(demoAbort)return; $('freeInput').value+=ch; await dSleep(35);} await dSleep(300); }
function setDemoBtn(on){ const b=$('btnDemo'); b.textContent=on?'⏹':'▶ 演示'; b.classList.toggle('on',on); }
async function runDemo(){
  if(demoOn){ demoAbort=true; return; }
  demoOn=true; demoAbort=false; setDemoBtn(true);
  resetAll(true); demoAbort=false; await dSleep(600);
  const steps=[
    {text:'开始',                                 done:()=>S.phase==='ask'},
    {text:SAMPLES.q1_who,        done:()=>S.qi>=1||S.phase==='confirm'},
    {text:SAMPLES.q2_goal,       done:()=>S.qi>=2||S.phase==='confirm'},
    {text:SAMPLES.q3_audience,   done:()=>S.qi>=3||S.phase==='confirm'},
    {text:SAMPLES.q4_material,   done:()=>S.qi>=4||S.phase==='confirm'},
    {text:SAMPLES.q5_redline,    done:()=>S.qi>=5||S.phase==='confirm'},
    {text:SAMPLES.q6_region,     done:()=>S.qi>=6||S.phase==='confirm'},
    {text:SAMPLES.q7_budget,     done:()=>S.phase==='confirm'},
    {text:'没问题',                               done:()=>S.phase==='gen'||S.phase==='done'},
  ];
  for(const st of steps){
    if(demoAbort) break;
    switchTab('chat');
    await dType(st.text);
    if(demoAbort) break;
    freeSend();
    await dWait(st.done,15000);
    await dSleep(600);
  }
  if(!demoAbort){
    await dWait(()=>S.phase==='done',45000);
    if(!demoAbort){ switchTab('deliver'); toast('演示完毕 ✅ 访谈→确认→生成→十件套交付'); }
  }
  demoOn=false; setDemoBtn(false);
}
$('btnDemo').onclick=runDemo;
['input','pointerdown'].forEach(ev=>$('freeInput').addEventListener(ev,()=>{ if(demoOn) demoAbort=true; }));

/* ===================== 启动 ===================== */
resetAll(true);
switchTab('chat');
</script>
