# Baolu OS v2 nginx snippet.
# Put this inside the existing api.lcppch.top server block after backing up current config.
# Production beta uses /os-v2/ to avoid touching legacy /v2, /chat, /mcp, /auth, and /wx routes.

location /os-v2/api/ {
  proxy_pass http://127.0.0.1:3002/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
}

location = /os-v2 {
  return 302 /os-v2/;
}

location /os-v2/ {
  alias /opt/Sitong-os-v2/apps/web/dist/;
  try_files $uri $uri/ /os-v2/index.html;
}

# WeChat Pay callback should route to the same API service.
location = /os-v2/api/billing/wechat/notify {
  proxy_pass http://127.0.0.1:3002/billing/wechat/notify;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
}
