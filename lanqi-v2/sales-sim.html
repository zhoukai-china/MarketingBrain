/* ===== AI模拟销售私有样式（共享部分在 lanqi-ui.css） ===== */
/* AI 说明卡细节 */
.sim-body { font-size: 15px; line-height: 1.85; }
.sim-body p { margin-bottom: 7px; }
.sim-body b { color: #FFC79B; }
.ai-head .time { font-size: 11px; color: rgba(255,220,190,.55); margin-left: 2px; }
.ai-foot { display: flex; align-items: center; gap: 14px; margin-top: 12px; padding-top: 14px; border-top: 1px dashed rgba(255,180,130,.22); flex-wrap: wrap; }
.ai-stat { flex: 1; min-width: 150px; }
.ai-stat .fs { font-size: 12.5px; color: rgba(255,235,218,.85); margin-bottom: 5px; }
.ai-stat .fs b { color: #7CE0AC; font-weight: 800; }
.ai-cta { width: 100%; margin-top: 2px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px; border-radius: 13px; background: var(--og); color: #fff; font-size: 14.5px; font-weight: 800; letter-spacing: 1px; box-shadow: 0 6px 18px rgba(255,106,0,.4); transition: transform .15s; }
.ai-cta:active { transform: scale(.97); }

/* 系统流程指导（四步导航） */
.flow-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad); box-shadow: var(--shadow-s); padding: 12px 13px 13px; }
.flow-top { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
.flow-pts { margin-left: auto; font-size: 11px; color: var(--t3); font-weight: 700; }
.flow-pts b { color: var(--o3); }
.flow-steps { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; }
.fstep { flex: 1; min-width: 148px; display: flex; align-items: center; gap: 8px; text-align: left; padding: 9px 10px; border-radius: var(--rad-s); border: 1.5px solid var(--line); background: #fff; transition: all .15s; }
.fstep:active { transform: scale(.97); }
.fstep .fn { width: 22px; height: 22px; border-radius: 50%; background: var(--soft); color: var(--o3); font-size: 11px; font-weight: 900; display: grid; place-items: center; flex-shrink: 0; }
.fstep .ft { min-width: 0; }
.fstep .ft b { display: block; font-size: 12.5px; font-weight: 800; color: var(--t1); }
.fstep .ft i { display: block; font-style: normal; font-size: 10px; color: var(--t3); margin-top: 1px; }
.fstep.done { border-color: rgba(15,169,104,.4); }
.fstep.done .fn { background: #E7F8F0; color: var(--green); }
.fstep.on { border-color: var(--o1); background: var(--soft); box-shadow: 0 5px 14px rgba(255,106,0,.16); }
.fstep.on .fn { background: var(--og); color: #fff; }
.farr { align-self: center; color: var(--line2); font-size: 12px; font-weight: 900; }
@media (max-width: 479px) {
  .flow-steps { flex-wrap: nowrap; }
  .fstep { min-width: 0; padding: 8px 7px; gap: 6px; }
  .fstep .fn { flex-shrink: 0; }
  .fstep .ft b { font-size: 11px; white-space: nowrap; }
  .fstep .ft i { display: none; }
  .farr { font-size: 10px; }
}

/* 场景选择 */
.sc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.sc-card { position: relative; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--rad-s); padding: 13px 12px; box-shadow: var(--shadow-s); transition: all .15s; cursor: pointer; text-align: left; min-height: 40px; }
.sc-card:active { transform: scale(.97); }
.sc-card.on { border-color: var(--o1); background: var(--soft); box-shadow: 0 6px 16px rgba(255,106,0,.16); }
.sc-card .si { font-size: 20px; }
.sc-card .sn { font-size: 13.5px; font-weight: 800; margin-top: 5px; }
.sc-card .sd { font-size: 11px; color: var(--t3); margin-top: 2px; line-height: 1.5; }
.sc-card .sl { font-size: 10.5px; margin-top: 6px; color: var(--amber); letter-spacing: 1px; }
.sc-card .st { position: absolute; top: 9px; right: 9px; font-size: 9.5px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--o3); }
.sc-card.on .st { background: var(--og); color: #fff; }
.sc-tip { font-size: 10.5px; color: var(--t3); margin-top: 10px; line-height: 1.65; }

/* 客户选择 */
.cust-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.cust-card { display: flex; align-items: flex-start; gap: 10px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--rad-s); padding: 12px; box-shadow: var(--shadow-s); transition: all .15s; cursor: pointer; text-align: left; }
.cust-card:active { transform: scale(.98); }
.cust-card.on { border-color: var(--o1); background: var(--soft); box-shadow: 0 6px 16px rgba(255,106,0,.16); }
.cust-card .ca { width: 38px; height: 38px; border-radius: 13px; background: var(--og); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 15px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(255,106,0,.3); }
.cust-card .cm { min-width: 0; flex: 1; }
.cust-card .cn { font-size: 13.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cust-card .cl { font-size: 10.5px; color: var(--t3); margin-top: 1px; }
.cust-card .cana { display: block; font-size: 11px; color: var(--t2); line-height: 1.65; margin-top: 7px; }
.cust-card .cana b { color: var(--t1); }
.hint-bar { font-size: 11px; color: var(--t2); background: #FFFBF7; border: 1px dashed var(--line2); border-radius: 10px; padding: 9px 12px; line-height: 1.7; margin-top: 10px; }
.hint-bar a { color: var(--o3); font-weight: 800; text-decoration: underline; }
.hint-bar b { color: var(--t1); }

/* 目标设定 */
.goal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.fi label { display: block; font-size: 11.5px; font-weight: 700; color: var(--t2); margin-bottom: 5px; }
.fi select { width: 100%; padding: 10px 11px; border: 1.5px solid var(--line2); border-radius: 11px; font-size: 13px; color: var(--t1); background: #fff; outline: none; appearance: none; -webkit-appearance: none; }
.fi select:focus { border-color: var(--o1); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11.5px; padding: 6px 11px; border-radius: 999px; background: var(--soft); color: var(--o3); border: 1px solid var(--line2); font-weight: 700; }
.btn-row { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 12px; }
.btn-row .btn { flex: 1; min-width: 140px; }
.btn-row.center { justify-content: center; }

/* 话术建议视图 */
.back-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; color: var(--o3); cursor: pointer; padding: 2px 4px; }
.back-link:active { transform: scale(.96); }
.sim-hero { background: var(--og); border-radius: var(--rad); padding: 16px 17px; color: #fff; box-shadow: 0 8px 22px rgba(255,106,0,.28); }
.sim-hero.dark { background: linear-gradient(135deg, #3A2413, var(--ink)); box-shadow: var(--shadow-s); }
.sim-hero h2 { font-size: 17px; font-weight: 900; margin: 8px 0 5px; letter-spacing: .3px; }
.sim-hero .lead { font-size: 12px; opacity: .96; line-height: 1.75; }
.sim-hero .lead b { color: #FFD9B8; }
.badge-row { display: flex; flex-wrap: wrap; gap: 6px; }
.badge-row .badge { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.42); color: #fff; }
.ph { font-size: 14.5px; font-weight: 800; margin-bottom: 11px; }
.brief-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.ai-b { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad-s); padding: 13px 14px; box-shadow: var(--shadow-s); min-width: 0; }
.ai-b.wide { grid-column: 1 / -1; }
.ai-b h4 { font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.badge-ai { background: var(--og); color: #fff; font-size: 9.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; flex-shrink: 0; }
.ai-b p { font-size: 12.5px; color: var(--t2); line-height: 1.75; margin: 0; }
.ai-b p b { color: var(--t1); }
.reco-list { display: flex; flex-direction: column; gap: 7px; }
.reco { font-size: 12.5px; font-weight: 700; padding: 9px 11px; border-radius: 10px; background: var(--soft); color: var(--t1); border: 1px solid var(--line); }
.reco .why { display: block; font-size: 10.5px; color: var(--t3); font-weight: 500; margin-top: 2px; }
.script-card { background: #FFFBF7; border: 1px solid var(--line); border-left: 4px solid var(--o1); border-radius: 10px; padding: 11px 13px; margin-bottom: 9px; }
.script-card:last-child { margin-bottom: 0; }
.script-card .sc-h { font-size: 12.5px; font-weight: 800; color: var(--o3); margin-bottom: 4px; }
.script-card .sc-b { font-size: 12.5px; color: var(--t1); line-height: 1.75; }
/* 异议库手风琴 */
.obj-item { border: 1px solid var(--line); border-radius: var(--rad-s); background: #fff; margin-bottom: 8px; overflow: hidden; }
.obj-item:last-child { margin-bottom: 0; }
.obj-q { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 11px 13px; font-size: 12.5px; font-weight: 800; color: var(--t1); }
.obj-q .otag { font-style: normal; font-size: 9.5px; font-weight: 800; color: var(--o3); background: var(--soft); border-radius: 999px; padding: 2px 8px; margin-right: 7px; white-space: nowrap; }
.obj-q .arr { color: var(--t3); transition: transform .2s; flex-shrink: 0; }
.obj-item.open .arr { transform: rotate(180deg); }
.obj-a { display: none; padding: 0 13px 12px; font-size: 12px; color: var(--t2); line-height: 1.75; }
.obj-a b { color: var(--o3); }
.obj-item.open .obj-a { display: block; }

/* 对话模拟区 */
.chat-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad); box-shadow: var(--shadow-s); overflow: hidden; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: linear-gradient(135deg, #FFF3EA, #FFEBDD); border-bottom: 1px solid var(--line); }
.chat-ava { width: 42px; height: 42px; border-radius: 14px; background: var(--ink); color: #FFC79B; display: grid; place-items: center; font-weight: 800; font-size: 16px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(36,19,9,.28); }
.chat-nm { font-size: 13.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chat-sub { font-size: 11px; color: var(--t3); margin-top: 1px; }
.chat-pill { margin-left: auto; font-size: 10.5px; font-weight: 800; padding: 5px 11px; border-radius: 999px; background: #fff; border: 1px solid var(--line2); color: var(--o3); white-space: nowrap; }
.chat-log { padding: 14px 13px; display: flex; flex-direction: column; gap: 10px; background: #FFFBF7; max-height: 52vh; overflow-y: auto; }
.bub { max-width: 84%; padding: 10px 13px; border-radius: 15px; font-size: 13.5px; line-height: 1.65; }
.bub .who { display: block; font-size: 10px; color: var(--t3); margin-bottom: 2px; font-weight: 700; }
.bub.ai { align-self: flex-start; background: #fff; border: 1.5px solid var(--o2); border-bottom-left-radius: 5px; color: var(--t1); }
.bub.me { align-self: flex-end; background: var(--og); color: #fff; border-bottom-right-radius: 5px; box-shadow: 0 4px 12px rgba(255,106,0,.25); }
.bub.me .who { color: rgba(255,255,255,.75); }
.bub.coach { align-self: center; max-width: 94%; background: #FFF6EC; border: 1px dashed var(--line2); border-radius: 11px; font-size: 11.5px; color: var(--t2); padding: 8px 12px; line-height: 1.7; }
.bub.coach b { color: var(--o3); }
.dots { display: inline-flex; gap: 4px; padding: 4px 2px; align-items: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--o2); animation: dotb 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dotb { 0%, 60%, 100% { transform: none; opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
.sim-input { display: flex; gap: 9px; padding: 11px 13px; border-top: 1px solid var(--line); background: #fff; }
.sim-input input { flex: 1; min-width: 0; border: 1.5px solid var(--line2); border-radius: 12px; padding: 10px 13px; font-size: 16px; outline: none; background: #FFFBF7; }
.sim-input input:focus { border-color: var(--o1); background: #fff; }
.sim-input .btn { flex-shrink: 0; padding: 10px 20px; }
.chat-foot { display: flex; gap: 9px; padding: 0 13px 13px; background: #fff; }
.chat-foot .btn { flex: 1; }

/* 教练面板 */
.practice-grid { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: start; }
.coach-side { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad); padding: 13px 14px; box-shadow: var(--shadow-s); }
.coach-side.hide { display: none !important; }
.coach-side h3 { font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
.coach-toggle { margin-left: auto; font-size: 10.5px; color: var(--o3); background: var(--soft); border-radius: 999px; padding: 3px 10px; font-weight: 800; font-style: normal; }
.cs-row { font-size: 12px; color: var(--t2); line-height: 1.7; margin-bottom: 6px; }
.cs-row b { color: var(--t1); }
.coach-side .tip { font-size: 11px; background: var(--soft); border: 1px solid var(--line2); border-radius: 10px; padding: 8px 10px; color: var(--t2); line-height: 1.65; }

/* AI 点评 */
.rv-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad); padding: 16px 15px; box-shadow: var(--shadow-s); }
.rv-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.rv-num { font-size: 40px; font-weight: 900; color: var(--o1); line-height: 1; letter-spacing: -1px; }
.rv-num small { font-size: 13px; color: var(--t3); font-weight: 700; letter-spacing: 0; }
.rv-desc { flex: 1; min-width: 150px; font-size: 12px; color: var(--t2); line-height: 1.7; }
.rv-desc b { color: var(--t1); }
.rv-dim { display: grid; grid-template-columns: 64px 1fr 40px; gap: 9px; align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--t2); font-weight: 700; }
.rv-dim .sc { text-align: right; font-weight: 900; color: var(--t1); font-size: 12.5px; }
.rv-tip { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; line-height: 1.75; color: var(--t2); margin-top: 9px; background: #FFFBF7; }
.rv-tip b { color: var(--t1); }
.rv-tip.good { background: #F2FBF7; border-color: rgba(15,169,104,.3); }
.rv-tip.cmp { background: linear-gradient(135deg, #FFF3EA, #FFEBDD); border-color: var(--line2); }
.rv-tip.cmp .you { color: var(--t2); }
.rv-tip.cmp .sug { color: var(--o3); font-weight: 700; }
.rv-acts { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 14px; }
.rv-acts .btn { flex: 1; min-width: 130px; }

/* 算力不足 */
.danger-box { background: #FCE9EB; border: 1px solid rgba(226,62,78,.35); border-radius: var(--rad); padding: 22px 18px; text-align: center; color: var(--red); }
.danger-box h3 { font-size: 15.5px; font-weight: 900; margin-bottom: 7px; }
.danger-box p { font-size: 12.5px; color: var(--t2); line-height: 1.75; }

@media (min-width: 960px) {
  .sc-grid { grid-template-columns: repeat(4, 1fr); gap: 11px; }
  .cust-grid { grid-template-columns: repeat(3, 1fr); }
  .brief-grid { grid-template-columns: 1fr 1fr; }
  .practice-grid { grid-template-columns: 1fr 300px; }
  .coach-side { position: sticky; top: 130px; }
  .chat-log { padding: 18px 16px; max-height: 58vh; }
}
</style>

  h += '<section class="span2 rise"><div class="brief-grid">';
  h += aiB("推荐方向（私域营销话术）", recoList(c));
  h += aiB("切入时机", "<p>" + c.timing + "</p>");
  h += '<div class="ai-b wide"><h4><span class="badge-ai">AI</span> 五段式话术骨架（可直接练）</h4>' +
    FIVE.map(function (s) { return '<div class="script-card"><div class="sc-h">' + s.h + '</div><div class="sc-b">' + s.b + "</div></div>"; }).join("") + "</div>";
  h += '<div class="ai-b wide"><h4><span class="badge-ai">AI</span> 预设客户异议 & 应对</h4><p><b>客户常说：</b>' + c.objection + '<br><b>应对原则：</b>先接住情绪（「明白～」），再给价值；全程不硬推、不套盒、用关怀语气。排班与服务注意：' + c.care + "</p></div>";
  h += "</div></section>";
  /* 异议模拟库 */
  h += '<section class="span2 rise"><div class="sec-head"><h2><span class="bar"></span>🛡️ 客户异议模拟 & 回应策略</h2><p>点开看 AI 教练的应对示范</p></div><div class="card">';
  OBJ_LIB.forEach(function (o, i) {
    h += '<div class="obj-item"><button class="obj-q" data-obj="' + i + '"><span><i class="otag">' + o.who + "</i>" + o.q + '</span><span class="arr">▾</span></button>';
    h += '<div class="obj-a"><b>回应策略：</b>' + o.a + "</div></div>";
  });
  h += "</div></section>";
  /* 动作 */
  h += '<section class="span2 rise"><div class="btn-row">';
  h += '<button class="btn primary" data-act="startPractice">🎭 我看完了，开始练习（AI 扮演 ' + c.nm + "）</button>";
  h += '<button class="btn" data-act="toSetup">🔄 重选客户</button>';
  h += "</div>";
  h += '<div class="hint-bar">提示：练习过程中随时可点「结束练习」看复盘；复盘页也能「重看话术建议」。</div></section>';
  return h;
}

/* ---------- 对话练习页 ---------- */
function practiceHtml() {
  var c = ALLC[selCust];
  var h = '<section class="span2 rise"><a class="back-link" data-act="toBrief">← 返回话术建议</a></section>';
  h += '<section class="span2 rise"><div class="practice-grid">';
  /* 对话区 */
  h += '<div class="chat-wrap">';
  h += '<div class="chat-head"><span class="chat-ava">' + c.nm[0] + "</span>";
  h += '<span><span class="chat-nm">' + c.nm + "（AI 扮演）<span class=\"badge " + TAGCLS[c.tag] + '">' + c.tagTxt + "</span></span>";
  h += '<span class="chat-sub">' + c.persona + "</span></span>";
  h += '<span class="chat-pill">第 ' + (cycle + 1) + " 轮 · 异议强度：" + goal.intensity + "</span></div>";
  h += '<div class="chat-log" id="chatLog">';
  practiceLog.forEach(function (m) {
    if (m.r === "cust") h += '<div class="bub ai"><span class="who">AI 客户 · ' + c.nm + "</span>" + esc(m.t) + "</div>";
    else if (m.r === "user") h += '<div class="bub me"><span class="who">我</span>' + esc(m.t) + "</div>";
    else h += '<div class="bub coach"><b>教练提示</b>：' + esc(m.t) + "</div>";
  });
  h += "</div>";
  h += '<div class="sim-input"><input id="simInput" type="text" placeholder="输入你的话术，练起来…"><button class="btn primary" id="simSend">发送</button></div>';
  h += '<div class="chat-foot"><button class="btn primary" data-act="endPractice">🏁 结束练习 · 看 AI 点评</button><button class="btn" data-act="toSetup">🔄 重选客户</button></div>';
  h += "</div>";
  /* 教练面板 */
  h += '<div class="coach-side" id="coachSide"><h3>🧭 教练面板<button class="coach-toggle" id="coachToggle"><i>收起 ▴</i></button></h3>';
  h += '<div class="cs-row"><b>当前客户：</b>' + c.nm + "（" + c.lvl + " · " + c.tagTxt + "）</div>";
  h += '<div class="cs-row"><b>敏感点：</b>' + c.care + "</div>";
  h += '<div class="cs-row"><b>预设异议：</b>' + c.objection + "</div>";
  h += '<div class="cs-row"><b>重点推荐：</b>' + c.recos.join("、") + "</div>";
  h += '<div class="cs-row"><b>本轮目标：</b>用养护节点 / 关怀切入，避免硬推。</div>';
  h += '<div class="tip">每轮你说完，AI 客户会按性格回应，教练同步给评分与改进话术。多轮走到成交或点「结束练习」即复盘。</div></div>';
  h += "</div></section>";
  return h;
}

/* ---------- 复盘页 ---------- */
function reviewHtml() {
  var c = ALLC[selCust];
  var h = '<section class="span2 rise"><a class="back-link" data-act="toPractice">← 返回练习</a></section>';
  h += '<section class="span2 rise" id="simReview"><div class="sec-head"><h2><span class="bar"></span>AI 点评 · 本场复盘</h2><p>五个维度自动评分 · 满分 100</p>';
  h += '<span class="more">练习对象：' + c.nm + " · 共 " + (cycle + 1) + " 轮</span></div>";
  h += '<div class="rv-card">';
  h += '  <div class="rv-top"><span class="rv-num">82<small> / 100</small></span>';
  h += '    <span class="rv-desc"><b>成交信心指数：良好</b> · 比上一场 <b style="color:var(--green)">+6 分</b>。<br>整体稳健，异议处理还可再练 —— 客户说「别推卡」时，先共情再给价值会更顺。</span></div>';
  h += '  <div class="rv-dims">';
  DIMS.forEach(function (d) {
    h += '<div class="rv-dim"><span>' + d.n + '</span><div class="pbar"><i class="pfill" data-w="' + d.v + '"></i></div><span class="sc">' + d.v + "</span></div>";
  });
  h += "  </div>";
  h += '  <div class="rv-tip good">✅ <b>亮点</b>：用「14 天养护节点」切题而非促销开场，符合客户厌推销的画像设定；结尾顺势锁定了周六到店时间。</div>';
  h += '  <div class="rv-tip">🔧 <b>待改进</b>：客户抛异议时先解释「我没推」，略显防御、带对立感；正确顺序是先接住情绪（「明白～」），再给价值。</div>';
  h += '  <div class="rv-tip cmp">📋 <b>标准话术对比</b><br><span class="you">你实际说：「姐你别误会，我今天真没想推卡…」</span><br><span class="sug">AI 建议：「明白～今天不推卡，就是提醒您养护节点到了，回馈礼您舒服最重要。」—— 不解释、不对立，先共情再给价值。</span></div>';
  h += '  <div class="rv-acts">';
  h += '    <button class="btn primary" data-act="again">🔁 再来一次（-80 算力）</button>';
  h += '    <button class="btn" data-act="saveScript">📋 存入话术库</button>';
  h += '    <button class="btn" data-act="toBrief">📖 重看话术建议</button>';
  h += "  </div>";
  h += "</div></section>";
  return h;
}

/* ---------- 算力不足 ---------- */
function nopointsHtml() {
  var h = '<section class="span2 rise"><div class="danger-box"><h3>💎 算力不足，无法开始新的模拟销售</h3>';
  h += "<p>每次模拟销售练习（含再来一次）需 80 算力，当前余额不足。请前往积分中心充值或领取每日练习额度后重试。</p>";
  h += '<div class="btn-row center"><a class="btn primary" href="points-recharge.html">去充值 / 领每日额度</a><button class="btn" data-act="toSetup">返回练习准备</button></div></div>';
  h += '<div class="hint-bar">演示说明：每次新的模拟销售练习均扣 80 算力；余额不足时不卡流程，引导充值或领取每日额度。</div></section>';
  return h;
}

/* ---------- 渲染 ---------- */
function render() {
  var h = flowHtml();
  if (state === "setup") h += setupHtml();
  else if (state === "brief") h += briefHtml();
  else if (state === "practice") h += practiceHtml();
  else if (state === "review") h += reviewHtml();
  else h += nopointsHtml();
  $("#app").innerHTML = h;
  syncPoints();
  LQ.riseIn($("#app"));
  var cl = $("#chatLog");
  if (cl) cl.scrollTop = cl.scrollHeight;
}

/* ---------- 动作 ---------- */
function doSend() {
  var inp = $("#simInput");
  if (!inp) return;
  var v = inp.value.trim();
  if (!v) { LQ.toast("先输入一句你的话术～"); return; }
  practiceLog.push({ r: "user", t: v });
  practiceLog.push({ r: "coach", t: COACH_TIPS[cycle % COACH_TIPS.length] });
  practiceLog.push({ r: "cust", t: CUST_REPLIES[cycle % CUST_REPLIES.length] });
  cycle++;
  render();
}
function genBrief() {
  if (points < 80) { state = "nopoints"; render(); return; }
  points -= 80; briefSeen = true; state = "brief";
  render(); LQ.toast("⚡ 话术建议已生成 · -80 算力（demo）");
}
function startPractice() {
  var c = ALLC[selCust];
  practiceLog = [
    { r: "cust", t: c.firstCust },
    { r: "user", t: "雅琴姐，看您记录这周期刚好到 14 天养护节点了，晓曼今天有空，要不要顺手把下次预约也留了？" },
    { r: "coach", t: COACH_TIPS[0] },
    { r: "cust", t: CUST_REPLIES[0] }
  ];
  cycle = 0; state = "practice"; render();
}
function again() {
  if (points < 80) { state = "nopoints"; render(); return; }
  points -= 80; practiceLog = []; cycle = 0; state = "setup";
  render(); LQ.toast("已扣除 80 算力 · 新一场练习就绪（demo）");
}
function goStep(n) {
  if (n === 1) { state = "setup"; render(); return; }
  if (n === 2) {
    if (!briefSeen) { LQ.toast("先在准备页点「生成销售话术建议」～"); return; }
    state = "brief"; render(); return;
  }
  if (n === 3) {
    if (!briefSeen) { LQ.toast("先生成话术建议，再开始练习～"); return; }
    if (!practiceLog.length) { LQ.toast("先在话术建议页点「开始练习」～"); return; }
    state = "practice"; render(); return;
  }
  if (n === 4) {
    if (!practiceLog.length) { LQ.toast("先完成一场练习，才有复盘可看～"); return; }
    state = "review"; render();
  }
}
function doAct(act, el) {
  if (act === "genBrief") { genBrief(); return; }
  if (act === "startPractice") { startPractice(); return; }
  if (act === "endPractice") { state = "review"; render(); LQ.toast("练习结束 · AI 点评已生成（demo）"); return; }
  if (act === "again") { again(); return; }
  if (act === "saveScript") { LQ.toast("📋 优秀话术已存入门店话术库（demo）"); return; }
  if (act === "toSetup") { state = "setup"; render(); return; }
  if (act === "toBrief") {
    if (!briefSeen) { LQ.toast("先生成话术建议～"); return; }
    state = "brief"; render(); return;
  }
  if (act === "toPractice") {
    if (!practiceLog.length) { LQ.toast("先开始一场练习～"); return; }
    state = "practice"; render(); return;
  }
  if (act === "step") { goStep(+el.getAttribute("data-step")); return; }
  if (act === "randCust") {
    var ids = Object.keys(ALLC).filter(function (x) { return x !== selCust; });
    selCust = ids[Math.floor(Math.random() * ids.length)];
    render(); LQ.toast("🎲 已换客户：" + ALLC[selCust].nm + "（" + ALLC[selCust].tagTxt + (ALLC[selCust].lite ? " · 未AI分析" : "") + "）");
  }
}

/* ---------- 页面事件（事件委托 · 全部判空） ---------- */
document.addEventListener("click", function (e) {
  var sc = e.target.closest("[data-scene]");
  if (sc) {
    curScene = +sc.getAttribute("data-scene");
    $$(".sc-card").forEach(function (el) { el.classList.toggle("on", +el.getAttribute("data-scene") === curScene); });
    LQ.toast("已选场景：" + SCENES[curScene].nm + " · 话术建议将按此设定（demo）");
    return;
  }
  var cu = e.target.closest("[data-cust]");
  if (cu) {
    selCust = cu.getAttribute("data-cust");
    render(); LQ.toast("已选客户：" + ALLC[selCust].nm + "（" + ALLC[selCust].tagTxt + (ALLC[selCust].lite ? " · 未AI分析，可练" : "") + "）");
    return;
  }
  var ob = e.target.closest("[data-obj]");
  if (ob) { var item = ob.closest(".obj-item"); if (item) item.classList.toggle("open"); return; }
  var ct = e.target.closest("#coachToggle");
  if (ct) {
    var side = $("#coachSide");
    if (side) {
      side.classList.toggle("hide");
      var lbl = ct.querySelector("i");
      if (lbl) lbl.textContent = side.classList.contains("hide") ? "展开 ▾" : "收起 ▴";
    }
    return;
  }
  if (e.target.closest("#simSend")) { doSend(); return; }
  var ac = e.target.closest("[data-act]");
  if (ac) { doAct(ac.getAttribute("data-act"), ac); return; }
  var t = e.target.closest("[data-toast]");
  if (t) { LQ.toast(t.getAttribute("data-toast")); }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && e.target && e.target.id === "simInput") doSend();
});
document.addEventListener("change", function (e) {
  if (e.target.id === "goalTarget") goal.target = e.target.value;
  if (e.target.id === "goalInt") goal.intensity = e.target.value;
});

LQ.init({ nav: "salesSim", title: "AI模拟销售" });
render();
})();
</script>
</body>
</html>
