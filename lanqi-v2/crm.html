.ai-foot { display: flex; align-items: center; gap: 14px; margin-top: 12px; padding-top: 14px; border-top: 1px dashed rgba(255,180,130,.22); flex-wrap: wrap; }

.ai-cta { width: 100%; margin-top: 2px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px; border-radius: 13px; background: var(--og); color: #fff; font-size: 14.5px; font-weight: 800; letter-spacing: 1px; box-shadow: 0 6px 18px rgba(255,106,0,.4); transition: transform .15s; }

.lv-item .d { font-size: 10.5px; color: var(--t3); margin-top: 2px; }
.lv-item.warn { border-top: 3px solid var(--red); }
.lv-item.warn .v { color: var(--red); }
.lv-item.cool { border-top: 3px solid var(--o1); }

.chip { min-height: 40px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; color: var(--t2); font-size: 12.5px; font-weight: 700; white-space: nowrap; flex-shrink: 0; transition: all .15s; }

.cust-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--rad); padding: 13px 14px; box-shadow: var(--shadow-s); transition: transform .15s; cursor: pointer; }

.cc-top { display: flex; align-items: center; gap: 11px; }
.cc-ava { width: 42px; height: 42px; border-radius: 14px; background: var(--og); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 16px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(255,106,0,.25); }

.cc-use b { font-size: 12.5px; color: var(--o1); text-align: right; }

var aiTimers = [];
function later(fn, ms) { aiTimers.push(setTimeout(fn, ms)); }
function clearLater() { aiTimers.forEach(function (t) { clearTimeout(t); }); aiTimers = []; }
function typeInsight() {
  var s = LQ.store(), body = $("#insBody");
  if (!body) return;
  clearLater();
  var lines = insightLines(s);
  body.innerHTML = lines.map(function () { return "<p></p>"; }).join("");
  var ps = body.querySelectorAll("p");
  function typeLine(idx) {
    if (idx >= lines.length) return;
    var p = ps[idx], txt = lines[idx], i = 0, buf = "";
    p.classList.add("show");
    function step() {
      if (i < txt.length) {
        buf += txt.charAt(i); i++;
        p.innerHTML = buf;
        later(step, 14);
      } else {
        if (idx === lines.length - 1) p.innerHTML = buf + '<span class="ai-caret"></span>';
        later(function () { typeLine(idx + 1); }, 240);
      }
    }
    step();
  }
  typeLine(0);
}

function gradeOf(c) {
  if (c.lastDays > 45) return "D";
  if (c.total >= 30000 && c.visits90 >= 8) return "A";
  if (c.total >= 10000 && c.visits90 >= 4) return "B";
  if (c.total >= 3000) return "C";
  return "D";
}
function mainCard(c) { return c.cards && c.cards.length ? c.cards[0] : null; }
function cardRate(k) {
  if (!k) return null;
  if (k.kind === "储值") return Math.round((1 - (k.bal || 0) / Math.max(1, k.amt || 1)) * 100);
  if (k.type === "时长") return Math.round((1 - (k.remainMin || 0) / Math.max(1, k.minutes || 1)) * 100);
  return Math.round((1 - k.remain / Math.max(1, k.times || 1)) * 100);
}
function useOf(c) { return cardRate(mainCard(c)); }
function tail(p) { var s = String(p || ""); return s.indexOf("*") >= 0 ? "尾号 " + s.slice(-4) : s; }
function gradeFromQuery(q) { var m = /^\s*([abcd])\s*(类|级|等|客户)?\s*$/i.exec(String(q || "")); return m ? m[1].toUpperCase() : null; }
function matchQ(c, q) {
  q = String(q).trim(); if (!q) return true;
  var gq = gradeFromQuery(q); if (gq) return gradeOf(c) === gq;
  var ql = q.toLowerCase();
  if (c.nm.indexOf(q) >= 0) return true;
  if (c.wx !== "—" && String(c.wx).toLowerCase().indexOf(ql) >= 0) return true;
  var d = q.replace(/\D/g, "");
  if (d) { if (String(c.phoneRaw).indexOf(d) >= 0) return true; if (String(c.phone).replace(/\*/g, "").indexOf(d) >= 0) return true; return false; }
  return String(c.job || "").indexOf(q) >= 0;
}

function tabCards(c) {

      if (k.type === "时长") h += '<span class="badge a">时长</span>';
      if (frozen) h += '<span class="badge r">🔒 挂失中</span>';

      h += "<span>剩余：<b style='color:var(--t1)'>" + leftTxt + "</b></span><span>卡面：<b style='color:var(--t1)'>¥" + fmt(k.amt) + "</b></span>";

      h += '<button class="btn ghost" style="min-height:34px;padding:6px 12px;font-size:12px' + (frozen ? ";opacity:.5" : "") + '" data-renew="' + ci + '">＋ ' + (k.kind === "储值" ? "续充" : "续费") + "</button>";

  h += "</div></details></div></section>";
  return h;
}

    var fi = +t.getAttribute("data-fg"), fc = byId(sel);
    if (fc && fc.follow[fi]) { fc.follow[fi].on = !fc.follow[fi].on; t.classList.toggle("on", fc.follow[fi].on); LQ.toast((fc.follow[fi].on ? "🔔 提醒已开启：" : "🔕 提醒已关闭：") + fc.follow[fi].type); }
    return;
  }
  if ((t = e.target.closest("#shClose"))) { closeSheet(); return; }
  var dm = e.target.closest("[data-demo]");
  if (dm) { LQ.toast(dm.getAttribute("data-demo")); if ($("#lqSheet") && $("#lqSheet").classList.contains("show") && dm.getAttribute("data-demo").charAt(0) === "✅") closeSheet(); return; }
  var tt = e.target.closest("[data-toast]");
  if (tt) { LQ.toast(tt.getAttribute("data-toast")); return; }
});
document.addEventListener("input", function (e) {
  if (e.target && e.target.id === "custSearch") { searchQ = e.target.value; applyFilter(); }
});

if (QCUST) { var c0 = byName(QCUST); if (c0) { sel = c0.id; view = "detail"; curTab = "cards"; } }
render();
})();
