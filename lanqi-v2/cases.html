/* ① AI 深色 hero 卡 */
.cs-hero-t { font-size: 19px; font-weight: 900; line-height: 1.45; letter-spacing: .2px; }
.cs-hero-d { font-size: 12.5px; color: rgba(255,235,218,.78); line-height: 1.75; margin-top: 7px; }
.cs-hero-d b { color: #FFC79B; }
.cs-stats { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
.cs-stats > div { flex: 1; min-width: 96px; background: rgba(255,150,80,.12); border: 1px solid rgba(255,150,80,.3); border-radius: 13px; padding: 10px 12px; }
.cs-stats b { display: block; font-size: 21px; font-weight: 900; color: #FFC79B; letter-spacing: -.3px; text-shadow: 0 0 14px rgba(255,138,61,.4); }
.cs-stats span { font-size: 10.5px; color: rgba(255,220,190,.66); }
.cs-hero-tip { margin-top: 13px; font-size: 11.5px; color: rgba(255,220,190,.75); background: rgba(255,255,255,.07); border: 1px dashed rgba(255,180,130,.3); border-radius: 10px; padding: 8px 12px; line-height: 1.6; }

/* ② 筛选 chips */
.cs-chipbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: var(--rad-s); padding: 10px 12px; box-shadow: var(--shadow-s); }
.cs-chip {
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 40px; padding: 8px 15px; border-radius: 999px;
  background: var(--soft); border: 1.5px solid var(--line);
  font-size: 12.5px; font-weight: 700; color: var(--t2);
  transition: all .16s; white-space: nowrap;
}
.cs-chip:active { transform: scale(.95); }
.cs-chip.on { background: var(--og); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(255,106,0,.3); }
.cs-chip .ct { font-size: 10px; font-weight: 800; opacity: .7; }
.cs-cnt { margin-left: auto; font-size: 10.5px; color: var(--t3); font-weight: 600; }

/* ③ 案例卡 */
.cs-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--rad);
  padding: 15px 15px 14px; box-shadow: var(--shadow-s); position: relative; overflow: hidden;
}
.cs-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--og); opacity: .8; }
.cs-card.hide { display: none; }
.cs-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 9px; }
.cs-scene { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: var(--o3); background: var(--soft); border: 1px solid var(--line2); border-radius: 999px; padding: 3px 11px; }
.cs-store { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--t2); background: #FFF9F4; border: 1px dashed var(--line2); border-radius: 999px; padding: 3px 10px; }
.cs-card h3 { font-size: 14.5px; font-weight: 800; line-height: 1.55; margin-bottom: 11px; }
.cs-step { border-radius: 11px; padding: 9px 12px 10px; margin-bottom: 8px; }
.cs-step .lb { display: inline-block; font-size: 9.5px; font-weight: 900; letter-spacing: 1px; border-radius: 6px; padding: 1.5px 8px; margin-bottom: 4px; }
.cs-step p { font-size: 12px; line-height: 1.75; color: var(--t2); }
.cs-step.sp { background: #FFF7F7; border: 1px solid #FBE3E4; }
.cs-step.sp .lb { background: #FCE9EB; color: var(--red); }
.cs-step.sa { background: var(--soft); border: 1px solid var(--line); }
.cs-step.sa .lb { background: var(--og); color: #fff; }
.cs-step.sa p b { color: var(--o3); }
.cs-res { display: flex; gap: 8px; margin: 11px 0 10px; }
.cs-res > div { flex: 1; min-width: 0; text-align: center; background: #FFF9F4; border: 1px solid var(--line); border-radius: 11px; padding: 9px 4px 8px; }
.cs-res .k { display: block; font-size: 9.5px; color: var(--t3); font-weight: 600; white-space: nowrap; }
.cs-res .v { display: inline-block; font-size: 16.5px; font-weight: 900; color: var(--o1); letter-spacing: -.4px; margin-top: 3px; }
.cs-res .u { font-size: 9.5px; color: var(--t3); font-weight: 600; }
.cs-barlb { font-size: 10.5px; color: var(--t3); margin-top: 6px; line-height: 1.5; }
.cs-barlb b { color: var(--o3); }
.cs-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.cs-apply {
  flex: 1; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 5px;

  border-radius: 999px; box-shadow: 0 5px 14px rgba(255,106,0,.32); transition: transform .15s;
}
.cs-apply:active { transform: scale(.96); }
.cs-go { flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--o3); border: 1.5px solid var(--line2); border-radius: 999px; padding: 9px 14px; min-height: 40px; display: inline-flex; align-items: center; background: #fff; transition: all .15s; }

.cs-detail-btn {
  width: 100%; min-height: 38px; margin-top: 11px; display: flex; align-items: center; justify-content: center; gap: 5px;

  font-size: 12px; font-weight: 700; color: var(--o3); transition: all .15s;
}
.cs-detail-btn:active { transform: scale(.97); background: #FFE9D9; }

.cs-more > b { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.cs-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 11px 0 10px; }
.cs-links a { display: inline-flex; align-items: center; min-height: 40px; padding: 8px 15px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line2); font-size: 12.5px; font-weight: 700; color: var(--t2); transition: all .15s; }
.cs-links a:active { transform: scale(.95); background: #FFE3CE; color: var(--o3); }
.cs-note { font-size: 10.5px; color: var(--t3); line-height: 1.7; }

.dt-back { display: inline-flex; align-items: center; gap: 5px; min-height: 40px; padding: 8px 15px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line2); color: var(--o3); font-size: 12.5px; font-weight: 700; }
.dt-back:active { transform: scale(.95); }
.dt-cells { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 13px; }
.dt-cells > div { background: rgba(255,150,80,.1); border: 1px solid rgba(255,150,80,.28); border-radius: 11px; padding: 8px 11px; }
.dt-cells b { display: block; font-size: 13.5px; font-weight: 900; color: #FFC79B; }
.dt-cells span { font-size: 9.5px; color: rgba(255,220,190,.66); }
.dt-ba { display: grid; grid-template-columns: 1fr; gap: 9px; }
.dt-ba .bx { border-radius: 13px; padding: 12px 13px; font-size: 12.5px; line-height: 1.75; }
.dt-ba .bx b { display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: 1px; border-radius: 6px; padding: 1.5px 9px; margin-bottom: 6px; }
.dt-ba .bf { background: #FFF7F7; border: 1px solid #FBE3E4; color: var(--t2); }

.dt-ba .af { background: var(--soft); border: 1px solid var(--line2); color: var(--t2); }
.dt-ba .af b { background: var(--og); color: #fff; }

.dt-fit .n { background: #FFF7F7; border: 1px solid #FBE3E4; color: #b03a3a; }

.dt-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }

/* 桌面增强 */
@media (min-width: 960px) {
  .cs-hero-t { font-size: 22px; }
  .cs-card { transition: transform .18s, box-shadow .18s; }
  .cs-card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(217,79,0,.14); border-color: var(--line2); }
  .dt-ba { grid-template-columns: 1fr 1fr; }
  .dt-cells { grid-template-columns: repeat(4, 1fr); }
}

/* ---------- 复制 ---------- */
function copyTxt(t) {
  function ok() { LQ.toast("已复制，可直接粘贴"); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(ok, function () { fallback(); });
  } else fallback();
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch (e) { LQ.toast("复制失败，请长按手动复制"); }
    document.body.removeChild(ta);
  }
}

  /* 改造前 / 改造后 */
  h += '<section class="rise"><div class="card"><h3 style="font-size:15px;font-weight:800;margin-bottom:11px">改造前 → 改造后</h3><div class="dt-ba">';
  h += '<div class="bx bf"><b>改造前</b>' + c.before + "</div>";
  h += '<div class="bx af"><b>改造后</b>' + c.after + "</div>";
  h += "</div></div></section>";

  /* AI 改造动作（实施步骤） */
  h += '<section class="rise"><div class="card"><h3 style="font-size:15px;font-weight:800;margin-bottom:3px">🛠️ AI 改造动作（照着做就行）</h3>';
  c.steps.forEach(function (st, i) {
    h += '<div class="dt-step"><span class="no">' + (i + 1) + '</span><div class="bd"><b>' + st[0] + "</b>：" + st[1] + "<small class=\"mt\">" + st[2] + "</small></div></div>";
  });
  h += "</div></section>";

  /* 结果数据（效果指标 + 口径） */
  h += '<section class="rise"><div class="card"><h3 style="font-size:15px;font-weight:800;margin-bottom:11px">📊 效果指标</h3><div class="cs-res">';
  c.res.forEach(function (r) {
    h += "<div><span class='k'>" + r[0] + '</span><span class="v">' + r[1] + '</span><span class="u">' + r[2] + "</span></div>";
  });
  h += '</div><div class="dt-verify">🔎 ' + c.verify + "</div></div></section>";

  /* 资产 */
  h += '<section class="rise"><div class="card"><h3 style="font-size:15px;font-weight:800;margin-bottom:11px">🎁 可直接拿去用的东西</h3>';
  c.assets.forEach(function (a, i) {
    h += '<div class="dt-asset"><div class="ah"><span class="kd">' + a.kd + "</span><b>" + a.t + '</b></div><pre>' + esc(a.c) + '</pre>' +
      '<button class="cp" type="button" data-copy="' + c.id + "_" + i + '">📋 复制全文</button></div>';
  });
  h += "</div></section>";

  /* 避坑 + 适配 */
  h += '<section class="rise"><div class="card"><h3 style="font-size:15px;font-weight:800;margin-bottom:3px">⚠️ 照做之前先看这几条</h3>';
  c.pitfalls.forEach(function (p) { h += '<div class="dt-pit"><span class="ic">✋</span><span>' + p + "</span></div>"; });
  h += '</div></section>';
  h += '<section class="rise"><div class="card"><h3 style="font-size:15px;font-weight:800;margin-bottom:11px">🎯 这套打法适不适合你</h3><div class="dt-fit">';
  h += '<div class="y"><b>✓ 适合：</b><span>' + c.fitY + "</span></div>";
  h += '<div class="n"><b>✗ 暂缓：</b><span>' + c.fitN + "</span></div>";
  h += "</div></div></section>";

  /* 照着做：投入 + 7 天清单 */
  h += '<section class="rise"><div class="card"><h3 style="font-size:15px;font-weight:800;margin-bottom:11px">🧾 照着做（启动投入）</h3>';
  h += '<div class="dt-cost"><div><b>' + c.cost[0] + "</b><span>资金投入</span></div><div><b>" + c.cost[1] + "</b><span>人力投入</span></div><div><b>" + c.cost[2] + "</b><span>上线周期</span></div></div>";
  h += '<div class="dt-acts"><button class="btn primary" type="button" data-days="1">📅 生成我的 7 天清单</button>' +
       '<button class="btn ghost" type="button" data-apply="' + c.id + '">💡 套用到我的店</button>' +
       '<button class="btn ghost" type="button" data-fav="1">⭐ 收藏案例</button></div>';
  h += '<div class="dt-days" id="dtDays" hidden>';
  APPLY_DAYS.forEach(function (d) {
    h += '<div class="dt-day"><span class="d">' + d[0] + '</span><div class="bd"><b>' + d[1] + "</b>：" + d[2] + "<small>" + d[3] + "</small></div></div>";
  });
  h += '<div style="font-size:10.5px;color:var(--t3);line-height:1.7">7 天清单为通用起步节奏，配合本案例的「AI 改造动作」逐天执行。</div></div>';
  h += "</div></section>";

  h += '<section class="rise" style="text-align:center"><button class="dt-back" type="button" data-back="1">‹ 返回案例列表</button></section>';
  return h;
}

/* ---------- 渲染 ---------- */
function listHtml(s) {
  var h = heroHtml(s) + chipsHtml();
  CASES.forEach(function (c) { h += caseHtml(s, c); });
  h += footHtml();
  return h;
}
function render() {
  var s = LQ.store();
  $("#app").innerHTML = view === "detail" ? detailHtml(s) : listHtml(s);
  if (view === "list") renderCnt();
  LQ.riseIn($("#app"));
}

/* ---------- 页面事件（委托，判空安全） ---------- */
document.addEventListener("click", function (e) {
  if (!e.target || !e.target.closest) return;
  var chip = e.target.closest(".cs-chip");
  if (chip && view === "list") {
    curF = chip.getAttribute("data-f") || "all";
    $$(".cs-chip").forEach(function (el) { el.classList.toggle("on", el === chip); });
    $$(".cs-item").forEach(function (el) {
      var cat = el.getAttribute("data-cat");
      el.classList.toggle("hide", !(curF === "all" || cat === curF));
    });
    renderCnt();
    return;
  }
  var dt = e.target.closest("[data-detail]");
  if (dt) { detailId = dt.getAttribute("data-detail"); view = "detail"; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-back]")) { view = "list"; detailId = null; render(); window.scrollTo(0, 0); return; }
  var ap = e.target.closest("[data-apply]");
  if (ap) { LQ.toast("「" + (findCase(ap.getAttribute("data-apply")) || {}).scene + "」已加入我的执行清单（演示）"); return; }
  var cp = e.target.closest("[data-copy]");
  if (cp) {
    var ids = cp.getAttribute("data-copy").split("_");
    var c = findCase(ids[0]);
    if (c && c.assets[+ids[1]]) copyTxt(c.assets[+ids[1]].kd + " · " + c.assets[+ids[1]].t + "\n" + c.assets[+ids[1]].c);
    return;
  }
  if (e.target.closest("[data-days]")) {
    var box = $("#dtDays");
    if (box) { box.hidden = !box.hidden; if (!box.hidden) box.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
    return;
  }
  if (e.target.closest("[data-fav]")) { LQ.toast("已收藏到「我的 · 常用案例」（演示）"); }
});

render();

LQ.init({ nav: "cases", title: "门店AI案例" });
})();
</script>
</body>
</html>
